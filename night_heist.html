function startNight(n){
  applyUpgrades();banner=null;keyTaken=false;
  soap=0;disguiseT=0;boostT=0;coconuts=3;shovelLvl=0;cards=0;dogTreatT=0;
  night=n;nightStolen=0;nightHurt=0;hasKey=false;flashOn=false;battery=maxBattery();hp=MAXHP;showMap=false;B=null;toms=[];splats=[];
  if(!twoP){if(upLvl('vest'))armor=true;plates=Math.max(plates,2*upLvl('plates'));}
  if(!twoP&&n%2===1){if(upLvl('kit')>=1)tomatoes=Math.max(tomatoes,10);if(upLvl('kit')>=2&&!weapon){weapon='stun';ammo=Math.max(ammo,6);}} // STARTER KIT
  if(n%2===1){
    setDims(9,7); // (night 3 replaces this with its own museum floor plan)
    initCity();
    say(n===1?'NIGHT 1: STEAL CASH, FIND THE|KEYCARD, THEN ROB THE BIG BANK!':n===3?'NIGHT 3: INSIDE THE MUSEUM! FIND|3 BLUEPRINTS, REACH THE VAULT WING':'NIGHT 5: THE GAUNTLET! CUT 3 POWER|BOXES, OPEN THE ROOF HATCH',5);
  }else{
    setDims(9,7);initJail(); // same size as the Night 1 city
    say(n===4?"NIGHT 4: ISLAND PRISON! DIG UP 4|BURIED BOAT PARTS, THEN THE DOCK":"NIGHT "+n+": LOCKED UP! PICKPOCKET|GUARDS. STEAL THE WARDEN'S KEY!",5);
  }
  addGoalGuards();if(hardMode&&!twoP)addHardCops();maybeRare();
  state='city';showHelp();
}
function update(dt){
  gameT+=dt;
  if(helpOpen){helpT+=dt;if(helpT>.4&&(pressed.start||pressed.fire||pressed.help||pressed.pause)){helpOpen=false;sfx.click();}return;}
  if(showScores){if(pressed.start||pressed.fire||pressed.scores||pressed.pause){showScores=false;sfx.click();}return;}
  if(state==='title'){updTitle();return;}
  if(state==='menu'){updMenu();return;}
  if(state==='hideout'){updHideout();return;}
  if(state==='dailyres'){storyT+=dt;if((pressed.start||pressed.fire)&&storyT>.8){resetRun();state='menu';titleSel=5;sfx.click();}return;}
  if(state==='badges'){updBadges();return;}
  if(state==='nightsel'){updNightSel();return;}
  if(state==='results'){storyT+=dt;if((pressed.start||pressed.fire)&&storyT>.8)resultsDone();return;}
  if(state==='win'){endT+=dt;if(endT>1){if(pressed.pause){resetRun();state='title';sfx.click();}else if(pressed.start||pressed.fire){if(twoP)newGame(true);else titlePick(0);}}return;} // the story loops: play the next heist
  if(state==='choose'){updChoose();return;}
  if(state==='story'){storyT+=dt;if((pressed.start||pressed.fire)&&storyT>.6){if(story.page<story.more.length){story.page++;storyT=0;sfx.click();}else{const cb=story.cb;story=null;cb();}}return;}
  if(trans){trans.t+=dt;if(!trans.fired&&trans.t>=.5){trans.fired=true;trans.cb();}if(trans.t>=1)trans=null;return;}
  if(shopOpen){updShop();return;}
  if(pressed.help&&(state==='city'||state==='bank'||state==='lock'||state==='boat')){showHelp();return;}
  if(pressed.map&&(state==='city'||state==='bank')){showMap=!showMap;sfx.click();} // 2 players: either one presses M, the race pauses while the map is open
  if(pressed.pause&&!showMap){paused=!paused;pauseSel=0;sfx.click();}
  else if(paused){
    if(pressed.up){pauseSel=(pauseSel+2)%3;sfx.click();}if(pressed.down){pauseSel=(pauseSel+1)%3;sfx.click();}
    if(pressed.start||pressed.fire){sfx.click();paused=false;
      if(pauseSel===1){cash=Math.max(0,cash-nightStolen);stolen=Math.max(0,stolen-nightStolen);
        if(sideMode)startSide(SIDES.indexOf(sideMode));else if(dailyMode)startDaily();else if(twoP)startTopRace(night);else startNight(night);}
      else if(pauseSel===2){resetRun();state='title';}}
  }
  if(showMap||paused)return;
  if(pressed.flash&&(state==='city'||state==='bank')&&!(C&&C.race)&&!(B&&B.race)){if(battery>0){flashOn=!flashOn;sfx.click();}else{say('FLASHLIGHT BATTERY IS DEAD!');sfx.deny();}}
  if(flashOn){battery-=dt;if(battery<=0){battery=0;flashOn=false;say('FLASHLIGHT BATTERY IS DEAD!');}}
  msgT-=dt;shake-=dt;hurtFlash-=dt;comboT-=dt;if(comboT<=0)comboN=0;nearCD-=dt;if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(state==='city'&&C&&C.race)updGalRace(dt);else if(state==='city')updCity(dt);else if(state==='bank'&&B&&B.race)updRace(dt);else if(state==='bank')updBank(dt);else if(state==='lock')updLock(dt);else if(state==='boat')updBoat(dt);
}
function draw(){
  if(state==='title'){drawTitle();if(helpOpen)drawHelp();if(showScores)drawScores();return;}
  if(state==='story'){drawStory();return;}
  if(state==='choose'){drawChoose();return;}
  if(state==='menu'){drawMenu();if(helpOpen)drawHelp();return;}
  if(state==='hideout'){drawHideout();return;}
  if(state==='dailyres'){drawDailyRes();return;}
  if(state==='badges'){drawBadges();return;}
  if(state==='nightsel'){drawNightSel();return;}
  if(state==='results'){drawResults();return;}
  const racing=state==='city'&&C&&C.race?drawGalRace:state==='bank'&&B&&B.race?drawRace:state==='lock'&&LK&&LK.race?drawLock:state==='boat'&&BTS&&BTS.race?drawBoatRace:null;
  if(racing){racing();if(showMap&&(state==='city'||state==='bank'))drawMap();if(helpOpen)drawHelp();if(paused)drawPause();if(trans){ctx.fillStyle=`rgba(0,0,0,${1-Math.abs(trans.t-.5)*2})`;ctx.fillRect(0,0,VW,VH);}return;}
  if(state==='lock'&&LK)drawLock();else if(state==='boat'&&BTS)drawBoat();else if(B)drawBank();else if(C)drawCity();
  if(hurtFlash>0){ctx.fillStyle=`rgba(255,0,0,${hurtFlash*.6})`;ctx.fillRect(0,0,VW,VH);}
  drawHUD();
  if(banner&&banner.lost&&state==='city'){ // the cops took your keycard: impossible to miss
    const a=Math.min(1,banner.t*2,(3-banner.t)*6),y=Math.round(60-(1-a)*20);ctx.globalAlpha=a;
    ctx.fillStyle='rgba(30,4,4,.92)';ctx.fillRect(30,y,260,52);ctx.fillStyle='#ff3030';ctx.fillRect(30,y,260,2);ctx.fillRect(30,y+50,260,2);
    ctx.fillStyle='#5ff';ctx.fillRect(44,y+16,16,11);ctx.fillStyle='#066';ctx.fillRect(44,y+19,16,3);ctx.strokeStyle='#ff3030';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(40,y+12);ctx.lineTo(64,y+31);ctx.stroke();
    txt('THE COPS TOOK YOUR',176,y+10,'#ff6b6b','center');txt('KEYCARD!',176,y+22,'#ff6b6b','center');txt('THEY HID IT. CHECK THE MAP',176,y+36,'#ffd400','center',6);
    ctx.globalAlpha=1;
  }else if(banner&&state==='city'){ // YOU FOUND A PIECE!
    const a=Math.min(1,banner.t*2,(3-banner.t)*6),y=Math.round(52-(1-a)*20);
    ctx.globalAlpha=a;ctx.fillStyle='rgba(10,8,4,.9)';ctx.fillRect(40,y,240,74);ctx.fillStyle='#ffb000';ctx.fillRect(40,y,240,2);ctx.fillRect(40,y+72,240,2);
    txt('YOU FOUND A PIECE!',VW/2,y+8,'#ffd400','center');
    const ix=72,iy=y+26,R=(a2,c,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(ix+a2,iy+c,w,h);};
    ctx.globalCompositeOperation='lighter';glow(ix+8,iy+8,22,'255,180,60',.4);ctx.globalCompositeOperation='source-over';
    if(banner.idx===0){R(7,1,2,14,'#c0c5cf');R(1,7,14,2,'#c0c5cf');R(5,5,6,6,'#6b7079');}
    else if(banner.idx===1){ctx.strokeStyle='#8a5a30';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ix+8,iy+8,6,0,7);ctx.stroke();R(7,1,2,14,'#8a5a30');R(1,7,14,2,'#8a5a30');}
    else if(banner.idx===2){R(1,3,14,11,'#3a3d44');R(2,4,12,3,'#6b7079');R(14,6,2,5,'#222');R(3,10,3,2,'#ff6b00');}
    else{R(3,2,10,13,'#c81e1e');R(10,0,4,3,'#222');R(4,5,8,2,'#ff6b6b');}
    txt(banner.name,100,y+28,'#fff');txt('PART '+banner.got+' OF 4',100,y+42,'#ffb000');
    txt(banner.got>=4?'NOW GO TO THE DOCK!':'KEEP DIGGING...',VW/2,y+58,banner.got>=4?'#7dff7d':'#9fd3ff','center');
    ctx.globalAlpha=1;
  }
  if(shopOpen)drawShop();
  if(showMap&&(state==='city'||state==='bank'))drawMap();
  if(paused)drawPause();
  if(trans){ctx.fillStyle=`rgba(0,0,0,${1-Math.abs(trans.t-.5)*2})`;ctx.fillRect(0,0,VW,VH);}
  if(state==='win')drawEnd();
  if(helpOpen)drawHelp();
  if(showScores)drawScores();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  let gdt=dt;if(slowT>0){slowT-=dt;gdt=dt*.35;}
  update(gdt);draw();drawToasts(dt);musicTick();
  {const mb=document.getElementById('muteBtn'),want=muted?'SOUND: OFF':!actx||actx.state!=='running'?'SOUND: CLICK TO START':'SOUND: ON';if(mb.textContent!==want)mb.textContent=want;}
  if(!scoresAllowed())showScores=false;
  document.getElementById('scoreBtn').style.display=scoresAllowed()?'':'none';
  {const hb=document.getElementById('hideBtn'),show=hideoutOK()?'':'none',top=scoresAllowed()?'68px':'38px';if(hb.style.display!==show)hb.style.display=show;if(hb.style.top!==top)hb.style.top=top;}
  for(const k in pressed)delete pressed[k];
  for(const k in rawPressed)delete rawPressed[k];
  requestAnimationFrame(frame);
}
// scores can only be viewed on the title screen and the final screen, never while playing
const scoresAllowed=()=>state==='title'||state==='win';
document.getElementById('hideBtn').onclick=e=>{initAudio();if(hideoutOK())openHideout();e.target.blur();};
document.getElementById('scoreBtn').onclick=e=>{initAudio();if(scoresAllowed())showScores=!showScores;e.target.blur();};
document.getElementById('helpBtn').onclick=e=>{initAudio();if(helpOpen)helpOpen=false;else showHelp();e.target.blur();};
// ===== TEST MENU (temporary) — REMOVE WHEN DONE =====
(()=>{
  const list=document.getElementById('testList'),btn=document.getElementById('testBtn');
  const fresh=two=>{initAudio();resetRun();testMode=true;twoP=!!two;showScores=false;}; // test runs never save scores or unlock nights
  const go=(n,part)=>{fresh(false);startNight(n);
    if(part==='inside'){hasKey=true;if(n%2){state='bank';initBank();}else if(n===2)startLock();else startBoat();}};
  const go2=(n,part)=>{fresh(true);
    if(part==='inside'){night=n;nightStolen=0;C=null;RSTATS={lead:null,fin:null,loot:[0,0],steals:[0,0],hits:[0,0]};startInterior(null,null);}
    else startTopRace(n);};
  const items=[
    ['--- SOLO (NO VINNIE) ---',null],
    ['NIGHT 1: CITY',()=>go(1)],['NIGHT 1: THE BIG BANK',()=>go(1,'inside')],
    ['NIGHT 2: JAIL',()=>go(2)],['NIGHT 2: GIANT LOCK',()=>go(2,'inside')],
    ['NIGHT 3: MUSEUM HALLS',()=>go(3)],['NIGHT 3: THE MOONSTONE',()=>go(3,'inside')],
    ['NIGHT 4: ISLAND PRISON',()=>go(4)],['NIGHT 4: BOAT ESCAPE',()=>go(4,'inside')],
    ['NIGHT 5: ROOFTOPS',()=>go(5)],['NIGHT 5: FEDERAL RESERVE',()=>go(5,'inside')],
    ['ENDING (FINAL CHOICE)',()=>{go(5,'inside');crackVault();}],
    ['--- WITH VINNIE (2 PLAYERS) ---',null],
    ['NIGHT 1: CITY RACE',()=>go2(1)],['NIGHT 1: BANK RACE',()=>go2(1,'inside')],
    ['NIGHT 2: JAIL RACE',()=>go2(2)],['NIGHT 2: LOCK RACE',()=>go2(2,'inside')],
    ['NIGHT 3: MUSEUM RACE',()=>go2(3)],['NIGHT 3: MOONSTONE RACE',()=>go2(3,'inside')],
    ['NIGHT 4: ISLAND RACE',()=>go2(4)],['NIGHT 4: BOAT RACE',()=>go2(4,'inside')],
    ['NIGHT 5: ROOFTOP RACE',()=>go2(5)],['NIGHT 5: RESERVE RACE',()=>go2(5,'inside')],
    ['2P ENDING SCREEN',()=>{fresh(true);night=5;SEASON=[3,2];nightLog=[1,2,3,4,5].map(n=>({n,kind:NIGHT_NAMES[n],v:0,h:0,w:n%2?0:1}));toEnd('win');}],
    ['--- PROGRESS ---',null],
    ['SIDE JOB: JEWELRY STORE',()=>{fresh(false);state='menu';openHideout();startSide(0);}],['SIDE JOB: MAYOR\'S MANSION',()=>{fresh(false);state='menu';openHideout();startSide(1);}],['SIDE JOB: CASINO VAULT',()=>{fresh(false);state='menu';openHideout();startSide(2);}],
    ['HIDEOUT SCREEN',()=>{fresh(false);testMode=false;state='menu';openHideout();}],
    ['BADGES SCREEN',()=>{fresh(false);testMode=false;state='badges';}],
    ['NIGHT 1 IN HARD MODE',()=>{fresh(false);hardMode=true;startNight(1);}],
    ['GIVE STASH $50000',()=>{save.stash+=50000;writeSave();}],
    ['UNLOCK HARD MODE',()=>{save.hard=true;writeSave();}],
    ['RESET STASH/UPGRADES/BADGES',()=>{if(confirm('Erase your stash, upgrades and badges?')){save={stash:0,up:{},badges:{},stats:{},hard:false};writeSave();}}],
    ['--- CHEATS ---',null],
    ['GIVE $5000',()=>{cash+=5000;}],
    ['GIVE KEY / PLANS / PARTS',()=>{hasKey=true;if(C&&C.pieces)for(const k of C.pieces)k.got=true;if(C&&C.mounds){for(const m of C.mounds)m.dug=true;if(C.parts)for(const pt of C.parts)pt.got=true;}if(C&&C.boxes)for(const b of C.boxes)b.cut=true;if(cops)for(const c of cops)c.hasKeyCard=false;
      if(GRACE&&C&&C.race){const p=GRACE.pl[0];while(p.pieces<GRACE.need){p.got.push({kind:'none',k:{}});p.pieces++;}}}],
    ['FULL HEARTS',()=>{hp=MAXHP;if(GRACE)for(const p of GRACE.pl)p.hp=MAXHP;}],
    ['UNLOCK ALL NIGHTS (SELECT)',()=>{try{localStorage.setItem('nh_unlocked','5');}catch(e){}}],
    ['TITLE SCREEN',()=>{resetRun();state='title';}]
  ];
  for(const [label,fn] of items){
    if(!fn){const h=document.createElement('div');h.textContent=label;h.style.cssText='color:#ff0;margin:6px 0 2px;font:bold 10px monospace';list.appendChild(h);continue;}
    const b=document.createElement('button');b.textContent=label;
    b.style.cssText='display:block;width:100%;margin:2px 0;background:#222;color:#ff0;border:1px solid #555;padding:3px 6px;font:11px monospace;text-align:left;cursor:pointer';
    b.onclick=()=>{fn();list.style.display='none';b.blur();btn.blur();};list.appendChild(b);
  }
  btn.onclick=()=>{list.style.display=list.style.display==='none'?'block':'none';btn.blur();};
})();
// ===== END TEST MENU =====
// ===== SOUND ON/OFF =====
let muted=false;try{localStorage.removeItem('nh_mute');}catch(e){} // sound always starts ON
function setMute(m){muted=m;if(music.master)music.master.gain.value=m?0:.8;document.getElementById('muteBtn').textContent=m?'SOUND: OFF':'SOUND: ON';if(!m)music.on=true;}
document.getElementById('muteBtn').onclick=e=>{const waking=/CLICK TO START/.test(e.target.textContent);initAudio();if(!waking)setMute(!muted);e.target.blur();};setMute(muted);
// ===== TOUCH CONTROLS (phones / tablets): on-screen buttons that press the real keys =====
(()=>{
  if(!('ontouchstart' in window)&&!(navigator.maxTouchPoints>0))return;
  const box=document.getElementById('touch');box.style.display='block';
  const mk=(label,key,code,css)=>{const b=document.createElement('div');b.textContent=label;
    b.style.cssText='position:fixed;z-index:10;width:52px;height:52px;border-radius:12px;background:rgba(40,40,80,.55);border:2px solid rgba(255,212,0,.6);color:#ffd400;font:bold 13px monospace;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;'+css;
    const send=t=>dispatchEvent(new KeyboardEvent(t,{key,code,bubbles:true}));let down=false;
    b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(!down){down=true;send('keydown');}});
    for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,e=>{e.preventDefault();if(down){down=false;send('keyup');}});
    box.appendChild(b);};
  mk('▲','ArrowUp','ArrowUp','left:66px;bottom:122px');mk('▼','ArrowDown','ArrowDown','left:66px;bottom:10px');
  mk('◀','ArrowLeft','ArrowLeft','left:10px;bottom:66px');mk('▶','ArrowRight','ArrowRight','left:122px;bottom:66px');
  mk('OK','Enter','Enter','right:10px;bottom:66px');mk('FIRE',' ','Space','right:66px;bottom:10px');
  mk('F','f','KeyF','right:122px;bottom:66px');mk('T','t','KeyT','right:66px;bottom:122px');
  mk('II','p','KeyP','right:10px;bottom:178px;width:40px;height:40px');mk('M','m','KeyM','right:56px;bottom:178px;width:40px;height:40px');
})();
(document.fonts&&document.fonts.load?document.fonts.load("8px 'Press Start 2P'").catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
