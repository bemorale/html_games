<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;box-shadow:0 0 40px rgba(80,120,255,.25)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #crt{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px);
    box-shadow:inset 0 0 90px rgba(0,0,0,.75)}
</style>

<body>
<div id="wrap"><canvas id="c"></canvas><div id="crt"></div></div>
<script>
'use strict';
// ================= SETUP =================
const VW=320,VH=224,T=16,MAXL=3;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW;cv.height=VH;
const lc=document.createElement('canvas');lc.width=VW;lc.height=VH;const lx=lc.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){
  let s=Math.min(innerWidth/VW,innerHeight/VH);
  if(s>=2)s=Math.floor(s);
  wrap.style.width=cv.style.width=Math.floor(VW*s)+'px';
  wrap.style.height=cv.style.height=Math.floor(VH*s)+'px';
}
addEventListener('resize',fit);fit();

const FONT="'Press Start 2P', monospace";
const rI=n=>Math.floor(Math.random()*n);
const pick=a=>a[rI(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
function txt(s,x,y,col='#fff',al='left',sz=8){
  ctx.font=sz+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';
  ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

// ================= INPUT =================
const keys={},pressed={};let lastDir='down';
const KEYMAP={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',
  ArrowRight:'right',d:'right',D:'right',f:'flash',F:'flash',m:'map',M:'map',p:'pause',P:'pause',Escape:'pause',
  Enter:'start',' ':'fire',x:'fire',X:'fire',e:'use',E:'use'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.key];if(!k)return;e.preventDefault();initAudio();
  if(!keys[k])pressed[k]=true;keys[k]=true;
  if(k==='up'||k==='down'||k==='left'||k==='right')lastDir=k;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// ================= AUDIO =================
let actx=null;
function initAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  else if(actx.state==='suspended')actx.resume();
}
function beep(f,d,type='square',vol=.05,slide=0,delay=0){
  if(!actx)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  coin:()=>{beep(988,.05);beep(1319,.09,'square',.05,0,.05);},
  big:()=>{beep(784,.06);beep(1047,.06,'square',.05,0,.06);beep(1568,.12,'square',.05,0,.12);},
  hurt:()=>beep(220,.35,'sawtooth',.08,-170),
  shoot:()=>beep(900,.08,'square',.035,-700),
  zapGun:()=>beep(1800,.12,'sawtooth',.04,-1400),
  jump:()=>beep(330,.12,'square',.035,330),
  click:()=>beep(1200,.03,'square',.03),
  alarm:()=>{beep(880,.08,'square',.04);beep(660,.08,'square',.04,0,.09);},
  key:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.1,'square',.05,0,i*.08));},
  deny:()=>beep(140,.15,'square',.05),
  zap:()=>beep(1400,.3,'sawtooth',.06,-1200),
  buy:()=>{[659,880,1175].forEach((f,i)=>beep(f,.09,'square',.05,0,i*.07));},
  horn:()=>{beep(330,.15,'square',.05);beep(330,.2,'square',.05,0,.2);},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.16,'square',.05,0,i*.13));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>beep(f,.22,'triangle',.07,0,i*.2));},
  cp:()=>{beep(660,.08);beep(990,.12,'square',.05,0,.08);}
};

// ================= GLOBAL STATE =================
let state='title',cash=0,cityCash=0,spent=0,lives=MAXL,battery=600,flashOn=false,hasKey=false;
let showMap=false,paused=false,msg='',msgT=0,shake=0,hurtFlash=0,endT=0,trans=null,gameT=0;
let speedLvl=0,weapon=null,ammo=0,fireCD=0,shopOpen=false,shopSel=0;
let floaters=[];
const cam={x:0,y:0};
function say(t,d=2.6){msg=t;msgT=d;}
function floatTxt(x,y,s,col='#7dff7d'){floaters.push({x,y,s,col,t:1});}
function startTrans(cb){trans={t:0,cb,fired:false};}
function toEnd(s){state=s;endT=0;flashOn=false;shopOpen=false;if(s==='win')sfx.win();else sfx.lose();}

// ================= CITY =================
const NBX=9,NBY=7,CW=NBX*12+2,CH=NBY*11+2,WW=CW*T,WH=CH*T;
const BKX=NBX-1,BKY=NBY-1,BK0X=12*BKX+3,BK1X=12*BKX+10,BK0Y=11*BKY+3,BK1Y=11*BKY+9;
const TR=0,TS=1,TB=2,TA=3,TD=4,TK=5,TKD=6; // road, sidewalk, building, alley, door(hideout), bank, bank door
const DIRS=[[0,-1],[0,1],[-1,0],[1,0]];
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let C,P,cars,cops,bullets,bolts,picks,truck,lanes,cityTime=0,lockMsgT=0,lastSeenG=null,copsSee=false,keyPick=null,lostPiles=[];
const ct=(x,y)=>(x<0||y<0||x>=CW||y>=CH)?TB:C.g[y*CW+x];
const solidCity=t=>t===TB||t===TK||t===TD||t===TKD;
const walkP=(x,y)=>{const t=ct(x,y);return t===TR||t===TS||t===TA||t===TD||(t===TKD&&hasKey);};
const walkC=(x,y)=>{const t=ct(x,y);return t===TR||t===TS||t===TA;};
const wanted=()=>!!cops&&cops.some(c=>c.state==='chase');

function genCity(){
  const g=new Uint8Array(CW*CH),dark=new Uint8Array(CW*CH),blk=new Int16Array(CW*CH).fill(-1);
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const mx=x%12,my=y%11,i=y*CW+x;
    if(mx<=1||my<=1)g[i]=TR;
    else if(mx===2||mx===11||my===2||my===10)g[i]=TS;
    else{g[i]=TB;blk[i]=Math.floor(x/12)+Math.floor(y/11)*NBX;}
  }
  for(let y=BK0Y;y<=BK1Y;y++)for(let x=BK0X;x<=BK1X;x++)g[y*CW+x]=TK;
  g[BK1Y*CW+BK0X+3]=TKD;g[BK1Y*CW+BK0X+4]=TKD;
  const isBank=(bx,by)=>bx===BKX&&by===BKY;
  // keycard goes in a block far from the start (top-left)
  const cand=[];
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++)if(!isBank(bx,by)&&bx+by>=NBX+NBY-6)cand.push([bx,by]);
  const kb=pick(cand);
  const alleys=[];let key=null;
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    const isK=kb[0]===bx&&kb[1]===by;
    if(!isK&&Math.random()>0.45)continue;
    const tiles=[];
    if(Math.random()<0.5){const ax=12*bx+5+rI(4);for(let y=11*by+3;y<=11*by+9;y++)tiles.push([ax,y]);}
    else{const ay=11*by+4+rI(4);for(let x=12*bx+3;x<=12*bx+10;x++)tiles.push([x,ay]);}
    for(const [x,y] of tiles){g[y*CW+x]=TA;dark[y*CW+x]=1;}
    alleys.push(tiles);
    if(isK)key=tiles[Math.floor(tiles.length/2)];
  }
  // hideout doors
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    let n=0,tries=0;
    while(n<2&&tries<60){
      tries++;const s=rI(4);let x,y,ox=0,oy=0;
      if(s===0){x=12*bx+4+rI(6);y=11*by+3;oy=-1;}
      else if(s===1){x=12*bx+4+rI(6);y=11*by+9;oy=1;}
      else if(s===2){x=12*bx+3;y=11*by+4+rI(5);ox=-1;}
      else{x=12*bx+10;y=11*by+4+rI(5);ox=1;}
      if(g[y*CW+x]!==TB||g[(y+oy)*CW+x+ox]!==TS)continue;
      g[y*CW+x]=TD;n++;
    }
  }
  const lights=[];
  for(let i=0;i<=NBX;i++)for(let j=0;j<=NBY;j++){
    for(const [x,y] of [[12*i-1,11*j-1],[12*i+2,11*j-1],[12*i-1,11*j+2],[12*i+2,11*j+2]]){
      if(x<0||y<0||x>=CW||y>=CH||g[y*CW+x]!==TS)continue;
      if(Math.random()<0.45)lights.push({x:x*T+8,y:y*T+8});
    }
  }
  return {g,dark,blk,alleys,key,lights};
}

const PAL_BLD=[['#6b2f2f','#4f2121'],['#2f4a6b','#223853'],['#5a4630','#43341f'],['#3d5a35','#2c4426'],['#56355e','#3f2546'],['#5e5e66','#45454c']];
function renderCity(){
  const c=document.createElement('canvas');c.width=WW;c.height=WH;const g=c.getContext('2d');
  const r=Math.random,pal={};
  for(let i=0;i<NBX*NBY;i++)pal[i]=pick(PAL_BLD);
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const t=C.g[y*CW+x],X=x*T,Y=y*T,mx=x%12,my=y%11;
    if(t===TR){
      R(X,Y,T,T,'#2b2b35');
      for(let k=0;k<4;k++)R(X+rI(16),Y+rI(16),1,1,'#363642');
      const inter=mx<=1&&my<=1;
      if(!inter){
        if(my<=1&&(mx===2||mx===11)){for(let i=1;i<16;i+=4)R(X+2,Y+i,12,2,'#cfcfcf');}
        else if(mx<=1&&(my===2||my===10)){for(let i=1;i<16;i+=4)R(X+i,Y+2,2,12,'#cfcfcf');}
        else if(my===0&&mx>1){for(let i=1;i<16;i+=8)R(X+i,Y+15,5,1,'#e8c547');}
        else if(my===1&&mx>1){for(let i=1;i<16;i+=8)R(X+i,Y,5,1,'#e8c547');}
        else if(mx===0&&my>1){for(let i=1;i<16;i+=8)R(X+15,Y+i,1,5,'#e8c547');}
        else if(mx===1&&my>1){for(let i=1;i<16;i+=8)R(X,Y+i,1,5,'#e8c547');}
      }
    }else if(t===TS){
      R(X,Y,T,T,'#74747e');R(X,Y,T,1,'#62626b');R(X,Y,1,T,'#62626b');
      if(ct(x,y-1)===TR)R(X,Y,T,2,'#a3a3ad');
      if(ct(x,y+1)===TR)R(X,Y+14,T,2,'#a3a3ad');
      if(ct(x-1,y)===TR)R(X,Y,2,T,'#a3a3ad');
      if(ct(x+1,y)===TR)R(X+14,Y,2,T,'#a3a3ad');
    }else if(t===TB){
      const p=pal[C.blk[y*CW+x]]||PAL_BLD[0];
      const below=ct(x,y+1);
      if(below!==TB){
        R(X,Y,T,T,p[1]);R(X,Y+15,T,1,'#111');
        R(X+3,Y+4,4,6,r()<.35?'#ffd75e':'#151a2a');R(X+9,Y+4,4,6,r()<.35?'#ffd75e':'#151a2a');
        R(X+2,Y+10,6,1,'#222');R(X+8,Y+10,6,1,'#222');
      }else{
        R(X,Y,T,T,p[0]);
        if(ct(x,y-1)!==TB)R(X,Y,T,2,'rgba(255,255,255,.18)');
        if(ct(x-1,y)!==TB)R(X,Y,2,T,'rgba(255,255,255,.12)');
        if(ct(x+1,y)!==TB)R(X+14,Y,2,T,'rgba(0,0,0,.25)');
        for(let k=0;k<3;k++)R(X+rI(15),Y+rI(15),2,1,'rgba(0,0,0,.15)');
        if(r()<.07){R(X+3,Y+3,10,9,'#8a8a92');R(X+4,Y+5,8,1,'#555');R(X+4,Y+7,8,1,'#555');R(X+4,Y+9,8,1,'#555');R(X+3,Y+12,10,1,'#222');}
      }
    }else if(t===TA){
      R(X,Y,T,T,'#1d1913');
      if(r()<.35)R(X+rI(10),Y+rI(10),4+rI(3),3,'#3a3020');
      if(r()<.2)R(X+rI(8),Y+rI(10),6,3,'#232c40');
      if(r()<.15){R(X+3,Y+3,9,8,'#2f4a2f');R(X+3,Y+3,9,2,'#3d5d3d');}
    }else if(t===TD){
      R(X,Y,T,T,'#3a2414');R(X+2,Y+2,12,14,'#6b4a2a');R(X+4,Y+4,8,12,'#0d0806');
      R(X+6,Y+1,4,2,'#3f3');R(X+10,Y+10,1,1,'#ffd400');
    }else if(t===TK||t===TKD){
      if(t===TKD){R(X,Y,T,T,'#d4a017');R(X+2,Y+2,12,14,'#5a3d0a');R(X+7,Y+2,2,14,'#d4a017');}
      else if(y===BK1Y){R(X,Y,T,T,'#cfc8b4');R(X+3,Y,4,T,'#efe9d6');R(X+3,Y,4,2,'#d4a017');R(X+10,Y+4,4,8,'#151a2a');}
      else{R(X,Y,T,T,(x+y)%2?'#ddd6c2':'#d2cab4');
        if(ct(x,y-1)!==TK)R(X,Y,T,3,'#d4a017');
        if(ct(x-1,y)!==TK&&ct(x-1,y)!==TKD)R(X,Y,3,T,'#d4a017');
        if(ct(x+1,y)!==TK&&ct(x+1,y)!==TKD)R(X+13,Y,3,T,'#d4a017');}
    }
  }
  const bcx=(BK0X+4)*T,bcy=(BK0Y+2)*T;
  g.textAlign='center';g.textBaseline='middle';
  g.font='24px '+FONT;g.fillStyle='#8a6a0a';g.fillText('$',bcx+2,bcy+10);g.fillStyle='#ffd400';g.fillText('$',bcx,bcy+8);
  g.font='8px '+FONT;g.fillStyle='#5a3d0a';g.fillText('BIG BANK',bcx,bcy+42);
  return c;
}

const COLS=['#d23c3c','#3c7bd2','#e8c547','#3cb371','#e8e8e8','#9b59b6','#ff8c1a'];
function initCity(){
  C=genCity();C.img=renderCity();
  P={tx:2,ty:2,x:32,y:32,ttx:2,tty:2,dx:0,dy:1,dir:'down',moving:false,anim:0,hidden:false,inv:0};
  cars=[];lanes=[];
  for(let i=0;i<=NBY;i++)for(let l=0;l<2;l++){
    const row=11*i+l,d=l===0?-1:1,sp=45+Math.random()*35,off=Math.random()*WW;
    lanes.push({id:'h'+row,ax:'x',d,y:row*T+2});
    for(let k=0;k<2;k++)cars.push({lane:'h'+row,ax:'x',d,sp,x:(off+k*WW/2)%WW,y:row*T+2,w:20,h:12,col:pick(COLS)});
  }
  for(let j=0;j<=NBX;j++)for(let l=0;l<2;l++){
    const col=12*j+l,d=l===0?1:-1,sp=45+Math.random()*35,off=Math.random()*WH,n=Math.random()<.5?1:2;
    lanes.push({id:'v'+col,ax:'y',d,x:col*T+2});
    for(let k=0;k<n;k++)cars.push({lane:'v'+col,ax:'y',d,sp,x:col*T+2,y:(off+k*WH/2)%WH,w:12,h:20,col:pick(COLS)});
  }
  // black & white police cruisers
  for(let i=0;i<4;i++){
    const ln=pick(lanes),c={lane:ln.id,ax:ln.ax,d:ln.d,sp:80+Math.random()*12,cop:true,col:'#111'};
    if(ln.ax==='x')Object.assign(c,{x:Math.random()*WW,y:ln.y,w:20,h:12});else Object.assign(c,{x:ln.x,y:Math.random()*WH,w:12,h:20});
    if(Math.abs(c.x-32)+Math.abs(c.y-32)<250){i--;continue;}
    cars.push(c);
  }
  // the pink shop truck
  truck={truck:true,col:'#ff5fb4',sp:48,mode:'drive',t:3};
  cars.push(truck);placeTruck(18);
  cops=[];
  const mkCop=(x,y)=>cops.push({tx:x,ty:y,x:x*T,y:y*T,ttx:x,tty:y,dx:1,dy:0,moving:false,state:'patrol',lost:0,alert:0,shootT:1,anim:0,role:0});
  let tries=0;
  while(cops.length<14&&tries<4000){tries++;const x=rI(CW),y=rI(CH);if(C.g[y*CW+x]!==TS||Math.abs(x-2)+Math.abs(y-2)<18)continue;mkCop(x,y);}
  mkCop(BK0X+1,BK1Y+1);mkCop(BK1X-1,BK1Y+1);
  picks=[];const used=new Set([2*CW+2]);
  const add=(x,y,type,val)=>{const k=y*CW+x;if(used.has(k))return false;used.add(k);const o={x,y,type,val,ph:Math.random()*6,got:false};picks.push(o);return o;};
  keyPick=add(C.key[0],C.key[1],'key',0);
  let n=0;while(n<60){const x=rI(CW),y=rI(CH);if(C.g[y*CW+x]===TR&&Math.abs(x-2)+Math.abs(y-2)>4&&add(x,y,'wad',50))n++;}
  n=0;while(n<45){const x=rI(CW),y=rI(CH);if(C.g[y*CW+x]===TS&&add(x,y,'bill',20))n++;}
  for(const al of C.alleys){let m=0,tr=0;const want=1+rI(2);while(m<want&&tr<30){tr++;const [x,y]=pick(al);if(add(x,y,'bag',150))m++;}}
  bullets=[];bolts=[];lostPiles=[];shopBlock=false;cityTime=0;floaters=[];lastSeenG=null;copsSee=false;
}

// drop the truck onto a random lane far from the player
function placeTruck(minTiles){
  for(let tries=0;tries<300;tries++){
    const ln=pick(lanes);
    if(ln.ax==='x')Object.assign(truck,{lane:ln.id,ax:'x',d:ln.d,x:Math.random()*(WW-40),y:ln.y,w:28,h:12});
    else Object.assign(truck,{lane:ln.id,ax:'y',d:ln.d,x:ln.x,y:Math.random()*(WH-40),w:12,h:28});
    const dist=(Math.abs(truck.x-P.x)+Math.abs(truck.y-P.y))/T;
    if(dist<minTiles&&tries<250)continue;
    if(cars.some(o=>o!==truck&&o.lane===truck.lane&&Math.abs((o.ax==='x'?o.x-truck.x:o.y-truck.y))<50))continue;
    break;
  }
  truck.mode='drive';truck.t=2+Math.random()*3;
}
function truckCanPark(c){
  if(c.ax==='x'){const o=((c.x%192)+192)%192;return o>=48&&o+c.w<=176;}
  const o=((c.y%176)+176)%176;return o>=48&&o+c.h<=160;
}

function sig(){const m=cityTime%8;return{h:m<3,v:m>=4&&m<7};}
function carCanGo(c){
  const s=sig(),green=c.ax==='x'?s.h:s.v;
  const sirens=c.cop&&wanted(),rush=c.truck&&c.mode==='leave';
  if(!green&&!sirens&&!rush){
    if(c.ax==='x'){
      const front=c.d>0?c.x+c.w:c.x;
      for(let j=0;j<=NBX;j++){const a=j*192,b=a+32;const d=c.d>0?a-front:front-b;if(d>=0&&d<6)return false;}
    }else{
      const front=c.d>0?c.y+c.h:c.y;
      for(let i=0;i<=NBY;i++){const a=i*176,b=a+32;const d=c.d>0?a-front:front-b;if(d>=0&&d<6)return false;}
    }
  }
  for(const o of cars){
    if(o===c||o.lane!==c.lane)continue;
    let gap;
    if(c.ax==='x')gap=c.d>0?o.x-(c.x+c.w):c.x-(o.x+o.w);
    else gap=c.d>0?o.y-(c.y+c.h):c.y-(o.y+o.h);
    if(gap>=0&&gap<5)return false;
  }
  return true;
}

const prevArr=new Int32Array(CW*CH);
function bfsStep(sx,sy,gx,gy){
  if(sx===gx&&sy===gy)return null;
  prevArr.fill(-1);const s=sy*CW+sx,goal=gy*CW+gx;prevArr[s]=s;const q=[s];let h=0;
  while(h<q.length){
    const cur=q[h++];if(cur===goal)break;
    const cx=cur%CW,cy=(cur/CW)|0;
    for(const [dx,dy] of DIRS){
      const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=CW||ny>=CH)continue;
      const n=ny*CW+nx;if(prevArr[n]!==-1||!walkC(nx,ny))continue;prevArr[n]=cur;q.push(n);
    }
  }
  if(prevArr[goal]===-1)return null;
  let cur=goal;while(prevArr[cur]!==s)cur=prevArr[cur];
  return [cur%CW,(cur/CW)|0];
}
function nearestWalk(x,y){
  for(let r=0;r<=3;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    if(walkC(x+dx,y+dy))return [x+dx,y+dy];
  }
  return null;
}
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy,x=x0,y=y0;
  while(!(x===x1&&y===y1)){
    const e2=2*err;if(e2>=dy){err+=dy;x+=sx;}if(e2<=dx){err+=dx;y+=sy;}
    if(x===x1&&y===y1)break;if(solidCity(ct(x,y)))return false;
  }
  return true;
}
function patrolStep(c){
  const opts=DIRS.filter(([dx,dy])=>walkC(c.tx+dx,c.ty+dy));if(!opts.length)return null;
  const fwd=opts.find(d=>d[0]===c.dx&&d[1]===c.dy);
  if(fwd&&Math.random()<.75)return [c.tx+fwd[0],c.ty+fwd[1]];
  const nr=opts.filter(d=>!(d[0]===-c.dx&&d[1]===-c.dy));
  const p=pick(nr.length?nr:opts);return [c.tx+p[0],c.ty+p[1]];
}
// where this cop heads: the closest cop goes straight for you, the others cut you off and flank
function chaseTarget(c,ptx,pty){
  const [lx0,ly0]=lastSeenG;
  if(!copsSee||c.role===0||c.dist<=3)return [lx0,ly0];
  const fx=P.dx,fy=P.dy;let ox,oy;
  if(c.role===1){ox=fx*6;oy=fy*6;}
  else if(c.role===2){ox=-fy*5+fx*2;oy=fx*5+fy*2;}
  else if(c.role===3){ox=fy*5+fx*2;oy=-fx*5+fy*2;}
  else{ox=-fx*5;oy=-fy*5;}
  return nearestWalk(lx0+ox,ly0+oy)||[lx0,ly0];
}
function stepMover(m,sp,dt){
  const tx=m.ttx*T,ty=m.tty*T,ddx=tx-m.x,ddy=ty-m.y,d=Math.abs(ddx)+Math.abs(ddy);
  m.anim+=dt;
  if(d<=sp*dt){m.x=tx;m.y=ty;m.tx=m.ttx;m.ty=m.tty;m.moving=false;return true;}
  m.x+=Math.sign(ddx)*sp*dt;m.y+=Math.sign(ddy)*sp*dt;return false;
}
// a stunned cop wakes up at least 5 blocks away from the player
function zapCop(c){
  const ptx=Math.round(P.x/T),pty=Math.round(P.y/T);
  let best=null,bestD=-1;
  for(let i=0;i<500;i++){
    const x=rI(CW),y=rI(CH);if(C.g[y*CW+x]!==TS)continue;
    const bd=Math.abs(x-ptx)/12+Math.abs(y-pty)/11;
    if(bd>bestD){bestD=bd;best=[x,y];}
    if(bd>=5){best=[x,y];break;}
  }
  floatTxt(c.x+8,c.y,'ZAP!','#7ff');sfx.zap();
  Object.assign(c,{tx:best[0],ty:best[1],ttx:best[0],tty:best[1],x:best[0]*T,y:best[1]*T,moving:false,state:'patrol',lost:0,alert:0,shootT:1.5});
}

// caught or knocked out: drop ALL cash on the spot (hidden from the map),
// wake up somewhere far from the bank, the keycard and every lost pile
function bust(why){
  const lost=cash,dx=P.x,dy=P.y;
  if(lost>0)lostPiles.push({x:dx,y:dy,val:lost,ph:Math.random()*6});
  cash=0;
  const avoid=[[dx/T,dy/T],[BK0X+3,BK1Y]];
  if(!hasKey)avoid.push(C.key);
  for(const p of lostPiles)avoid.push([p.x/T,p.y/T]);
  let best=null,bestS=-1;
  for(let i=0;i<800;i++){
    const x=rI(CW),y=rI(CH);if(C.g[y*CW+x]!==TS)continue;
    let s=Infinity;for(const [ax,ay] of avoid)s=Math.min(s,Math.abs(x-ax)+Math.abs(y-ay));
    for(const c of cops)s=Math.min(s,(Math.abs(x-c.tx)+Math.abs(y-c.ty))*3);
    if(s>bestS){bestS=s;best=[x,y];}
  }
  Object.assign(P,{tx:best[0],ty:best[1],ttx:best[0],tty:best[1],x:best[0]*T,y:best[1]*T,moving:false,inv:2.5,hidden:false});
  for(const c of cops){c.state='patrol';c.lost=0;c.alert=0;}
  lastSeenG=null;bullets=[];bolts=[];hurtFlash=.8;
  say(why+(lost>0?'|YOU DROPPED $'+lost+'. GO FIND IT!':'|YOU WAKE UP ACROSS TOWN'),4.5);
}

function updCity(dt){
  cityTime+=dt;lockMsgT-=dt;P.inv-=dt;fireCD-=dt;
  // --- player
  let want=keys[lastDir]?lastDir:['up','down','left','right'].find(k=>keys[k]);
  const pSpeed=74+14*speedLvl;
  if(P.moving){
    if(want){const [wx,wy]=DV[want];
      if(wx===-P.dx&&wy===-P.dy){const ox=P.tx,oy=P.ty;P.tx=P.ttx;P.ty=P.tty;P.ttx=ox;P.tty=oy;P.dx=wx;P.dy=wy;P.dir=want;}}
    if(stepMover(P,pSpeed,dt)){if(ct(P.tx,P.ty)===TKD){enterBank();return;}}
  }
  if(!P.moving&&want){
    const [dx,dy]=DV[want];P.dir=want;P.dx=dx;P.dy=dy;
    const nx=P.tx+dx,ny=P.ty+dy;
    if(ct(nx,ny)===TKD&&!hasKey){if(lockMsgT<=0){say('BANK LOCKED! FIND THE KEYCARD|CHECK YOUR MAP [M]');sfx.deny();lockMsgT=2.5;}}
    else if(walkP(nx,ny)){P.ttx=nx;P.tty=ny;P.moving=true;}
  }
  const ptx=Math.round(P.x/T),pty=Math.round(P.y/T);
  P.hidden=ct(ptx,pty)===TD;
  // --- shop / weapon
  if(shopBlock&&!nearTruck())shopBlock=false;
  if(!shopBlock&&!P.hidden&&nearTruck()){shopOpen=true;shopSel=0;sfx.horn();return;}
  if(pressed.fire){
    if(!weapon)say('NO WEAPON! BUY ONE AT THE|PINK SHOP TRUCK ($1500)',2);
    else if(ammo<=0){say('OUT OF AMMO! FIND THE|PINK SHOP TRUCK',2);sfx.deny();}
    else if(fireCD<=0&&!P.hidden){
      ammo--;fireCD=.3;sfx.zapGun();
      const base=Math.atan2(P.dy,P.dx),angs=weapon==='spread'?[base-.25,base,base+.25]:[base];
      for(const a of angs)bolts.push({x:P.x+8,y:P.y+8,vx:Math.cos(a)*230,vy:Math.sin(a)*230,life:.9});
    }
  }
  // --- cars (incl. cop cruisers and shop truck)
  for(const c of cars){
    let sp=c.sp;
    if(c.truck){
      c.t-=dt;
      if(c.mode==='park'){sp=0;if(c.t<=0){c.mode='drive';c.t=4+Math.random()*4;}}
      else if(c.mode==='drive'){if(c.t<=0&&truckCanPark(c)){c.mode='park';c.t=9+Math.random()*5;sp=0;}}
      else{sp=c.sp*1.8;if(c.t<=0){placeTruck(35);continue;}}
    }
    if(c.cop&&wanted())sp*=1.35;
    if(sp&&!carCanGo(c))sp=0;
    if(c.ax==='x'){c.x+=c.d*sp*dt;if(c.x>WW+4)c.x=-c.w-4;if(c.x<-c.w-4)c.x=WW+4;}
    else{c.y+=c.d*sp*dt;if(c.y>WH+4)c.y=-c.h-4;if(c.y<-c.h-4)c.y=WH+4;}
    const parked=c.truck&&c.mode==='park';
    if(!parked&&!P.hidden&&P.x+4<c.x+c.w-1&&P.x+12>c.x+1&&P.y+3<c.y+c.h-1&&P.y+14>c.y+1)
      hurtCity(c.truck?'HIT BY THE TRUCK!':'RUN OVER BY A CAR!',c.cop);
  }
  // --- pickups
  for(const p of lostPiles){
    if(p.got)continue;
    if(Math.abs(P.x-p.x)<10&&Math.abs(P.y-p.y)<10){p.got=true;cash+=p.val;sfx.big();floatTxt(p.x+8,p.y,'+$'+p.val+' BACK!','#ffd400');}
  }
  lostPiles=lostPiles.filter(p=>!p.got);
  for(const k of picks){
    if(k.got)continue;
    if(Math.abs(P.x-k.x*T)<10&&Math.abs(P.y-k.y*T)<10){
      k.got=true;
      if(k.type==='key'){hasKey=true;sfx.key();say('KEYCARD GET! NOW ROB THE|BIG BANK (FOLLOW THE ARROW)',4);floatTxt(k.x*T+8,k.y*T,'KEYCARD','#5ff');}
      else{cash+=k.val;k.type==='bag'?sfx.big():sfx.coin();floatTxt(k.x*T+8,k.y*T,'+$'+k.val);}
    }
  }
  // --- cops: perception + radio
  const pdark=C.dark[pty*CW+ptx];
  const sightR=flashOn?9:pdark?2:6;
  copsSee=false;
  for(const c of cops){
    c.cx=Math.round(c.x/T);c.cy=Math.round(c.y/T);
    c.dist=Math.abs(c.cx-ptx)+Math.abs(c.cy-pty);
    c.sees=!P.hidden&&c.dist<=sightR&&los(c.cx,c.cy,ptx,pty);
    c.fresh=false;
    if(c.sees)copsSee=true;
  }
  if(copsSee){
    lastSeenG=[ptx,pty];
    // spotter radios nearby units; at most 5 cops chase at once
    const team=cops.filter(c=>c.sees||c.state==='chase'||c.dist<=14).sort((a,b)=>a.dist-b.dist).slice(0,5);
    let newAlarm=false;
    for(const c of team){if(c.state!=='chase'){c.alert=1.2;newAlarm=true;}c.state='chase';c.lost=4;c.fresh=true;}
    if(newAlarm)sfx.alarm();
  }
  for(const c of cops)if(c.state==='chase'&&!c.fresh){
    if(P.hidden)c.lost=Math.min(c.lost,2);
    c.lost-=dt;if(c.lost<=0)c.state='patrol';
  }
  cops.filter(c=>c.state==='chase').sort((a,b)=>a.dist-b.dist).forEach((c,i)=>c.role=i);
  for(const c of cops){
    c.alert-=dt;
    if(c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist<=8&&c.dist>0){
      c.shootT-=dt;
      if(c.shootT<=0){
        c.shootT=1.8;const vx=Math.sign(ptx-c.cx),vy=Math.sign(pty-c.cy);c.dx=vx;c.dy=vy;
        bullets.push({x:c.x+8+vx*6,y:c.y+8+vy*6,vx:vx*155,vy:vy*155,life:1.6});sfx.shoot();
      }
    }else c.shootT=Math.max(c.shootT,.8);
    const sp=c.state==='chase'?58:38;
    if(c.moving)stepMover(c,sp,dt);
    if(!c.moving){
      let nx=null;
      if(c.state==='chase'&&lastSeenG){
        const tg=chaseTarget(c,ptx,pty);
        nx=bfsStep(c.tx,c.ty,tg[0],tg[1])||bfsStep(c.tx,c.ty,lastSeenG[0],lastSeenG[1]);
      }else if(c.state!=='chase')nx=patrolStep(c);
      if(nx){c.dx=nx[0]-c.tx;c.dy=nx[1]-c.ty;c.ttx=nx[0];c.tty=nx[1];c.moving=true;}
    }
    if(!P.hidden&&Math.abs(c.x-P.x)<10&&Math.abs(c.y-P.y)<10)hurtCity('TACKLED BY A COP!');
  }
  // --- cop bullets
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(solidCity(ct(Math.floor(b.x/T),Math.floor(b.y/T))))b.life=0;
    if(b.life>0&&!P.hidden&&b.x>P.x+3&&b.x<P.x+13&&b.y>P.y+2&&b.y<P.y+15){b.life=0;hurtCity('SHOT BY POLICE!');}
  }
  bullets=bullets.filter(b=>b.life>0);
  // --- player stun bolts
  for(const b of bolts){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(solidCity(ct(Math.floor(b.x/T),Math.floor(b.y/T))))b.life=0;
    if(b.life<=0)continue;
    for(const c of cops)if(Math.abs(c.x+8-b.x)<9&&Math.abs(c.y+8-b.y)<9){zapCop(c);b.life=0;break;}
  }
  bolts=bolts.filter(b=>b.life>0);
  cam.x=clamp(P.x+8-VW/2,0,WW-VW);cam.y=clamp(P.y+8-(VH+12)/2,-12,WH-VH);
}

// arrow on the screen edge pointing at an off-screen target
function edgeArrow(wx,wy,cx,cy,col,label){

function radial(g,x,y,r,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${a})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function cone(g,x,y,ang,r,spread,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${a})`);gr.addColorStop(.7,`rgba(0,0,0,${a*.8})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.moveTo(x,y);g.arc(x,y,r,ang-spread,ang+spread);g.closePath();g.fill();}
function drawFloaters(cx,cy){for(const f of floaters)txt(f.s,f.x-cx,f.y-cy-(1-f.t)*16,f.col,'center');}

// ================= BANK (side view parkour) =================
let B,BP,respawn,bankT=0;
function buildBank(){
  const W=176,H=15,g=new Uint8Array(W*H);
  const S=(x,y,v=1)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y*W+x]=v;};

  const pit=(a,b)=>{for(let x=a;x<=b;x++){S(x,13,0);S(x,14,0);}};
  const plat=(a,b,y)=>{for(let x=a;x<=b;x++)S(x,y,1);};
  const one=(a,b,y)=>{for(let x=a;x<=b;x++)S(x,y,2);};

function renderBank(){
  const c=document.createElement('canvas');c.width=B.W*T;c.height=B.H*T;const g=c.getContext('2d');
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  R(0,0,c.width,c.height,'#17131f');
  for(let x=0;x<c.width;x+=8)R(x,0,1,c.height,'#1c1726');
  for(let i=5;i<B.W;i+=10){const x=i*T;R(x,16,14,192,'#241e30');R(x-2,16,18,4,'#5a4a1a');R(x-2,200,18,8,'#2e2640');}
  for(let i=10;i<B.W-10;i+=20){const x=i*T,y=4*T;R(x-2,y-2,36,28,'#8a6a0a');R(x,y,32,24,'#2c3a2c');R(x+4,y+14,24,10,'#3a5a3a');R(x+20,y+4,6,6,'#d4c070');}
  for(let y=0;y<B.H;y++)for(let x=0;x<B.W;x++){
    const v=B.g[y*B.W+x],X=x*T,Y=y*T;
    if(v===1){
      const up=y>0?B.g[(y-1)*B.W+x]:1;
      if(y>=13){R(X,Y,T,T,(x+y)%2?'#c9c2b2':'#b3ac9c');}
      else{R(X,Y,T,T,'#bdb6a6');R(X,Y+T-2,T,2,'#8a8476');R(X+T-1,Y,1,T,'#a69f90');}
      if(up!==1)R(X,Y,T,2,'#d4a017');
    }else if(v===2){R(X,Y,T,3,'#d4a017');R(X,Y+3,T,1,'#8a6a0a');R(X+3,Y+4,2,3,'#8a6a0a');R(X+11,Y+4,2,3,'#8a6a0a');}
    else if(y>=13){R(X,Y,T,T,'#05040a');}
  }
  for(const lx0 of B.lamps){R(lx0-1,16,2,6,'#8a6a0a');R(lx0-6,22,12,3,'#d4a017');R(lx0-4,25,8,2,'#fff2b0');}
  const vx=172*T+8,vy=9*T+8;
  g.fillStyle='#3a3f48';g.fillRect(170*T-4,4*T,6*T+4,9*T);
  g.fillStyle='#5d6673';g.beginPath();g.arc(vx,vy,42,0,7);g.fill();
  g.fillStyle='#8b95a3';g.beginPath();g.arc(vx,vy,36,0,7);g.fill();
  g.fillStyle='#d4a017';for(let a=0;a<12;a++){g.fillRect(vx+Math.cos(a*Math.PI/6)*39-2,vy+Math.sin(a*Math.PI/6)*39-2,4,4);}
  g.strokeStyle='#3a3f48';g.lineWidth=3;g.beginPath();g.arc(vx,vy,12,0,7);g.stroke();
  for(let a=0;a<3;a++){g.beginPath();g.moveTo(vx+Math.cos(a*Math.PI/3)*20,vy+Math.sin(a*Math.PI/3)*20);g.lineTo(vx-Math.cos(a*Math.PI/3)*20,vy-Math.sin(a*Math.PI/3)*20);g.stroke();}
  g.font='8px '+FONT;g.textAlign='center';g.fillStyle='#ffd400';g.fillText('VAULT',vx,4*T+8);
  return c;
}
function initBank(){
  B=buildBank();B.img=renderBank();
  BP={x:B.start.x,y:B.start.y,w:10,h:22,vx:0,vy:0,onG:true,face:1,crouch:false,coy:0,jbuf:0,wallLock:0,dropT:0,inv:1,anim:0};
  respawn={x:B.start.x,y:B.start.y};bankT=0;floaters=[];cam.x=0;cam.y=16;
}
const tb=(tx,ty)=>(tx<0||tx>=B.W||ty<0)?1:ty>=B.H?0:B.g[ty*B.W+tx];
function moveX(p,dx){
  p.x+=dx;const t0=Math.floor(p.y/T),t1=Math.floor((p.y+p.h-.01)/T);
  if(dx>0){const tx=Math.floor((p.x+p.w-.01)/T);for(let ty=t0;ty<=t1;ty++)if(tb(tx,ty)===1){p.x=tx*T-p.w;p.vx=0;break;}}
  else if(dx<0){const tx=Math.floor(p.x/T);for(let ty=t0;ty<=t1;ty++)if(tb(tx,ty)===1){p.x=(tx+1)*T;p.vx=0;break;}}
}
function moveY(p,dy){
  const prevB=p.y+p.h;p.y+=dy;
  const t0=Math.floor(p.x/T),t1=Math.floor((p.x+p.w-.01)/T);
  if(dy>0){const ty=Math.floor((p.y+p.h-.01)/T);
    for(let tx=t0;tx<=t1;tx++){const v=tb(tx,ty);if(v===1||(v===2&&prevB<=ty*T+.5&&p.dropT<=0)){p.y=ty*T-p.h;p.vy=0;break;}}}
  else if(dy<0){const ty=Math.floor(p.y/T);for(let tx=t0;tx<=t1;tx++)if(tb(tx,ty)===1){p.y=(ty+1)*T;p.vy=0;break;}}
}
// standing on something? (checked after movement every frame)
function groundCheck(p){
  if(p.vy<0)return false;
  const feet=p.y+p.h,ty=Math.round(feet/T);
  if(Math.abs(feet-ty*T)>.5)return false;
  const t0=Math.floor(p.x/T),t1=Math.floor((p.x+p.w-.01)/T);
  for(let tx=t0;tx<=t1;tx++){const v=tb(tx,ty);if(v===1||(v===2&&p.dropT<=0))return true;}
  return false;
}

function updBank(dt){
  bankT+=dt;const p=BP;
  p.inv-=dt;p.dropT-=dt;p.wallLock-=dt;
  // drop through gold ledges
  const foot=tb(Math.floor((p.x+p.w/2)/T),Math.floor((p.y+p.h+1)/T));
  if(pressed.down&&p.onG&&foot===2){p.dropT=.25;p.onG=false;p.y+=2;}
  // crouch
  const wantC=keys.down&&p.onG&&p.dropT<=0;
  if(wantC&&!p.crouch){p.crouch=true;p.y+=8;p.h=14;}
  else if(!wantC&&p.crouch&&canStand(p)){p.crouch=false;p.y-=8;p.h=22;}
  // run
  const ax=(keys.right?1:0)-(keys.left?1:0);
  if(p.wallLock<=0){const max=p.crouch?55:115+8*speedLvl,acc=p.onG?1400:800;p.vx=approach(p.vx,ax*max,acc*dt);if(ax)p.face=ax;}
  // jump / wall jump
  if(pressed.up)p.jbuf=.13;else p.jbuf-=dt;
  if(p.onG)p.coy=.1;else p.coy-=dt;
  if(p.jbuf>0){
    if(p.coy>0){
      if(p.crouch&&canStand(p)){p.crouch=false;p.y-=8;p.h=22;}
      if(!p.crouch){p.vy=-335;p.jbuf=0;p.coy=0;p.onG=false;sfx.jump();}
    }else{
      const w=touchWall(p,1)?1:touchWall(p,-1)?-1:0;
      if(w){p.vy=-300;p.vx=-w*175;p.face=-w;p.wallLock=.16;p.jbuf=0;sfx.jump();}
    }
  }
  p.vy+=950*dt;
  if(p.vy>55&&!p.onG&&((keys.left&&touchWall(p,-1))||(keys.right&&touchWall(p,1))))p.vy=55;
  if(p.vy>430)p.vy=430;
  const n=Math.ceil(dt/.008);for(let i=0;i<n;i++){moveX(p,p.vx*dt/n);moveY(p,p.vy*dt/n);}
  p.onG=groundCheck(p);
  if(p.onG&&p.vy>0)p.vy=0;
  if(Math.abs(p.vx)>5&&p.onG)p.anim+=dt;
  // lasers
  for(const l of B.lasers){
    if(!lzOn(l))continue;const [x,y,w,h]=lzRect(l);
    if(p.x+1<x+w&&p.x+p.w-1>x&&p.y+1<y+h&&p.y+p.h>y){bankDie('ZAPPED BY A LASER!',true);return;}
  }
  if(p.y>B.H*T+8){bankDie('YOU FELL!',false);return;}
  for(const k of B.items){
    if(k.got)continue;
    if(p.x<k.x+6&&p.x+p.w>k.x-6&&p.y<k.y+6&&p.y+p.h>k.y-6){k.got=true;cash+=k.val;k.val>=500?sfx.big():sfx.coin();floatTxt(k.x,k.y-8,'+$'+k.val,k.type==='cash'?'#7dff7d':'#ffd400');}
  }
  for(const c of B.cps){
    if(!c.on&&p.x+p.w/2>c.x*T&&p.x+p.w/2<c.x*T+T){for(const o of B.cps)if(o.x<c.x)o.on=true;c.on=true;respawn={x:c.x*T+3,y:13*T-22};sfx.cp();say('CHECKPOINT!',1.5);}
  }
  if(p.x+p.w>=B.vaultX){cash+=10000;floatTxt(p.x,p.y-10,'+$10000','#ffd400');toEnd('win');return;}
  cam.x=clamp(p.x+5-VW/2,0,B.W*T-VW);cam.y=clamp(p.y-VH/2+20,0,B.H*T-VH);
}

    txt('BUSTED!',VW/2,40,'#f33','center',16);
    txt('THE BANK GUARDS GOT YOU.',VW/2,80,'#ccd','center');
    txt('YOU STOLE $'+(cash+spent),VW/2,104,'#7dff7d','center');
    txt(hasKey?'SO CLOSE TO THE BANK...':'TIP: WATCH THE LASERS',VW/2,128,'#9fd3ff','center');
  }
  if(endT>1&&Math.floor(gameT*2)%2)txt('PRESS ENTER',VW/2,190,'#fff','center');
}

// ================= MAIN LOOP =================
function newGame(){
  cash=0;cityCash=0;spent=0;lives=MAXL;battery=600;flashOn=false;hasKey=false;showMap=false;paused=false;
  speedLvl=0;weapon=null;ammo=0;shopOpen=false;
  B=null;initCity();state='city';say('STEAL CASH & FIND THE KEYCARD|THEN ROB THE BIG BANK!',5);
}
function update(dt){
  gameT+=dt;
  if(state==='title'){if(pressed.start||pressed.fire)newGame();return;}
  if(state==='win'||state==='gameover'){endT+=dt;if((pressed.start||pressed.fire)&&endT>1)state='title';return;}
  if(trans){trans.t+=dt;if(!trans.fired&&trans.t>=.5){trans.fired=true;trans.cb();}if(trans.t>=1)trans=null;return;}
  if(shopOpen){updShop();return;}
  if(pressed.map){showMap=!showMap;sfx.click();}
  if(pressed.pause&&!showMap)paused=!paused;
  if(showMap||paused)return;
  if(pressed.flash){if(battery>0){flashOn=!flashOn;sfx.click();}else{say('FLASHLIGHT BATTERY IS DEAD!');sfx.deny();}}
  if(flashOn){battery-=dt;if(battery<=0){battery=0;flashOn=false;say('FLASHLIGHT BATTERY IS DEAD!');}}
  msgT-=dt;shake-=dt;hurtFlash-=dt;
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(state==='city')updCity(dt);else if(state==='bank')updBank(dt);
}
function draw(){
  if(state==='title'){drawTitle();return;}
  if(B)drawBank();else if(C)drawCity();
  if(hurtFlash>0){ctx.fillStyle=`rgba(255,0,0,${hurtFlash*.6})`;ctx.fillRect(0,0,VW,VH);}
  drawHUD();
  if(shopOpen)drawShop();
  if(showMap&&(state==='city'||state==='bank'))drawMap();
  if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,VW,VH);txt('PAUSED',VW/2,100,'#ffd400','center',16);txt('PRESS P TO RESUME',VW/2,128,'#fff','center');}
  if(trans){ctx.fillStyle=`rgba(0,0,0,${1-Math.abs(trans.t-.5)*2})`;ctx.fillRect(0,0,VW,VH);}
  if(state==='win'||state==='gameover')drawEnd();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();
  for(const k in pressed)delete pressed[k];
  requestAnimationFrame(frame);
}
(document.fonts&&document.fonts.load?document.fonts.load("8px 'Press Start 2P'").catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
