<script>
'use strict';
// ================= SETUP =================
const VW=320,VH=224,T=16;let MAXL=3,MAXHP=MAXL*3; // hp counts thirds of a heart (an EXTRA HEART upgrade makes it 4)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW;cv.height=VH;
const lc=document.createElement('canvas');lc.width=VW;lc.height=VH;const lx=lc.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){

const FONT="'Press Start 2P', monospace";
const rI=n=>Math.floor(Math.random()*n);
const pick=a=>a[rI(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
function txt(s,x,y,col='#fff',al='left',sz=8){

// ================= INPUT =================
const keys={},pressed={};let lastDir='down';
const KEYMAP={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',
  ArrowRight:'right',d:'right',D:'right',f:'flash',F:'flash',m:'map',M:'map',p:'pause',P:'pause',Escape:'pause',
  Enter:'start',' ':'fire',x:'fire',X:'fire',e:'use',E:'use',t:'tomato',T:'tomato',h:'help',H:'help',r:'scores',R:'scores'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.key];if(!k)return;e.preventDefault();initAudio();
  if(!keys[k])pressed[k]=true;keys[k]=true;
  if(k==='up'||k==='down'||k==='left'||k==='right')lastDir=k;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false;});
// raw key state by physical key, for the 2-player race (Vinae = W A S D, Vinnie = arrow keys) and the 1/2 menu
const rawKeys={},rawPressed={};
addEventListener('keydown',e=>{if(!rawKeys[e.code])rawPressed[e.code]=true;rawKeys[e.code]=true;});
addEventListener('keyup',e=>{rawKeys[e.code]=false;});
addEventListener('blur',()=>{for(const k in rawKeys)rawKeys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// ================= AUDIO =================
let actx=null;
// Browsers (Safari especially) only allow sound after the player touches/clicks/types, and Safari pauses
// ("suspends" or "interrupts") audio when you switch tabs. So: start or wake the audio on EVERY interaction.
let audioTries=0,audioLastTry=0;
function makeAudio(){
  try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;return;}
  music.master=null;audioTries=0; // the music bus is rebuilt on the new context
  try{const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){} // Safari unlock: a silent blip
}
function initAudio(){
  if(!actx){makeAudio();if(!actx)return;}
  if(actx.state==='running'){audioTries=0;return;}
  // Safari can keep a context stuck paused if it was made at the "wrong" moment: after a few tries, start fresh
  const now=performance.now();if(now-audioLastTry>600){audioLastTry=now;audioTries++;} // one click fires several events: count it once
  if(audioTries>3){try{actx.close();}catch(e){}makeAudio();if(!actx)return;}
  try{const r=actx.resume();if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
// Safari only trusts some events as "the player chose to start sound" (mostly the RELEASE of a click/tap and key presses),
// so try on all of them
for(const ev of ['pointerup','mouseup','touchend','click','keydown','keyup','pointerdown','touchstart'])addEventListener(ev,initAudio,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&actx&&actx.state!=='running')initAudio();});
function beep(f,d,type='square',vol=.05,slide=0,delay=0){
  if(!actx||muted)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  coin:()=>{beep(988,.05);beep(1319,.09,'square',.05,0,.05);},
  big:()=>{beep(784,.06);beep(1047,.06,'square',.05,0,.06);beep(1568,.12,'square',.05,0,.12);},
  hurt:()=>beep(220,.35,'sawtooth',.08,-170),
  splat:()=>{beep(160,.12,'square',.06,-90);beep(90,.1,'sawtooth',.04,-40,.03);},
  toss:()=>beep(500,.08,'triangle',.05,250),
  shoot:()=>beep(900,.08,'square',.035,-700),
  zapGun:()=>beep(1800,.12,'sawtooth',.04,-1400),
  jump:()=>beep(330,.12,'square',.035,330),
  click:()=>beep(1200,.03,'square',.03),
  alarm:()=>{beep(880,.08,'square',.04);beep(660,.08,'square',.04,0,.09);},
  key:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.1,'square',.05,0,i*.08));},
  deny:()=>beep(140,.15,'square',.05),
  zap:()=>beep(1400,.3,'sawtooth',.06,-1200),
  buy:()=>{[659,880,1175].forEach((f,i)=>beep(f,.09,'square',.05,0,i*.07));},
  horn:()=>{beep(330,.15,'square',.05);beep(330,.2,'square',.05,0,.2);},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.16,'square',.05,0,i*.13));},
  cp:()=>{beep(660,.08);beep(990,.12,'square',.05,0,.08);}
};

// ================= MUSIC (generated chiptune, no audio files) =================
// Each track: 4 bars x 16 steps. Notes are names like A4 / C#5, '.' is a rest.
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,Bb:10,B:11};
const midi=n=>{const m=n.match(/^([A-G][#b]?)(\d)$/);return 12*(+m[2]+1)+NOTE[m[1]];};
const mf=m=>440*Math.pow(2,(m-69)/12);
const seq=str=>str.trim().split(/\s+/).map(t=>t==='.'?0:midi(t));
// bass line from chords: one chord per bar, eighth notes
const bassFrom=(chords,pat)=>chords.flatMap(ch=>{const r=midi(ch)-12,out=Array(16).fill(0);pat.forEach((o,i)=>{if(o!==null)out[i*2]=r+o;});return out;});
const ANDALUSIAN=['A3','G3','F3','E3'];
const cityLead=seq(`A4 . . C5 . . B4 . A4 . . . E4 . . .  G4 . . B4 . . A4 . G4 . . . D4 . . .
                    F4 . . A4 . . G4 . F4 . . . C5 . . .  E4 . G#4 . B4 . D5 . C5 . B4 . G#4 . . .`);
// night 5 has its own music: E Phrygian on the rooftops (dark, Spanish-flavored), B minor in the Reserve
const roofArp=(chords,shape)=>chords.flatMap(([ch,third])=>{const r=midi(ch);return shape.map(o=>r+(o===3?third:o===15?12+third:o));});
const TRACKS={
  roof:{bpm:120,leadVol:.02,leadLen:.12,bassVol:.085,leadType:'sawtooth',
    lead:seq(`B4 . . . . . C5 . B4 . . . G4 . . .  A4 . . . . . B4 . A4 . . . F4 . . .
              G4 . . . . . A4 . G4 . . . E4 . . .  F4 . . . G4 . . . F4 . E4 . . . . .`),
    bass:bassFrom(['E3','F3','G3','F3'],[0,null,0,12,null,0,7,null]),
    kick:[0,8],hat:[2,6,10,14],snare:[12]},
  roofChase:{bpm:168,leadVol:.016,leadLen:.07,bassVol:.095,leadType:'sawtooth',siren:true,
    lead:roofArp([['E4',3],['F4',4],['E4',3],['D4',3]],[24,19,15,12,24,19,15,12,22,19,15,12,24,22,19,15]),
    bass:bassFrom(['E3','F3','E3','D3'],[0,12,0,12,0,12,0,12]),
    kick:[0,4,8,12],hat:[0,2,4,6,8,10,12,14,1,5,9,13],snare:[4,12]},
  reserve:{bpm:126,leadVol:.022,leadLen:.3,bassVol:.09,leadType:'triangle',arpVol:.009,
    lead:seq(`F#5 . . . . . . . . . . . E5 . D5 .  C#5 . . . . . . . . . . . . . . .
              D5 . . . . . . . C#5 . . . B4 . . .  Bb4 . . . . . . . . . . . . . . .`),
    arp:roofArp([['B4',3],['B4',3],['G4',4],['F#4',4]],[0,7,12,7,3,7,12,7,0,7,12,7,3,7,12,7]),
    bass:bassFrom(['B3','B3','G3','F#3'],[0,null,null,0,null,null,0,null]),
    kick:[0,10],hat:[0,4,8,12],snare:[8]},
  city:{bpm:96,lead:cityLead,leadVol:.022,leadLen:.09,bassVol:.085,
    bass:bassFrom(ANDALUSIAN,[0,null,7,null,12,null,7,3]),
    kick:[0,8],hat:[2,6,10,14],snare:[]},
  title:{bpm:100,lead:cityLead,leadVol:.026,leadLen:.14,bassVol:.085,
    bass:bassFrom(ANDALUSIAN,[0,null,7,null,12,null,7,3]),
    kick:[0,8],hat:[2,6,10,14],snare:[4,12]},
  chase:{bpm:152,leadVol:.016,leadLen:.06,bassVol:.09,
    lead:ANDALUSIAN.flatMap(ch=>{const r=midi(ch)+12,t=r+(ch==='A3'?3:4),f=r+7;return [r,t,f,t+12,f,t,r+12,f,r,t,f,t+12,r+12,f,t,f];}),
    bass:bassFrom(ANDALUSIAN,[0,12,0,12,0,12,0,12]),
    kick:[0,4,8,12],hat:[2,6,10,14],snare:[4,12]},
  jail:{bpm:84,leadVol:.02,leadLen:.22,bassVol:.09,
    lead:seq(`E5 . . . . . . . D5 . . . . . . .  C5 . . . . . . . B4 . . . . . A4 .
              E5 . . . . . G5 . F5 . . . E5 . . .  D5 . . . C5 . . . B4 . . . . . . .`),
    bass:bassFrom(['A3','A3','F3','E3'],[0,null,null,7,0,null,12,null]),
    kick:[0,10],hat:[4,12],snare:[]},
  bank:{bpm:116,leadVol:.02,leadLen:.16,bassVol:.09,
    lead:seq(`D5 . . . A4 . . . C5 . D5 . . . . .  F5 . . . E5 . . . D5 . C5 . . . . .
              D5 . . . F5 . . . Bb4 . . . D5 . . .  C#5 . . . E5 . . . A4 . . . C#5 . E5 .`),
    bass:bassFrom(['D3','D3','Bb2','A2'],[0,0,12,0,0,0,12,0]),
    kick:[0,6,8],hat:[0,2,4,6,8,10,12,14],snare:[12]}
};
const music={on:true,master:null,noise:null,name:null,next:0,step:0};
// music always starts ON (an old saved 'off' is cleared); the SOUND button turns it off
try{localStorage.removeItem('nh_music');}catch(e){}
function musicSetup(){
  if(music.master||!actx)return;
  music.master=actx.createGain();music.master.gain.value=muted?0:.8;music.master.connect(actx.destination);
  const b=actx.createBuffer(1,actx.sampleRate*.3,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;music.noise=b;
}
function tone(f,t,dur,type,vol,slide=0){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(music.master);o.start(t);o.stop(t+dur+.02);
}
function hit(t,dur,vol,hp){
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=music.noise;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(music.master);s.start(t);s.stop(t+dur+.02);
}
function wantTrack(){
  if(!music.on||paused)return null;
  if(state==='title')return 'title';
  if(state==='story'||state==='choose'||state==='menu'||state==='hideout'||state==='badges'||state==='dailyres'||state==='nightsel'||state==='results'||state==='win')return 'title';
  if(state==='lock')return null; // the lock plays its own metronome
  if(state==='boat')return 'chase';
  if(state==='city')return isRoof()?(wanted()?'roofChase':'roof'):wanted()?'chase':isJail()?'jail':isGallery()?'bank':'city';
  if(state==='bank')return B&&B.theme==='reserve'?(B.timer>0&&B.timer<30?'roofChase':'reserve'):'bank';
  return null;
}
function musicTick(){
  if(!actx)return;musicSetup();
  const name=wantTrack();
  if(name!==music.name){music.name=name;music.step=0;music.next=actx.currentTime+.06;}
  if(!name)return;
  const tr=TRACKS[name],sp=60/tr.bpm/4;
  if(music.next<actx.currentTime-.2)music.next=actx.currentTime+.05; // tab was in background
  while(music.next<actx.currentTime+.15){
    const t=music.next,i=music.step%64,b=i%16;
    if(tr.bass[i])tone(mf(tr.bass[i]),t,sp*1.8,'triangle',tr.bassVol);
    if(tr.lead[i])tone(mf(tr.lead[i]),t,tr.leadLen,tr.leadType||'square',tr.leadVol);
    if(tr.arp&&tr.arp[i])tone(mf(tr.arp[i]),t,sp*.9,'square',tr.arpVol);
    if(tr.siren&&i%32===0){tone(620,t,sp*16,'triangle',.022,320);tone(940,t+sp*16,sp*16,'triangle',.022,-320);}
    if(tr.kick.includes(b))tone(140,t,.12,'sine',.18,-100);
    if(tr.snare.includes(b))hit(t,.12,.06,1200);
    if(tr.hat.includes(b))hit(t,.03,.025,7000);
    music.next+=sp;music.step++;
  }
}

// ================= GLOBAL STATE =================
let state='title',cash=0,cityCash=0,spent=0,hp=MAXHP,battery=600,flashOn=false,hasKey=false;
let showMap=false,paused=false,msg='',msgT=0,shake=0,hurtFlash=0,endT=0,trans=null,gameT=0;
let speedLvl=0,weapon=null,ammo=0,fireCD=0,shopOpen=false,shopSel=0,tomatoes=0,tomCD=0,armor=false,plates=0,shovelLvl=0,cards=0,dogTreatT=0,toms=[],splats=[];
let floaters=[];
const cam={x:0,y:0};
function say(t,d=2.6){msg=t;msgT=d;}
function floatTxt(x,y,s,col='#7dff7d'){floaters.push({x,y,s,col,t:1});}
function startTrans(cb){trans={t:0,cb,fired:false};}
function toEnd(s){state=s;endT=0;flashOn=false;shopOpen=false;sfx.win();}

// ================= CITY =================
// map size changes per night (big city vs smaller jail)
let NBX,NBY,CW,CH,WW,WH,BKX,BKY,BK0X,BK1X,BK0Y,BK1Y;
function setDims(nx,ny,tbx=nx-1,tby=ny-1){NBX=nx;NBY=ny;CW=nx*12+2;CH=ny*11+2;WW=CW*T;WH=CH*T;BKX=tbx;BKY=tby;BK0X=12*BKX+3;BK1X=12*BKX+10;BK0Y=11*BKY+3;BK1Y=11*BKY+9;}
setDims(9,7);
// ---------- the 5-night story loop ----------
// odd nights: city heist + bank.  even nights: jailbreak.  night 5 ends with the getaway.
const NIGHTS=5;
let soap=0,disguiseT=0,boostT=0,coconuts=0; // jail-only items from the Inmate Trader
let night=1,stolen=0,nightStolen=0,nightLog=[],story=null,storyT=0,best=0;
try{best=+localStorage.getItem('nh_best')||0;}catch(e){}
const nightLvl=()=>(night-1)>>1; // 0,0,1,1,2 -> difficulty
const isJail=()=>!!(C&&C.jail);
const isMuseum=()=>night===3;
const isGauntlet=()=>night===5; // night 5: rooftops + the hardest interior
const isRoof=()=>!!(C&&C.theme==='roof');
const isGallery=()=>!!(C&&C.theme==='gallery'); // night 3 top-down part: inside the museum, not the street
const isIsland=()=>night===4; // night 4: outdoor island prison instead of the jail
const keyName=()=>isIsland()?'BOAT KEY':'KEYCARD',bossName=()=>isIsland()?'HARBOR MASTER':'WARDEN'; // night 3: rainy city + museum instead of bank
const CONE_HALF=70*Math.PI/180,CONE=Math.cos(CONE_HALF),JAIL_SIGHT=6; // guards see as far as city cops, 140-degree view
// is tile (x,y) inside this guard's view cone?
function facesTile(c,x,y){const vx=x-c.cx,vy=y-c.cy,l=Math.hypot(vx,vy);return !l||(vx*c.dx+vy*c.dy)/l>CONE;}
function gain(v){if(!twoP&&v>0)v=Math.round(v*(1+.1*upLvl('gloves')+.02*upLvl('trophy')));cash+=v;stolen+=v;nightStolen+=v;}
// ===== LONG-TERM PROGRESS (saved in this browser): stash money, hideout upgrades, badges, hard mode =====
let save=loadSave(),hardMode=false,toasts=[];
function loadSave(){const d={stash:0,up:{},badges:{},stats:{},hard:false};try{return Object.assign(d,JSON.parse(localStorage.getItem('nh_save')||'{}'));}catch(e){return d;}}
function writeSave(){try{localStorage.setItem('nh_save',JSON.stringify(save));}catch(e){}}
const upLvl=k=>save.up[k]||0;
const maxBattery=()=>600+300*upLvl('battery');
function applyUpgrades(){MAXL=3+(twoP?0:upLvl('heart')+upLvl('heart2'));MAXHP=MAXL*3;}
const UPGRADES=[
  {k:'heart',name:'EXTRA HEART',cost:[30000],desc:()=>'START EVERY NIGHT WITH 4 HEARTS'},
  {k:'shoes',name:'QUIET SNEAKERS',cost:[8000,16000],desc:()=>'RUN FASTER, EVERY NIGHT'},
  {k:'battery',name:'BIG BATTERY',cost:[5000,10000],desc:l=>'FLASHLIGHT LASTS '+(10+5*Math.min(2,l+1))+' MINUTES'},
  {k:'kit',name:'STARTER KIT',cost:[6000,12000],desc:l=>l?'+ A STUN GUN EACH CITY NIGHT':'10 TOMATOES EACH CITY NIGHT'},
  {k:'gloves',name:'CASH GLOVES',cost:[10000,20000],desc:l=>'+'+10*Math.min(2,l+1)+'% MONEY FROM EVERYTHING'},
  // ...when one is maxed, the next one takes its slot
  {k:'vest',name:'ARMOR VEST',cost:[15000],desc:()=>'START EVERY NIGHT WEARING ARMOR'},
  {k:'plates',name:'ARMOR PLATES',cost:[12000,24000],desc:l=>'+'+2*Math.min(2,l+1)+' ARMOR PLATES EVERY NIGHT'},
  {k:'charm',name:'LUCKY CHARM',cost:[10000,20000],desc:()=>'RARE TREASURE SHOWS UP MORE'},
  {k:'combo',name:'COMBO GLOVES',cost:[8000,16000],desc:l=>'COMBOS LAST LONGER, UP TO X'+(3+.5*Math.min(2,l+1))},
  {k:'hands',name:'QUICK HANDS',cost:[12000,24000],desc:()=>'DIG, CUT AND CRACK FASTER'},
  {k:'heart2',name:'EXTRA HEART II',cost:[60000],desc:()=>'START EVERY NIGHT WITH 5 HEARTS'}
];

const TR=0,TS=1,TB=2,TA=3,TD=4,TK=5,TKD=6; // road, sidewalk, building, alley, door(hideout), bank, bank door

function genCity(jail,nPieces=1){
  const g=new Uint8Array(CW*CH),dark=new Uint8Array(CW*CH),blk=new Int16Array(CW*CH).fill(-1);
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const mx=x%12,my=y%11,i=y*CW+x;
    if(mx<=1||my<=1)g[i]=TR;
    else if(mx===2||mx===11||my===2||my===10)g[i]=TS;
    else{g[i]=TB;blk[i]=Math.floor(x/12)+Math.floor(y/11)*NBX;}
  }
  for(let y=BK0Y;y<=BK1Y;y++)for(let x=BK0X;x<=BK1X;x++)g[y*CW+x]=TK;
  g[BK1Y*CW+BK0X+3]=TKD;g[BK1Y*CW+BK0X+4]=TKD;
  const isBank=(bx,by)=>bx===BKX&&by===BKY;
  // keycard goes in a block far from the start (top-left)
  const cand=[];
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++)if(!isBank(bx,by)&&bx+by>=(nPieces>1?4:NBX+NBY-6))cand.push([bx,by]);
  const kbs=[];
  if(!jail){const c2=cand.slice();while(kbs.length<nPieces&&c2.length){const b=c2.splice(rI(c2.length),1)[0];if(kbs.every(k=>Math.abs(k[0]-b[0])+Math.abs(k[1]-b[1])>=4)||c2.length===0)kbs.push(b);}}
  const alleys=[],keys=[];let key=null;
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    const isK=kbs.some(k=>k[0]===bx&&k[1]===by);
    if(!isK&&Math.random()>(jail?.35:.45))continue;
    const tiles=[];
    if(Math.random()<0.5){const ax=12*bx+5+rI(4);for(let y=11*by+3;y<=11*by+9;y++)tiles.push([ax,y]);}
    else{const ay=11*by+4+rI(4);for(let x=12*bx+3;x<=12*bx+10;x++)tiles.push([x,ay]);}
    for(const [x,y] of tiles){g[y*CW+x]=TA;dark[y*CW+x]=1;}
    alleys.push(tiles);
    if(isK)keys.push(tiles[Math.floor(tiles.length/2)]);
  }
  // hideout doors
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    let n=0,tries=0;
    while(n<(jail?4:2)&&tries<80){
      tries++;const s=rI(4);let x,y,ox=0,oy=0;
      if(s===0){x=12*bx+4+rI(6);y=11*by+3;oy=-1;}
      else if(s===1){x=12*bx+4+rI(6);y=11*by+9;oy=1;}
      else if(s===2){x=12*bx+3;y=11*by+4+rI(5);ox=-1;}
      else{x=12*bx+10;y=11*by+4+rI(5);ox=1;}
      if(g[y*CW+x]!==TB||g[(y+oy)*CW+x+ox]!==TS)continue;
      g[y*CW+x]=TD;n++;
    }
  }
  const lights=[];
  for(let i=0;i<=NBX;i++)for(let j=0;j<=NBY;j++){
    for(const [x,y] of [[12*i-1,11*j-1],[12*i+2,11*j-1],[12*i-1,11*j+2],[12*i+2,11*j+2]]){
      if(x<0||y<0||x>=CW||y>=CH||g[y*CW+x]!==TS)continue;
      if(Math.random()<(jail?.7:.45))lights.push({x:x*T+8,y:y*T+8});
    }
  }
  if(jail){g[3*CW+5]=TD;dark[3*CW+5]=0;} // your cell, top-left
  key=keys[0]||null;
  return {g,dark,blk,alleys,key,keys,lights,jail:!!jail,cell:jail?[5,3]:null};
}

  const r=Math.random,pal={};
  const rain=C.theme==='rain',PAL_RAIN=[['#2f5a5e','#21454a'],['#5e6a72','#46525a'],['#3b4a5e','#2b384a'],['#6a6458','#504a40'],['#2f4a40','#223830']];
  for(let i=0;i<NBX*NBY;i++)pal[i]=pick(rain?PAL_RAIN:PAL_BLD);
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const t=C.g[y*CW+x],X=x*T,Y=y*T,mx=x%12,my=y%11;
    if(t===TR){
      R(X,Y,T,T,rain?'#262a36':'#2b2b35');
      for(let k=0;k<4;k++)R(X+rI(16),Y+rI(16),1,1,'#363642');
      if(rain&&r()<.12){R(X+3+rI(5),Y+4+rI(6),7,3,'#34405a');R(X+5,Y+5,3,1,'#5a6a8a');} // puddles
      const inter=mx<=1&&my<=1;
      if(!inter){
        if(my<=1&&(mx===2||mx===11)){for(let i=1;i<16;i+=4)R(X+2,Y+i,12,2,'#cfcfcf');}
        else if(mx<=1&&(my===2||my===10)){for(let i=1;i<16;i+=4)R(X+i,Y+2,2,12,'#cfcfcf');}
        else if(my===0&&mx>1){for(let i=1;i<16;i+=8)R(X+i,Y+15,5,1,'#e8c547');}
        else if(my===1&&mx>1){for(let i=1;i<16;i+=8)R(X+i,Y,5,1,'#e8c547');}
        else if(mx===0&&my>1){for(let i=1;i<16;i+=8)R(X+15,Y+i,1,5,'#e8c547');}
        else if(mx===1&&my>1){for(let i=1;i<16;i+=8)R(X,Y+i,1,5,'#e8c547');}
      }
    }else if(t===TS){
      R(X,Y,T,T,'#74747e');R(X,Y,T,1,'#62626b');R(X,Y,1,T,'#62626b');
      if(ct(x,y-1)===TR)R(X,Y,T,2,'#a3a3ad');
      if(ct(x,y+1)===TR)R(X,Y+14,T,2,'#a3a3ad');
      if(ct(x-1,y)===TR)R(X,Y,2,T,'#a3a3ad');
      if(ct(x+1,y)===TR)R(X+14,Y,2,T,'#a3a3ad');
    }else if(t===TB){
      const p=pal[C.blk[y*CW+x]]||PAL_BLD[0];
      const below=ct(x,y+1);
      if(below!==TB){
        R(X,Y,T,T,p[1]);R(X,Y+15,T,1,'#111');
        R(X+3,Y+4,4,6,r()<.35?'#ffd75e':'#151a2a');R(X+9,Y+4,4,6,r()<.35?'#ffd75e':'#151a2a');
        R(X+2,Y+10,6,1,'#222');R(X+8,Y+10,6,1,'#222');
      }else{
        R(X,Y,T,T,p[0]);
        if(ct(x,y-1)!==TB)R(X,Y,T,2,'rgba(255,255,255,.18)');
        if(ct(x-1,y)!==TB)R(X,Y,2,T,'rgba(255,255,255,.12)');
        if(ct(x+1,y)!==TB)R(X+14,Y,2,T,'rgba(0,0,0,.25)');
        for(let k=0;k<3;k++)R(X+rI(15),Y+rI(15),2,1,'rgba(0,0,0,.15)');
        if(r()<.07){R(X+3,Y+3,10,9,'#8a8a92');R(X+4,Y+5,8,1,'#555');R(X+4,Y+7,8,1,'#555');R(X+4,Y+9,8,1,'#555');R(X+3,Y+12,10,1,'#222');}
      }
    }else if(t===TA){
      R(X,Y,T,T,'#1d1913');
      if(r()<.35)R(X+rI(10),Y+rI(10),4+rI(3),3,'#3a3020');
      if(r()<.2)R(X+rI(8),Y+rI(10),6,3,'#232c40');
      if(r()<.15){R(X+3,Y+3,9,8,'#2f4a2f');R(X+3,Y+3,9,2,'#3d5d3d');}
    }else if(t===TD){
      R(X,Y,T,T,'#3a2414');R(X+2,Y+2,12,14,'#6b4a2a');R(X+4,Y+4,8,12,'#0d0806');
      R(X+6,Y+1,4,2,'#3f3');R(X+10,Y+10,1,1,'#ffd400');
    }else if(rain&&(t===TK||t===TKD)){ // the museum: marble roof, columns
      if(t===TKD){R(X,Y,T,T,'#3a2a1a');R(X+2,Y+2,12,14,'#1a120a');R(X+7,Y+2,2,14,'#8a6a3a');}
      else if(y===BK1Y){R(X,Y,T,T,'#b8b2a4');R(X+2,Y,5,T,'#e8e4d8');R(X+9,Y,5,T,'#e8e4d8');R(X,Y,T,2,'#8a8476');}
      else{R(X,Y,T,T,(x+y)%2?'#c8c2b4':'#beb8aa');
        if(ct(x,y-1)!==TK)R(X,Y,T,3,'#6a6458');
        if(ct(x-1,y)!==TK&&ct(x-1,y)!==TKD)R(X,Y,3,T,'#6a6458');
        if(ct(x+1,y)!==TK&&ct(x+1,y)!==TKD)R(X+13,Y,3,T,'#6a6458');}
    }else if(t===TK||t===TKD){
      if(t===TKD){R(X,Y,T,T,'#d4a017');R(X+2,Y+2,12,14,'#5a3d0a');R(X+7,Y+2,2,14,'#d4a017');}
      else if(y===BK1Y){R(X,Y,T,T,'#cfc8b4');R(X+3,Y,4,T,'#efe9d6');R(X+3,Y,4,2,'#d4a017');R(X+10,Y+4,4,8,'#151a2a');}
      else{R(X,Y,T,T,(x+y)%2?'#ddd6c2':'#d2cab4');
        if(ct(x,y-1)!==TK)R(X,Y,T,3,'#d4a017');
        if(ct(x-1,y)!==TK&&ct(x-1,y)!==TKD)R(X,Y,3,T,'#d4a017');
        if(ct(x+1,y)!==TK&&ct(x+1,y)!==TKD)R(X+13,Y,3,T,'#d4a017');}
    }
  }
  const bcx=(BK0X+4)*T,bcy=(BK0Y+2)*T;
  g.textAlign='center';g.textBaseline='middle';
  if(rain){
    g.fillStyle='#9fd8f0';g.beginPath();g.moveTo(bcx,bcy-4);g.lineTo(bcx+12,bcy+8);g.lineTo(bcx,bcy+24);g.lineTo(bcx-12,bcy+8);g.closePath();g.fill();
    g.fillStyle='#e8f8ff';g.fillRect(bcx-4,bcy+2,4,6);
    g.font='8px '+FONT;g.fillStyle='#3a3428';g.fillText('MUSEUM',bcx,bcy+42);
  }else{
  g.font='24px '+FONT;g.fillStyle='#8a6a0a';g.fillText('$',bcx+2,bcy+10);g.fillStyle='#ffd400';g.fillText('$',bcx,bcy+8);
  g.font='8px '+FONT;g.fillStyle='#5a3d0a';g.fillText('BIG BANK',bcx,bcy+42);
  }
  return c;
}

// Museum floor plan: split the building into rooms of different sizes (BSP), connect them with
// doorways, make 3 dark storage rooms (blueprints) and a walled Moonstone Vault Wing near the middle.
function genGallery(){
  for(let attempt=0;attempt<60;attempt++){
    CW=92;CH=64;WW=CW*T;WH=CH*T;NBX=0;NBY=0;
    const g=new Uint8Array(CW*CH).fill(TB),dark=new Uint8Array(CW*CH),leaves=[],splits=[];
    const split=(x,y,w,h)=>{
      const canV=w>=20,canH=h>=18;
      if((canV||canH)&&!(w<26&&h<22&&Math.random()<.3)){
        if(canV&&(!canH||w>h*1.2||Math.random()<.5)){const sx=x+9+rI(w-17);splits.push({v:true,at:sx,a:y,b:y+h});split(x,y,sx-x,h);split(sx,y,x+w-sx,h);}
        else{const sy=y+8+rI(h-15);splits.push({v:false,at:sy,a:x,b:x+w});split(x,y,w,sy-y);split(x,sy,w,y+h-sy);}
      }else leaves.push({x,y,w,h});
    };
    split(0,0,CW-1,CH-1);
    for(const L of leaves)for(let yy=L.y+1;yy<L.y+L.h;yy++)for(let xx=L.x+1;xx<L.x+L.w;xx++)g[yy*CW+xx]=TR;
    const fl=(x,y)=>x>0&&y>0&&x<CW-1&&y<CH-1&&g[y*CW+x]!==TB;
    // a 2-wide doorway through every split wall
    for(const sp of splits){
      const opts=[];for(let k=sp.a+1;k<sp.b-1;k++){
        if(sp.v){if(fl(sp.at-1,k)&&fl(sp.at+1,k)&&fl(sp.at-1,k+1)&&fl(sp.at+1,k+1))opts.push(k);}
        else{if(fl(k,sp.at-1)&&fl(k,sp.at+1)&&fl(k+1,sp.at-1)&&fl(k+1,sp.at+1))opts.push(k);}}
      if(!opts.length)continue;const k=pick(opts);
      if(sp.v){g[k*CW+sp.at]=TR;g[(k+1)*CW+sp.at]=TR;}else{g[sp.at*CW+k]=TR;g[sp.at*CW+k+1]=TR;}
    }
    const cx0=CW/2,cy0=CH/2,dist=L=>Math.abs(L.x+L.w/2-cx0)+Math.abs(L.y+L.h/2-cy0);
    const start=leaves.find(L=>L.x===0&&L.y===0);
    const vault=leaves.filter(L=>L!==start&&L.w>=9&&L.h>=8).sort((a,b)=>dist(a)-dist(b))[0];
    if(!start||!vault)continue;
    // the vault wing: solid gold-trimmed block with ONE door
    for(let yy=vault.y;yy<=vault.y+vault.h;yy++)for(let xx=vault.x;xx<=vault.x+vault.w;xx++)
      g[yy*CW+xx]=(xx===vault.x||yy===vault.y||xx===vault.x+vault.w||yy===vault.y+vault.h)?TB:TK;
    const doorOpts=[];
    for(let xx=vault.x+2;xx<vault.x+vault.w-1;xx++){if(fl(xx,vault.y+vault.h+1))doorOpts.push([xx,vault.y+vault.h,0,1]);if(fl(xx,vault.y-1))doorOpts.push([xx,vault.y,0,-1]);}
    for(let yy=vault.y+2;yy<vault.y+vault.h-1;yy++){if(fl(vault.x-1,yy))doorOpts.push([vault.x,yy,-1,0]);if(fl(vault.x+vault.w+1,yy))doorOpts.push([vault.x+vault.w,yy,1,0]);}
    if(!doorOpts.length)continue;
    const [ddx,ddy]=pick(doorOpts);g[ddy*CW+ddx]=TKD;
    // exhibit rooms get a carpet ring and scattered statues/cases; 3 far-apart rooms are dark storage
    const others=leaves.filter(L=>L!==start&&L!==vault);
    const store=[];for(const L of others.slice().sort(()=>Math.random()-.5)){if(store.length>=3)break;if(L.w>=8&&L.h>=7&&store.every(o=>Math.abs(o.x-L.x)+Math.abs(o.y-L.y)>=24))store.push(L);}
    if(store.length<3)continue;
    const alleys=[],keys=[];
    for(const L of leaves){
      if(L===vault)continue;
      const isStore=store.includes(L),tiles=[];
      for(let yy=L.y+1;yy<L.y+L.h;yy++)for(let xx=L.x+1;xx<L.x+L.w;xx++){
        const i=yy*CW+xx;if(g[i]===TB)continue;
        if(isStore){g[i]=TA;dark[i]=1;tiles.push([xx,yy]);continue;}
        const edge=xx===L.x+1||yy===L.y+1||xx===L.x+L.w-1||yy===L.y+L.h-1;
        g[i]=edge?TS:TR;
        const inner=xx>L.x+2&&yy>L.y+2&&xx<L.x+L.w-2&&yy<L.y+L.h-2;
        if(inner&&L!==start&&Math.random()<.07)g[i]=TB; // statue / display case
      }
      if(isStore){alleys.push(tiles);keys.push([L.x+Math.floor(L.w/2),L.y+Math.floor(L.h/2)]);}
    }
    // extra doorways: most rooms get several ways in and out
    const isFl=i=>g[i]===TR||g[i]===TS||g[i]===TA,inVault=(x,y)=>x>=vault.x-1&&x<=vault.x+vault.w+1&&y>=vault.y-1&&y<=vault.y+vault.h+1;
    for(let y=2;y<CH-3;y++)for(let x=2;x<CW-3;x++){
      const i=y*CW+x;if(g[i]!==TB||inVault(x,y)||inVault(x+1,y+1))continue;
      if(isFl(i-1)&&isFl(i+1)&&isFl(i+CW-1)&&isFl(i+CW+1)&&g[i-CW]===TB&&g[i+CW]===TB&&Math.random()<.3){g[i]=TR;g[i+CW]=TR;} // through a vertical wall
      else if(isFl(i-CW)&&isFl(i+CW)&&isFl(i-CW+1)&&isFl(i+CW+1)&&g[i-1]===TB&&g[i+1]===TB&&Math.random()<.3){g[i]=TR;g[i+1]=TR;} // through a horizontal wall
    }
    for(const L of leaves){if(L===vault)continue;
      const sides=[[L.x,L.y+1,L.y+L.h-1,true],[L.x+L.w,L.y+1,L.y+L.h-1,true],[L.y,L.x+1,L.x+L.w-1,false],[L.y+L.h,L.x+1,L.x+L.w-1,false]];
      for(const [at,a,b,vert] of sides){
        const T2=(k,o)=>vert?(k*CW+at+o):((at+o)*CW+k);
        if(vert?(at<=0||at>=CW-1):(at<=0||at>=CH-1))continue;
        let open=false;for(let k=a;k<=b;k++)if(isFl(T2(k,0)))open=true;if(open)continue;
        const opts=[];for(let k=a+1;k<b-1;k++)if(isFl(T2(k,-1))&&isFl(T2(k,1))&&isFl(T2(k+1,-1))&&isFl(T2(k+1,1))&&!inVault(vert?at:k,vert?k:at))opts.push(k);
        if(opts.length){const k=pick(opts);g[T2(k,0)]=TR;g[T2(k+1,0)]=TR;}
      }}
    // everything must be reachable from the start room
    const seen=new Uint8Array(CW*CH),q=[2*CW+2];seen[q[0]]=1;let h=0;const walk=v=>v===TR||v===TS||v===TA||v===TKD;
    while(h<q.length){const c=q[h++],x=c%CW,y=(c/CW)|0;for(const [dx,dy] of DIRS){const n=(y+dy)*CW+x+dx;if(!seen[n]&&walk(g[n])){seen[n]=1;q.push(n);}}}
    let ok=true;for(let i=0;i<g.length;i++)if((g[i]===TR||g[i]===TS||g[i]===TA)&&!seen[i]){g[i]=TB;}  // seal off unreachable bits
    if(!seen[ddy*CW+ddx]||keys.some(([x,y])=>!seen[y*CW+x]))ok=false;
    if(!ok)continue;
    // sarcophagi along room walls
    for(let i=0;i<g.length;i++){if(g[i]!==TB)continue;const x=i%CW,y=(i/CW)|0;if(x<1||y<1||x>CW-2||y>CH-2)continue;
      const nb=DIRS.filter(([dx,dy])=>g[(y+dy)*CW+x+dx]===TS).length,wallLine=(g[i-1]===TB&&g[i+1]===TB)||(g[i-CW]===TB&&g[i+CW]===TB);
      if(nb===1&&wallLine&&Math.random()<.26)g[i]=TD;}
    for(const L of leaves){if(L===vault)continue;
      const edge=[];for(let xx=L.x;xx<=L.x+L.w;xx++)for(const yy of [L.y,L.y+L.h])edge.push([xx,yy]);for(let yy=L.y;yy<=L.y+L.h;yy++)for(const xx of [L.x,L.x+L.w])edge.push([xx,yy]);
      const have=edge.filter(([xx,yy])=>g[yy*CW+xx]===TD).length;if(have>=2)continue;
      const opts=edge.filter(([xx,yy])=>{const i=yy*CW+xx;if(xx<1||yy<1||xx>CW-2||yy>CH-2||g[i]!==TB)return false;
        const nb=DIRS.filter(([dx,dy])=>{const v=g[(yy+dy)*CW+xx+dx];return v===TS||v===TA||v===TR;}).length;return nb===1&&((g[i-1]===TB&&g[i+1]===TB)||(g[i-CW]===TB&&g[i+CW]===TB));});
      const want=Math.max(2,Math.round((L.w+L.h)*2/8)); // about one per 8 tiles of wall
      for(let k=have;k<want&&opts.length;k++){const [xx,yy]=opts.splice(rI(opts.length),1)[0];g[yy*CW+xx]=TD;}
      if(L.w>=12&&L.h>=10&&L!==start){ // free-standing mummy cases in the middle of big rooms
        for(let k=0,tr=0;k<2&&tr<40;tr++){const xx=L.x+3+rI(L.w-5),yy=L.y+3+rI(L.h-5),i=yy*CW+xx;
          if((g[i]===TR||g[i]===TA)&&DIRS.every(([dx,dy])=>{const v=g[i+dy*CW+dx];return v===TR||v===TS||v===TA;})){g[i]=TD;k++;}}}}
    // coverage pass: keep adding free-standing mummy cases until EVERY floor tile is within 8 steps of a hiding spot
    const flo=v=>v===TR||v===TS||v===TA;
    for(let it=0;it<80;it++){
      const dist=new Int32Array(CW*CH).fill(-1),qq=[];for(let i=0;i<g.length;i++)if(g[i]===TD){dist[i]=0;qq.push(i);}
      let hh=0,far=-1,fd=0;while(hh<qq.length){const c=qq[hh++],x=c%CW,y=(c/CW)|0;
        for(const [dx,dy] of DIRS){const n=(y+dy)*CW+x+dx;if(dist[n]<0&&flo(g[n])){dist[n]=dist[c]+1;qq.push(n);if(dist[n]>fd){fd=dist[n];far=n;}}}}
      for(let i=0;i<g.length;i++)if(flo(g[i])&&dist[i]<0&&seen[i]){far=i;fd=99;break;}
      if(fd<=8||far<0)break;
      // place a case near the far spot where it can't block a passage (open floor all around)
      const fx=far%CW,fy=(far/CW)|0;let placed=false;
      for(let r=0;r<=4&&!placed;r++)for(let dy=-r;dy<=r&&!placed;dy++)for(let dx=-r;dx<=r&&!placed;dx++){
        const x=fx+dx,y=fy+dy;if(x<2||y<2||x>CW-3||y>CH-3)continue;const i=y*CW+x;if(!flo(g[i]))continue;
        let open=0;for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)if((ox||oy)&&flo(g[i+oy*CW+ox]))open++;
        if(open===8){g[i]=TD;placed=true;}}
      if(!placed){ // no open spot: use a wall tile right next to it instead
        for(const [dx,dy] of DIRS){const i=(fy+dy)*CW+fx+dx;if(g[i]===TB&&!inVault(fx+dx,fy+dy)){g[i]=TD;placed=true;break;}}}
      if(!placed)break;
    }
    BK0X=vault.x+1;BK1X=vault.x+vault.w-1;BK0Y=vault.y+1;BK1Y=vault.y+vault.h-1;
    const lights=[];for(const L of leaves)if(L!==vault&&!store.includes(L)){lights.push({x:(L.x+L.w/2)*T,y:(L.y+L.h/2)*T});if(L.w>12){lights.push({x:(L.x+L.w/4)*T,y:(L.y+L.h/2)*T},{x:(L.x+L.w*3/4)*T,y:(L.y+L.h/2)*T});}}
    return {g,dark,blk:new Int16Array(CW*CH).fill(-1),alleys,key:keys[0],keys,lights,jail:false,cell:null,door:[ddx,ddy]};
  }
  throw new Error('museum layout failed');
}
function genRoofs(){
  setDims(9,7,4,3); // the Federal Reserve sits in the middle of downtown
  const R=genCity(false,1),g=R.g;
  for(let i=0;i<g.length;i++){const t=g[i];g[i]=(t===TR||t===TS)?TB:(t===TB||t===TK||t===TKD)?TS:t;}
  const blocks=[];for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++)blocks.push([bx,by]);
  const id=(bx,by)=>by*NBX+bx,bridges=[];
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){if(bx<NBX-1)bridges.push({a:id(bx,by),b:id(bx+1,by),h:true,bx,by});if(by<NBY-1)bridges.push({a:id(bx,by),b:id(bx,by+1),h:false,bx,by});}
  const build=br=>{
    if(br.h){const x0=12*(br.bx+1)-1,y=11*br.by+4+rI(5);for(let x=x0;x<=x0+3;x++)g[y*CW+x]=TR;g[y*CW+x0-1]=TS;g[y*CW+x0+4]=TS;}
    else{const y0=11*(br.by+1)-1,x=12*br.bx+4+rI(6);for(let y=y0;y<=y0+3;y++)g[y*CW+x]=TR;g[(y0-1)*CW+x]=TS;g[(y0+4)*CW+x]=TS;}
  };
  // a plank bridge between EVERY pair of neighboring rooftops: no dead ends, you can always head straight for the Reserve
  for(const br of bridges)build(br);
  const hx=BK0X+4,hy=BK0Y+3;g[hy*CW+hx]=TKD; // roof hatch on the Federal Reserve
  // 3 power boxes on far-apart roofs
  const boxes=[];
  for(let tr=0;tr<5000&&boxes.length<3;tr++){const x=rI(CW),y=rI(CH);if(g[y*CW+x]!==TS)continue;
    if(Math.abs(x-4)+Math.abs(y-4)<20||Math.abs(x-hx)+Math.abs(y-hy)<10||boxes.some(b=>Math.abs(b.x-x)+Math.abs(b.y-y)<18))continue;
    if(!DIRS.some(([dx,dy])=>g[(y+dy)*CW+x+dx]===TS)||DIRS.some(([dx,dy])=>g[(y+dy)*CW+x+dx]===TR||g[(y+2*dy)*CW+x+2*dx]===TR))continue; // never block a bridge
    g[y*CW+x]=TB;boxes.push({x,y,cut:false});}
  const lights=[];for(let k=0;k<45;k++){for(let tr=0;tr<50;tr++){const x=rI(CW),y=rI(CH);if(g[y*CW+x]===TS){lights.push({x:x*T+8,y:y*T+8});break;}}}
  return Object.assign(R,{lights,boxes,door:[hx,hy],keys:[],key:null,alleys:R.alleys});

const prevArr=new Int32Array(CW*CH);
function bfsStep(sx,sy,gx,gy){
  if(sx===gx&&sy===gy)return null;
  prevArr.fill(-1);const s=sy*CW+sx,goal=gy*CW+gx;prevArr[s]=s;const q=[s];let h=0;
  while(h<q.length){
    const cur=q[h++];if(cur===goal)break;
    const cx=cur%CW,cy=(cur/CW)|0;
    for(const [dx,dy] of DIRS){
      const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=CW||ny>=CH)continue;
      const n=ny*CW+nx;if(prevArr[n]!==-1||!walkC(nx,ny))continue;prevArr[n]=cur;q.push(n);
    }
  }
  if(prevArr[goal]===-1)return null;
  let cur=goal;while(prevArr[cur]!==s)cur=prevArr[cur];
  return [cur%CW,(cur/CW)|0];
}
function nearestWalk(x,y){
  for(let r=0;r<=3;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    if(walkC(x+dx,y+dy))return [x+dx,y+dy];
  }
  return null;
}
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy,x=x0,y=y0;
  while(!(x===x1&&y===y1)){
    const e2=2*err;if(e2>=dy){err+=dy;x+=sx;}if(e2<=dx){err+=dx;y+=sy;}
    if(x===x1&&y===y1)break;if(solidCity(ct(x,y)))return false;
  }
  return true;
}
function patrolStep(c){

  const fwd=opts.find(d=>d[0]===c.dx&&d[1]===c.dy);

  m.x+=Math.sign(ddx)*sp*dt;m.y+=Math.sign(ddy)*sp*dt;return false;

// Rings spin around the lock. Each ring has one gap. Jump [UP] when the next ring's gap
// is at the top. Every gap passes the top exactly on a metronome tick: keep the rhythm.
let LK=null;
const LOCK_BEAT=.5,LOCK_CX=160,LOCK_CY=126; // low enough that the thief on top is never under the HUD
function startLock(){
  state='lock';flashOn=false;
  // 6 rings. one is fast (once a second), one lands OFF the beat (between ticks),
  // two have a red fake gap. every real window is about 1/6 of a second.
  const beats=[4,3,5,2,3,4],first=[3,4,5.5,6,7,8],fake=[false,true,false,false,true,false];
  LK={t:0,layer:0,n:6,rings:[],jumpT:0,lastBeat:-1,openT:0,shake:0,from:0,alarm:45};
  for(let i=0;i<LK.n;i++){const per=beats[i]*LOCK_BEAT;
    LK.rings.push({period:per,dir:i%2?-1:1,first:first[i]*LOCK_BEAT,gap:Math.max(.16,.09*2*Math.PI/per),fake:fake[i],dinged:-1});}
  say('THE GIANT LOCK! JUMP [UP] WHEN|THE GAP IS ON TOP. FAST = BONUS HEART',4);showHelp();
}
const lockR=i=>88-i*13;
function lockGap(r){return -Math.PI/2+r.dir*2*Math.PI*(LK.t-r.first)/r.period;}
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function updLock(dt){
  if(LK.race){updLockRace(dt);return;}
  LK.t+=dt;LK.jumpT-=dt;LK.shake-=dt;msgT-=dt;hurtFlash-=dt;
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(LK.openT>0){LK.openT-=dt;if(LK.openT<=0){LK=null;escapeJail();}return;}
  if(LK.alarm>0){LK.alarm-=dt;if(LK.alarm<=0){LK.alarm=0;say('BONUS TIME IS OVER.|NO RUSH NOW: KEEP GOING!',3);}}
  const b=Math.floor(LK.t/LOCK_BEAT);
  if(b!==LK.lastBeat){LK.lastBeat=b;beep(b%4===0?1100:800,.04,'square',b%4===0?.05:.03);}
  // a soft 'ding' when the gap you need is dead center on top
  const r=LK.rings[LK.layer];
  if(r){const cyc=Math.round((LK.t-r.first)/r.period);if(cyc!==r.dinged&&Math.abs(angDiff(lockGap(r),-Math.PI/2))<.06){r.dinged=cyc;beep(1568,.08,'triangle',.05);}}

    LK.jumpT=.22;LK.from=LK.layer;
    if(Math.abs(angDiff(lockGap(r),-Math.PI/2))<r.gap){
      LK.layer++;sfx.jump();floatTxt(LOCK_CX,LOCK_CY-lockR(LK.layer-1)-4,'CLICK!','#7dff7d');
      if(LK.layer>=LK.n){LK.openT=1.6;sfx.win();if(LK.alarm>0){timeBonus(1);say('THE LOCK OPENS!|FAST! BONUS: +1 HEART',2.5);}else say('THE LOCK OPENS!',2);}

    }
  }
}

      if(q.hurt>0){ctx.fillStyle=`rgba(255,0,0,${q.hurt*.5})`;ctx.fillRect(j?160:0,0,160,VH);}});

const BOAT_Y=VH-46;
// ---- crash into a rock: "PATCH THE HULL!" memory game. match all pairs before time runs out ----
const CARD_ICONS=['anchor','fish','star','shell','wheel','crab'];
function startMatch(){
  const icons=CARD_ICONS.slice().sort(()=>Math.random()-.5).slice(0,4),cards=[...icons,...icons].sort(()=>Math.random()-.5).map(ic=>({ic,up:false,done:false}));
  BTS.match={cards,cur:0,open:[],wait:0,time:16,result:null,resT:0};sfx.hurt();shake=.4;
}
function updMatch(dt){
  const m=BTS.match;
  if(m.result){m.resT-=dt;if(m.resT<=0){BTS.match=null;BTS.inv=1.5;}return;}
  m.time-=dt;
  if(m.time<=0){m.result='fail';m.resT=1.4;loseHP(armor?1:3);sfx.hurt();hurtFlash=.4;
    if(hp<=0){hp=MAXHP;say('OUT OF HEARTS! BACK TO THE DOCK',3);startBoat();helpOpen=false;return;}
    say('TOO SLOW! THE BOAT LEAKS|'+(armor?'-1/3 HEART':'-1 HEART'),2);return;}
  if(pressed.left)m.cur=(m.cur+7)%8;if(pressed.right)m.cur=(m.cur+1)%8;if(pressed.up||pressed.down)m.cur=(m.cur+4)%8;
  if(m.wait>0){m.wait-=dt;if(m.wait<=0){for(const i of m.open)m.cards[i].up=false;m.open=[];}return;}
  if(pressed.fire||pressed.start)flipCard(m.cur);
}
function flipCard(i){
  const m=BTS&&BTS.match;if(!m||m.result||m.wait>0)return;
  if(!m.cards[i].up&&!m.cards[i].done){m.cur=i;
    m.cards[i].up=true;m.open.push(i);sfx.click();
    if(m.open.length===2){const [a,b]=m.open;
      if(m.cards[a].ic===m.cards[b].ic){m.cards[a].done=m.cards[b].done=true;m.open=[];sfx.coin();
        if(m.cards.every(c=>c.done)){m.result='win';m.resT=1.2;sfx.big();say('HULL PATCHED! NO DAMAGE',1.6);}}
      else m.wait=.6;}
  }
}
// mouse: click a card to flip it, hover to highlight it
function cardAt(e){
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*VW/r.width,y=(e.clientY-r.top)*VH/r.height;
  for(let i=0;i<8;i++){const cx=70+(i%4)*48,cy=82+Math.floor(i/4)*52;if(x>=cx-2&&x<cx+34&&y>=cy-2&&y<cy+44)return i;}
  return -1;
}
cv.addEventListener('mousedown',e=>{if(state==='boat'&&BTS&&BTS.match&&!paused){const i=cardAt(e);if(i>=0){initAudio();flipCard(i);}}});
cv.addEventListener('mousemove',e=>{if(state==='boat'&&BTS&&BTS.match){const i=cardAt(e);if(i>=0&&!BTS.match.result)BTS.match.cur=i;cv.style.cursor=i>=0?'pointer':'default';}else cv.style.cursor='default';});
function drawCardIcon(ic,x,y){
  const R=(a,b,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x+a,y+b,w,h);};
  if(ic==='anchor'){R(9,3,2,14,'#c0c5cf');R(6,5,8,2,'#c0c5cf');R(4,15,12,2,'#c0c5cf');R(4,12,2,4,'#c0c5cf');R(14,12,2,4,'#c0c5cf');R(8,1,4,3,'#c0c5cf');}
  else if(ic==='fish'){R(4,8,10,6,'#ff9a3c');R(14,6,4,10,'#ff9a3c');R(6,9,2,2,'#000');R(3,9,2,4,'#ffb070');}
  else if(ic==='star'){R(9,3,2,14,'#ffd400');R(3,9,14,2,'#ffd400');R(6,6,8,8,'#ffd400');R(8,8,4,4,'#fff6a0');}
  else if(ic==='shell'){R(5,6,10,9,'#f0c8c0');R(7,4,6,2,'#f0c8c0');R(7,7,1,8,'#c89890');R(10,6,1,9,'#c89890');R(13,7,1,8,'#c89890');R(8,15,4,2,'#c89890');}
  else if(ic==='wheel'){ctx.strokeStyle='#8a5a30';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+10,y+10,6,0,7);ctx.stroke();R(9,2,2,16,'#8a5a30');R(2,9,16,2,'#8a5a30');R(8,8,4,4,'#d4a017');}
  else{R(5,9,10,6,'#d8402a');R(6,8,8,1,'#f06040');R(6,6,1,3,'#000');R(13,6,1,3,'#000');R(2,8,3,3,'#d8402a');R(15,8,3,3,'#d8402a');R(4,15,2,2,'#a02010');R(14,15,2,2,'#a02010');}
}
function drawMatch(){
  const m=BTS.match;
  ctx.fillStyle='rgba(0,10,25,.85)';ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#14283e';ctx.fillRect(40,30,240,170);ctx.fillStyle='#ffb000';ctx.fillRect(40,30,240,2);ctx.fillRect(40,198,240,2);
  txt('CRASH! PATCH THE HULL!',VW/2,38,'#ffb000','center');
  txt('MATCH THE PAIRS',VW/2,52,'#9fd3ff','center');
  const t=Math.max(0,Math.ceil(m.time));ctx.fillStyle='#223';ctx.fillRect(60,66,200,6);ctx.fillStyle=m.time<5?'#f33':'#7dff7d';ctx.fillRect(60,66,Math.round(200*Math.max(0,m.time)/16),6);
  m.cards.forEach((c,i)=>{const cx=70+(i%4)*48,cy=82+Math.floor(i/4)*52,sel=i===m.cur&&!m.result;
    ctx.fillStyle=sel?'#ffd400':'#0a1420';ctx.fillRect(cx-2,cy-2,36,46);
    if(c.up||c.done){ctx.fillStyle=c.done?'#2a4a2a':'#e8e4d8';ctx.fillRect(cx,cy,32,42);drawCardIcon(c.ic,cx+6,cy+11);}
    else{ctx.fillStyle='#2a5aa8';ctx.fillRect(cx,cy,32,42);ctx.fillStyle='#3a7ad0';for(let k=0;k<42;k+=8)ctx.fillRect(cx+2,cy+k+3,28,2);}
  });
  txt(m.result==='win'?'PATCHED!':m.result==='fail'?'LEAKING...':'CLICK OR SPACE   '+t+'s',VW/2,188,m.result==='fail'?'#f33':m.result==='win'?'#7dff7d':'#ccd','center');
}
function updBoat(dt){
  if(BTS.race){updBoatRace(dt);return;}
  const b=BTS;msgT-=dt;hurtFlash-=dt;shake-=dt;
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(b.match){updMatch(dt);return;}
  b.t+=dt;b.inv-=dt;b.turbo-=dt;
  let sp=(keys.up?125:keys.down?45:80)+(b.turbo>0?70:0),steer=(keys.right?1:0)-(keys.left?1:0);
  const sy=o=>BOAT_Y-(o.d-b.d);
  // whirlpools drag you toward the middle and slow you down
  for(const w of b.pools){const dy=sy(w)-BOAT_Y,dx=w.x-b.x,dist=Math.hypot(dx,dy);
    if(dist<w.r*2.2){b.x+=Math.sign(dx)*55*dt*(1-dist/(w.r*2.2))*1.6;sp*=.6;if(dist<w.r*.6&&!b.spun){b.spun=1;say('WHIRLPOOL! STEER OUT!',1.2);}}else if(dist>w.r*3)b.spun=0;}
  b.d+=sp*dt;b.x=clamp(b.x+steer*130*dt,14,VW-14);
  const hit=why=>{if(b.inv>0)return;loseHP(armor?1:3);b.inv=1.5;sfx.hurt();shake=.3;hurtFlash=.4;
    if(hp<=0){hp=MAXHP;say('OUT OF HEARTS! BACK TO THE DOCK',3);startBoat();helpOpen=false;return;}else say(why+(armor?' -1/3 HEART':' -1 HEART'),1.8);};
  for(const r of b.rocks){if(r.hit)continue;const y=sy(r);if(b.inv<=0&&Math.abs(y-BOAT_Y)<r.r+6&&Math.abs(r.x-b.x)<r.r+5){r.hit=true;startMatch();return;}}
  for(const l of b.logs){l.x+=l.vx*dt;if(l.x<l.w/2||l.x>VW-l.w/2)l.vx*=-1;const y=sy(l);if(Math.abs(y-BOAT_Y)<8&&Math.abs(l.x-b.x)<l.w/2+5)hit('CRASHED INTO A LOG!');}
  for(const k of b.sharks){const y=sy(k);if(y>-60&&y<VH)k.x+=Math.sign(b.x-k.x)*38*dt+Math.sin(b.t*3+k.ph)*20*dt;k.d+=40*dt; // sharks swim after you
    if(Math.abs(sy(k)-BOAT_Y)<10&&Math.abs(k.x-b.x)<11)hit('A SHARK BIT THE BOAT!');}
  for(const bt of b.bottles){if(bt.got)continue;const y=sy(bt);if(Math.abs(y-BOAT_Y)<12&&Math.abs(bt.x-b.x)<11){bt.got=true;
    if(bt.crab){floatTxt(b.x,BOAT_Y-14,'CRAB!','#f55');beep(300,.1,'square',.05,-150);hit('A CRAB JUMPED OUT AND BIT YOU!');}
    else{const v=100+rI(5)*50;gain(v);sfx.coin();floatTxt(b.x,BOAT_Y-14,'+$'+v,'#7dff7d');}}}
  for(const fu of b.fuel){if(fu.got)continue;const y=sy(fu);if(Math.abs(y-BOAT_Y)<12&&Math.abs(fu.x-b.x)<11){fu.got=true;b.turbo=3;sfx.big();floatTxt(b.x,BOAT_Y-14,'TURBO!','#ffb000');}}
  for(const p of b.pats){
    p.x+=p.vx*dt;if(p.x<20||p.x>VW-20)p.vx*=-1;
    const py=sy(p),ang=Math.PI/2+Math.sin(b.t*1.3+p.ph)*.7;
    const vx=b.x-p.x,vy=BOAT_Y-py,dist=Math.hypot(vx,vy);
    if(dist<120&&Math.abs(angDiff(Math.atan2(vy,vx),ang))<.22)hit('SPOTTED BY A PATROL BOAT!');
    if(Math.abs(py-BOAT_Y)<10&&Math.abs(p.x-b.x)<16)hit('RAMMED A PATROL BOAT!');
  }
  if(b.d>=b.len){BTS=null;escapeJail();}
}
function drawBoat(){
  const b=BTS,sx=shake>0?rI(5)-2:0,sy=o=>BOAT_Y-(o.d-b.d),on=y=>y>-40&&y<VH+30;
  ctx.fillStyle='#0a1a2e';ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<40;i++){const y=((i*37+b.d*1)%(VH+20))-10,x=(i*71)%VW;ctx.fillStyle='rgba(120,170,220,.18)';ctx.fillRect(x+sx,y,10,1);}
  const shoreY=BOAT_Y-(b.len-b.d)-20;
  if(shoreY>-80){ctx.fillStyle='#c8b88a';ctx.fillRect(0,0,VW,shoreY+20);ctx.fillStyle='#2f4a2a';ctx.fillRect(0,0,VW,shoreY);txt('MAINLAND',VW/2,shoreY-14,'#ffd400','center');}
  for(const w of b.pools){const y=sy(w);if(!on(y))continue;for(let k=0;k<4;k++){ctx.strokeStyle=`rgba(140,190,240,${.15+k*.08})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(w.x+sx,y,w.r*(1-k*.22),b.t*3+k,b.t*3+k+4.2);ctx.stroke();}ctx.fillStyle='#061020';ctx.beginPath();ctx.arc(w.x+sx,y,5,0,7);ctx.fill();}
  for(const r of b.rocks){const y=sy(r);if(!on(y))continue;ctx.fillStyle='#4a4f58';ctx.beginPath();ctx.arc(r.x+sx,y,r.r,0,7);ctx.fill();ctx.fillStyle='#6b7079';ctx.fillRect(r.x-3+sx,y-r.r+2,5,3);ctx.fillStyle='rgba(200,230,255,.35)';ctx.fillRect(r.x-r.r+sx,y+r.r-2,r.r*2,2);}
  for(const l of b.logs){const y=sy(l);if(!on(y))continue;ctx.fillStyle='#5a3d22';ctx.fillRect(l.x-l.w/2+sx,y-4,l.w,8);ctx.fillStyle='#7a5a3a';ctx.fillRect(l.x-l.w/2+sx,y-4,l.w,2);ctx.fillStyle='#3a2612';ctx.fillRect(l.x-l.w/2+sx,y-3,3,6);ctx.fillRect(l.x+l.w/2-3+sx,y-3,3,6);}
  for(const bt of b.bottles){if(bt.got)continue;const y=sy(bt)+Math.round(Math.sin(b.t*3+bt.ph)*2);if(!on(y))continue;ctx.fillStyle='#3a8a5a';ctx.fillRect(bt.x-3+sx,y-2,7,4);ctx.fillStyle='#5aba7a';ctx.fillRect(bt.x+3+sx,y-1,3,2);ctx.fillStyle='#e8d9a8';ctx.fillRect(bt.x-1+sx,y-1,3,2);}
  for(const fu of b.fuel){if(fu.got)continue;const y=sy(fu);if(!on(y))continue;ctx.fillStyle='#c81e1e';ctx.fillRect(fu.x-4+sx,y-5,8,10);ctx.fillStyle='#ffd400';ctx.fillRect(fu.x-2+sx,y-2,4,4);ctx.fillStyle='#222';ctx.fillRect(fu.x+1+sx,y-7,3,2);}
  for(const k of b.sharks){const y=sy(k);if(!on(y))continue;ctx.fillStyle='rgba(200,230,255,.3)';ctx.fillRect(k.x-7+sx,y+3,14,2);ctx.fillStyle='#6b7079';ctx.beginPath();ctx.moveTo(k.x-5+sx,y+3);ctx.lineTo(k.x+sx,y-8);ctx.lineTo(k.x+4+sx,y+3);ctx.closePath();ctx.fill();}
  for(const p of b.pats){
    const y=sy(p);if(y<-140||y>VH+20)continue;const ang=Math.PI/2+Math.sin(b.t*1.3+p.ph)*.7;
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,245,190,.2)';ctx.beginPath();ctx.moveTo(p.x+sx,y);ctx.arc(p.x+sx,y,120,ang-.22,ang+.22);ctx.closePath();ctx.fill();
    glow(p.x+sx,y,16,Math.floor(gameT*8)%2?'255,30,30':'40,90,255',.5);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#e8e8e8';ctx.fillRect(p.x-12+sx,y-5,24,10);ctx.fillStyle='#111';ctx.fillRect(p.x-6+sx,y-3,10,6);ctx.fillStyle='#2a52b5';ctx.fillRect(p.x-12+sx,y+2,24,2);
  }
  if(!(b.inv>0&&Math.floor(b.inv*12)%2))boatSprite(b.x+sx,BOAT_Y,b.race&&b.vin,b.turbo);
  if(!b.race){const f=clamp(b.d/b.len,0,1);ctx.fillStyle='#223';ctx.fillRect(VW-10,20,4,VH-40);ctx.fillStyle='#ffd400';ctx.fillRect(VW-10,20+(VH-40)*(1-f),4,(VH-40)*f);}
  drawFloaters(0,0);
  if(b.match)drawMatch();
}

function updCity(dt){
  if(C.theme==='rain'){C.flash-=dt;C.thunder-=dt;if(C.thunder<=0){C.thunder=9+Math.random()*9;C.flash=.3;beep(55,.9,'sawtooth',.07,-25);}}
  cityTime+=dt;lockMsgT-=dt;P.inv-=dt;fireCD-=dt;
  // --- player
  let want=keys[lastDir]?lastDir:['up','down','left','right'].find(k=>keys[k]);
  const pSpeed=74+14*speedLvl+10*upLvl('shoes')+(boostT>0?30:0);

    if(want){const [wx,wy]=DV[want];
      if(wx===-P.dx&&wy===-P.dy){const ox=P.tx,oy=P.ty;P.tx=P.ttx;P.ty=P.tty;P.ttx=ox;P.tty=oy;P.dx=wx;P.dy=wy;P.dir=want;}}

  if(P.inDoor&&!wasInDoor&&flashOn){flashOn=false;sfx.click();say('FLASHLIGHT OFF - YOU\'RE HIDDEN',1.8);}
  P.hidden=P.inDoor&&!flashOn;
  if(P.inDoor&&flashOn&&pressed.flash)say('YOUR FLASHLIGHT GIVES YOU AWAY!|PRESS F TO HIDE',2.5);

      if(n){cards--;sfx.toss();floatTxt(P.x+8,P.y-8,'CARDS!','#fff');say(n+' GUARD'+(n>1?'S STOP':' STOPS')+' TO PLAY CARDS!|8 SECONDS. SNEAK PAST!',2.5);}else say('NO GUARDS CLOSE ENOUGH|GET WITHIN 7 STEPS FIRST',1.8);}}

    if(c.ax==='x'){c.x+=c.d*sp*dt;if(c.x>WW+4)c.x=-c.w-4;if(c.x<-c.w-4)c.x=WW+4;}
    else{c.y+=c.d*sp*dt;if(c.y>WH+4)c.y=-c.h-4;if(c.y<-c.h-4)c.y=WH+4;}
    if(!c.truck&&!P.hidden&&P.x+4<c.x+c.w-1&&P.x+12>c.x+1&&P.y+3<c.y+c.h-1&&P.y+14>c.y+1)
      hurtCity(c.jeep?'HIT BY A PATROL JEEP!':c.laundry?'RUN OVER BY A LAUNDRY CART!':c.cart?'HIT BY A SECURITY CART!':c.cop?'HIT BY A COP CAR!':'RUN OVER BY A CAR!',c.cop,!!c.cart);
  }
  if(C.helis){
    for(const h of C.helis){
      h.x+=h.vx*dt;h.y+=h.vy*dt;h.cool-=dt;if(h.x<60||h.x>WW-60)h.vx*=-1;if(h.y<60||h.y>WH-60)h.vy*=-1;
      if(h.cool<=0&&!P.hidden&&Math.hypot(P.x+8-h.x,P.y+8-h.y)<38){
        h.cool=3;sfx.alarm();say('THE HELICOPTER SPOTTED YOU!|SWAT IS COMING',2.2);
        lastSeenG=walkC(ptx,pty)?[ptx,pty]:(nearestWalk(ptx,pty)||[ptx,pty]);
        for(const c of cops)if(!(c.blind>0)&&Math.abs(c.tx-ptx)+Math.abs(c.ty-pty)<=24){c.state='chase';c.lost=5;c.alert=1;}
      }
    }
    const bx=C.boxes.find(b=>!b.cut&&Math.abs(b.x-ptx)+Math.abs(b.y-pty)===1);
    if(bx&&!P.moving&&!P.inDoor){
      if(C.cutT===0)say('CUTTING THE POWER... STAY 3 SEC!',2);
      C.cutT+=dt;C.cutNoise-=dt;C.cutBox=bx;
      if(C.cutNoise<=0){C.cutNoise=1;beep(2200,.08,'sawtooth',.04,-1500);makeNoise(P.x+8,P.y+8,9);}
      if(C.cutT>=3-.75*upLvl('hands')){bx.cut=true;C.cutT=0;const n=C.boxes.filter(b=>b.cut).length;sfx.zap();floatTxt(bx.x*T+8,bx.y*T,'POWER CUT!','#ffd400');
        if(n>=3){hasKey=true;say('ALL 3 POWER BOXES CUT!|THE ROOF HATCH IS OPEN. GO!',4);}else say('POWER BOX '+n+'/3 CUT!',2.5);}
    }else if(C.cutT>0){C.cutT=0;C.cutNoise=0;say('YOU STOPPED. THE BOX RESETS',1.5);}
  }
  if(C.mounds){
    let nd=99;for(const mm of C.mounds)if(!mm.dug)nd=Math.min(nd,Math.abs(mm.x-ptx)+Math.abs(mm.y-pty));
    C.detD=nd;C.detT=(C.detT||0)-dt;
    if(nd<=14&&C.digT<=0&&C.detT<=0){C.detT=.12+nd*.1;beep(nd<=1?1760:1200-nd*30,.04,'square',.025);}
    const m=C.mounds.find(m=>!m.dug&&m.x===ptx&&m.y===pty);
    if(m&&!P.moving&&!P.inDoor){
      if(C.digT===0){say('DIGGING... STAY '+digNeed()+' SECONDS!|(IT\'S LOUD. THEY\'RE COMING!)',2.5);}
      if(C.digT===0)C.digNoise=1; // digging is LOUD: guards hear it after a second
      C.digT+=dt;C.digNoise-=dt;C.digM=m;
      if(Math.floor(C.digT*4)!==Math.floor((C.digT-dt)*4))beep(140+rI(40),.05,'square',.025,-40); // soft scrape sounds
      if(C.digNoise<=0){C.digNoise=1.5;beep(120+rI(60),.12,'square',.05,-60);const n=makeNoise(P.x+8,P.y+8,9);
        if(n)say('THE DIGGING IS LOUD! '+n+' GUARD'+(n>1?'S ARE':' IS')+' COMING|'+(coconuts>0?'THROW A COCONUT AT THEM: PRESS T!':'NO COCONUTS! GRAB SOME UNDER THE PALMS'),3);}
      if(C.digT>=digNeed()){
        C.cocoTip=4; // (the dig message already said it)
        m.dug=true;C.digT=0;stat('dug',1,10,'dig');
        if(m.part>=0){const pt=C.parts.find(p=>!p.got);pt.got=true;const got=C.parts.filter(p=>p.got).length;sfx.win();floatTxt(P.x+8,P.y-6,pt.name+'!','#ffb000');
          banner={t:3,idx:pt.idx,name:pt.name,got};
          if(got>=4){hasKey=true;say('ALL 4 BOAT PARTS! FIX THE BOAT|AT THE DOCK AND ESCAPE!',4);}else say('YOU DUG UP THE '+pt.name+'!|('+got+'/4) KEEP SEARCHING',3);}
        else{gain(m.val);sfx.coin();floatTxt(P.x+8,P.y-6,'+$'+m.val,'#7dff7d');say('JUST SOME BURIED COINS.|NOT A BOAT PART...',2);}
      }
    }else if(C.digT>0){C.digT=0;C.digNoise=0;say('YOU STOPPED DIGGING.|THE HOLE FILLS BACK IN',1.8);}
  }
  if(C.mounds){C.cocoTip=(C.cocoTip||0)-dt;
    if(C.cocoTip<=0&&C.digT<=0&&cops.some(c=>(c.state==='chase'||c.state==='investigate')&&!(c.blind>0)&&Math.abs(c.tx-ptx)+Math.abs(c.ty-pty)<=10)){
      C.cocoTip=10;say('THE POLICE ARE COMING TO YOU!|'+(coconuts>0?'THROW A COCONUT: PRESS T!':'GRAB COCONUTS UNDER THE PALMS'),2.8);}}
  const digging=!!(C.mounds&&C.digT>digNeed()*.5); // crabs notice halfway through a dig
  if(C.crabs)for(const b of C.crabs){ // crabs only go back and forth (sideways!)
    if(digging&&Math.abs(b.x-P.x)+Math.abs(b.y-P.y)<3*T){ // ...except while you dig: they scuttle at you, fast
      const ddx=P.x-b.x,ddy=P.y-b.y,want=Math.abs(ddx)>Math.abs(ddy)?[Math.sign(ddx),0]:[0,Math.sign(ddy)];
      if(walkC(Math.round(b.x/T)+want[0],Math.round(b.y/T)+want[1])){b.dx=want[0];b.dy=want[1];}
    }
    const csp=b.sp*(digging?1.25:1);
    const nx=b.x+b.dx*csp*dt,ny=b.y+b.dy*csp*dt;
    if(!walkC(Math.floor((nx+8+b.dx*7)/T),Math.floor((ny+8+b.dy*7)/T))){b.dx=-b.dx;b.dy=-b.dy;}else{b.x=nx;b.y=ny;}
    if(!P.hidden&&Math.abs(b.x-P.x)<10&&Math.abs(b.y-P.y)<10)hurtCity('PINCHED BY A CRAB!',false,true);
  }
  if(C.gulls)for(const gl of C.gulls){
    if(gl.state==='sit'&&!P.hidden&&Math.hypot(P.x+8-gl.x,P.y+8-gl.y)<36)spookGulls(gl,true);
    else if(gl.state==='fly'){gl.t-=dt;gl.x+=50*dt;gl.y-=70*dt;if(gl.t<=0){gl.state='gone';gl.t=15;}}
    else if(gl.state==='gone'){gl.t-=dt;if(gl.t<=0)Object.assign(gl,placeGulls(Math.round(P.x/T),Math.round(P.y/T)));}
  }
  if(C.bots)for(const b of C.bots){
    const nx=b.x+b.dx*b.sp*dt,ny=b.y+b.dy*b.sp*dt,ax=Math.round((nx+8+b.dx*7)/T),ay=Math.round((ny+8+b.dy*7)/T);
    if(!walkC(Math.floor((nx+8+b.dx*7)/T),Math.floor((ny+8+b.dy*7)/T))){ // bump: snap to tile, turn
      b.x=Math.round(b.x/T)*T;b.y=Math.round(b.y/T)*T;const opts=DIRS.filter(([dx,dy])=>walkC(Math.round(b.x/T)+dx,Math.round(b.y/T)+dy));
      [b.dx,b.dy]=opts.length?pick(opts):[-b.dx,-b.dy];
    }else{b.x=nx;b.y=ny;}
    if(!P.hidden&&Math.abs(b.x-P.x)<11&&Math.abs(b.y-P.y)<11)hurtCity('BUMPED BY A SECURITY ROBOT!');
  }
  // --- pickups
  for(const p of lostPiles){
    if(p.got)continue;
    if(Math.abs(P.x-p.x)<10&&Math.abs(P.y-p.y)<10){p.got=true;cash+=p.val;sfx.big();floatTxt(p.x+8,p.y,'+$'+p.val+' BACK!','#ffd400');}
  }
  lostPiles=lostPiles.filter(p=>!p.got);
  for(const k of picks){
    if(k.got)continue;
    if(Math.abs(P.x-k.x*T)<10&&Math.abs(P.y-k.y*T)<10){
      k.got=true;
      if(k.type==='coco'){coconuts+=2;sfx.coin();floatTxt(k.x*T+8,k.y*T,'+2 COCONUTS','#c8a070');
      }else if(k.type==='piece'){
        const got=C.pieces.filter(p=>p.got).length;sfx.key();floatTxt(k.x*T+8,k.y*T,'PIECE '+got+'/3','#9fd3ff');
        if(got>=3){hasKey=true;say('ALL 3 BLUEPRINT PIECES!|THE MUSEUM IS OPEN. GO!',4);}
        else say('BLUEPRINT PIECE '+got+'/3|CHECK THE MAP FOR THE REST',3);
      }else if(k.type==='uniform'){disguiseT=Math.max(0,disguiseT)+20;for(const c of cops)if(c.guard)c.state='patrol';sfx.buy();floatTxt(k.x*T+8,k.y*T,'UNIFORM ON!','#c0c5cf');say('A GUARD UNIFORM FROM THE LAUNDRY!|20S: GUARDS + CAMERAS IGNORE YOU',3.5);
      }else if(k.type==='key'){hasKey=true;keyTaken=false;sfx.key();say('KEYCARD GET! NOW ROB THE|BIG BANK (FOLLOW THE ARROW)',4);floatTxt(k.x*T+8,k.y*T,'KEYCARD','#5ff');}
      else if(k.type==='rare'){lootGain(k.val,k.x*T+8,k.y*T,true);badge('rare');say('YOU FOUND THE '+k.name+'!|A RARE TREASURE: +$'+Math.round(k.val*comboMult()),3.5);}
      else lootGain(k.val,k.x*T+8,k.y*T,k.type==='bag');
    }
  }
  // --- cops: perception + radio
  const pdark=C.dark[pty*CW+ptx];
  const lvl=nightLvl(),jail=isJail();
  const sightR=(flashOn?11:pdark?2:(C.mounds&&C.digT>0)?3:6)+(hardMode&&!pdark?1:0); // crouched down digging = hard to spot
  copsSee=false;
  for(const c of cops){
    c.cx=Math.round(c.x/T);c.cy=Math.round(c.y/T);
    c.dist=Math.abs(c.cx-ptx)+Math.abs(c.cy-pty);
    // guards: only inside their view cone (fooled by a uniform). dogs: sniff all around, short range
    if(c.dog&&dogTreatT>0){c.sees=false;continue;} // busy with a treat
    const looking=c.dog||(!c.guard&&!c.cone)||facesTile(c,ptx,pty),fooled=c.guard&&disguiseT>0;
    c.sees=!(c.blind>0)&&!P.hidden&&looking&&!fooled&&c.dist<=(c.dog?3:sightR)&&los(c.cx,c.cy,ptx,pty);
    c.fresh=false;
    if(c.sees)copsSee=true;
  }
  // the flashlight beam attracts cops from far away, even around corners
  for(const c of cops){
    if(c.state==='investigate'){c.invT-=dt;if(c.invT<=0)c.state='patrol';}
    if(flashOn&&!P.hidden&&c.state!=='chase'&&!(c.blind>0)&&c.dist<=18){
      if(c.state!=='investigate')c.alert=0;
      c.state='investigate';c.inv=pGoal;c.invT=6;
    }
  }
  if(copsSee){
    lastSeenG=pGoal;
    // spotter radios nearby units; at most 5 cops chase at once
    const team=cops.filter(c=>!(c.dog&&dogTreatT>0)&&(c.sees||c.state==='chase'||c.dist<=14)).sort((a,b)=>a.dist-b.dist).slice(0,5);
    let newAlarm=false;
    for(const c of team){if(c.state!=='chase'){c.alert=1.2;newAlarm=true;}c.state='chase';c.lost=4;c.fresh=true;}
    if(newAlarm)sfx.alarm();
  }
  for(const c of cops)if(c.state==='chase'&&!c.fresh){
    if(P.hidden)c.lost=Math.min(c.lost,2);
    c.lost-=dt;if(c.lost<=0)c.state='patrol';
  }
  cops.filter(c=>c.state==='chase').sort((a,b)=>a.dist-b.dist).forEach((c,i)=>c.role=i);
  for(const c of cops){
    c.alert-=dt;
    if(c.blind>0){c.blind-=dt;c.shootT=Math.max(c.shootT,.8);
      if(c.confused){c.spinT-=dt;if(c.spinT<=0){c.spinT=.45;const d=DIRS[rI(4)];c.dx=d[0];c.dy=d[1];}
        if(c.blind<=0){c.confused=false;if(c.noiseAt){c.state='investigate';c.inv=c.noiseAt;c.invT=5;}}}
      continue;}
    if((!c.guard||c.swat||c.armed)&&!c.dog&&c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist<=8&&c.dist>0){
      c.shootT-=dt;
      if(c.shootT<=0){
        c.shootT=c.swat?1.1:1.8-.2*lvl;const vx=Math.sign(ptx-c.cx),vy=Math.sign(pty-c.cy);c.dx=vx;c.dy=vy;
        bullets.push({x:c.x+8+vx*6,y:c.y+8+vy*6,vx:vx*155,vy:vy*155,life:1.6});sfx.shoot();
      }
    }else c.shootT=Math.max(c.shootT,c.swat?.35:.8); // SWAT aim fast
    const sp=(c.dog?(c.state==='chase'?68:46):c.state==='chase'?58+4*lvl:c.state==='investigate'?50:38); // guards walk at normal speed to check the digging noise
    // SWAT with a clear shot hold position and fire instead of charging
    const holding=c.swat&&c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist>1&&c.dist<=6;
    if(c.moving)stepMover(c,sp,dt);
    if(!c.moving&&!holding){
      let nx=null;
      if(c.state==='chase'&&lastSeenG){
        const tg=chaseTarget(c,ptx,pty);
        nx=bfsStep(c.tx,c.ty,tg[0],tg[1])||bfsStep(c.tx,c.ty,lastSeenG[0],lastSeenG[1]);
      }else if(c.state==='investigate'){
        nx=bfsStep(c.tx,c.ty,c.inv[0],c.inv[1]);
        if(!nx)c.invT=Math.min(c.invT,1.5); // reached the light: look around, then give up
      }else if(c.state!=='chase')nx=patrolNext(c);
      if(nx){c.dx=nx[0]-c.tx;c.dy=nx[1]-c.ty;c.ttx=nx[0];c.tty=nx[1];c.moving=true;}
    }
    // pickpocket: any guard who isn't FACING you can be robbed from the next tile
    if(c.guard&&!P.hidden&&!facesTile(c,ptx,pty)&&(c.wallet>0||c.hasKeyCard)&&Math.abs(c.x-P.x)<18&&Math.abs(c.y-P.y)<18){
      if(c.wallet>0){lootGain(c.wallet,c.x+8,c.y-4);c.wallet=0;stat('pick',1,10,'pick');}
      if(c.hasKeyCard){c.hasKeyCard=false;hasKey=true;sfx.key();floatTxt(c.x+8,c.y-14,keyName(),'#5ff');say(isIsland()?'YOU LIFTED THE BOAT KEY!|NOW SNEAK TO THE DOCK':"YOU LIFTED THE WARDEN'S KEYCARD!|NOW SNEAK TO THE EXIT GATE",4);}
    }
    const reach=P.inDoor?18:10,aware=(!c.guard&&!c.cone)||c.sees||(c.state==='chase'&&disguiseT<=0);
    if(aware&&!P.hidden&&!(c.blind>0)&&!(c.dog&&dogTreatT>0)&&Math.abs(c.x-P.x)<reach&&Math.abs(c.y-P.y)<reach)
      {const h0=hp;hurtCity(c.dog?'CAUGHT BY A GUARD DOG!':c.guard?'CAUGHT BY A GUARD!':'TACKLED BY A COP!');
       if(hp<h0){c.blind=1.5;c.slip=true;c.confused=false;c.state='patrol';floatTxt(P.x+8,P.y-8,'WRIGGLED FREE!','#ffb000');}}
  }
  // --- cop bullets
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    const btx=Math.floor(b.x/T),bty=Math.floor(b.y/T);
    const inMyDoor=P.inDoor&&btx===ptx&&bty===pty; // a lit doorway doesn't stop bullets
    if(!P.hidden&&P.inv<=0&&Math.hypot(b.x-(P.x+8),b.y-(P.y+8))<12&&!(b.x>P.x+3&&b.x<P.x+13&&b.y>P.y+2&&b.y<P.y+15))nearMiss(P.x+8,P.y-6);
    if(!P.hidden&&(inMyDoor||(b.x>P.x+3&&b.x<P.x+13&&b.y>P.y+2&&b.y<P.y+15))){b.life=0;hurtCity('SHOT BY POLICE!');continue;}
    if(solidCity(ct(btx,bty)))b.life=0;
  }
  bullets=bullets.filter(b=>b.life>0);
  // --- player stun bolts
  for(const b of bolts){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(solidCity(ct(Math.floor(b.x/T),Math.floor(b.y/T))))b.life=0;
    if(b.life<=0)continue;
    for(const c of cops)if(Math.abs(c.x+8-b.x)<9&&Math.abs(c.y+8-b.y)<9){zapCop(c);b.life=0;break;}
  }
  bolts=bolts.filter(b=>b.life>0);
  for(const t of toms){
    t.x+=t.vx*dt;t.y+=t.vy*dt;t.life-=dt;
    if(t.coco){ // coconut: flies, BONKs a guard it hits, and the THUD where it lands draws guards over
      const wall=solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)));
      for(const c of cops)if(!t.hit.has(c)&&!c.dog&&Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){t.hit.add(c);c.blind=2.5;c.slip=true;c.state='patrol';floatTxt(c.x+8,c.y-4,'BONK!','#ffb000');beep(180,.15,'square',.06,-80);t.life=0;}
      if(wall||t.life<=0){if(wall){t.x-=t.vx*dt;t.y-=t.vy*dt;}t.life=0;beep(90,.18,'triangle',.08,-30);floatTxt(t.x,t.y-6,'THUD','#c8a070');
        const tx0=Math.round(t.x/T),ty0=Math.round(t.y/T),spot=nearestWalk(tx0,ty0);let n=0;
        for(const c of cops)if(c.guard&&!(c.blind>0)&&Math.abs(c.tx-tx0)+Math.abs(c.ty-ty0)<=10){
          c.blind=3;c.confused=true;c.slip=false;c.state='patrol';c.alert=0;c.noiseAt=spot;c.spinT=0;n++;}
        if(n)say('THUD! '+n+(n>1?' GUARDS ARE':' GUARD IS')+' CONFUSED!',1.8);
        for(const gl of C.gulls||[])if(gl.state==='sit'&&Math.hypot(gl.x-t.x,gl.y-t.y)<40)spookGulls(gl);}
      continue;
    }
    if(solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)))){t.life=0;if(!t.soap)splats.push({x:t.x-t.vx*dt,y:t.y-t.vy*dt,t:1.5});sfx.splat();}
    if(t.life<=0)continue;
    for(const c of cops)if(!t.hit.has(c)&&Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){
      t.hit.add(c);c.blind=hardMode?3:4;if(!t.soap)stat('splat',1,25,'splat');c.slip=!!t.soap;c.alert=0;c.state='patrol';sfx.splat();
      floatTxt(c.x+8,c.y-4,t.soap?'SLIP!':'SPLAT!',t.soap?'#cff':'#f55');
    }
  }
  toms=toms.filter(t=>t.life>0);
  if(C.cams)for(const cm of C.cams){
    if(cm.tower&&C.mounds&&C.digT>0)cm.ph+=dt*.15; // towers sweep a little faster while you dig
    cm.ang=cm.tower?cm.ph+cityTime*.55:cm.base+Math.sin(cityTime*.8+cm.ph)*1.05;cm.cool-=dt;
    const vx=P.x+8-cm.x,vy=P.y+8-cm.y,d=Math.hypot(vx,vy);
    let diff=Math.atan2(vy,vx)-cm.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const dark=pdark&&!flashOn;
    if(cm.cool<=0&&d<cm.range&&Math.abs(diff)<cm.half&&!P.hidden&&disguiseT<=0&&!dark&&(cm.noLos||los(cm.tx,cm.ty,ptx,pty))){
      cm.cool=4;sfx.alarm();say(cm.lighthouse?'THE LIGHTHOUSE BEAM FOUND YOU!|GUARDS ARE ON THEIR WAY':cm.tower?'A SEARCHLIGHT SPOTTED YOU!|GUARDS ARE ON THEIR WAY':'A CAMERA SPOTTED YOU!|GUARDS ARE ON THEIR WAY',2.5);
      for(const c of cops)if(c.state!=='chase'&&!(c.blind>0)&&c.dist<=18){c.state='investigate';c.inv=pGoal;c.invT=8;c.alert=1;}
    }
  }
  for(const sp of splats)sp.t-=dt;splats=splats.filter(sp=>sp.t>0);
  cam.x=clamp(P.x+8-VW/2,0,WW-VW);cam.y=clamp(P.y+8-(VH+12)/2,-12,WH-VH);
}

function updShop(){
  const L=shopList();
  if(pressed.up)shopSel=(shopSel+L.length-1)%L.length,sfx.click();
  if(pressed.down)shopSel=(shopSel+1)%L.length,sfx.click();
  if(pressed.pause||pressed.use){closeShop();return;}
  if(pressed.start||pressed.fire){
    const it=L[shopSel];
    if(it.name==='LEAVE'){closeShop();return;}
    const cost=it.cost();
    if(cost===null){sfx.deny();return;}
    if(cash<cost){sfx.deny();say('NOT ENOUGH CASH! NEED $'+cost,1.6);return;}
    cash-=cost;spent+=cost;const m=it.buy();sfx.buy();stat('spent',cost,10000,'spend');
    closeShop();
    if(C.trader&&C.trader.machine)say(m+'|*CLUNK* THE MACHINE DROPS IT OUT',3);
    else if(C.trader&&C.trader.store)say(m+'|THE CLERK SLIDES IT UNDER THE GLASS',3);
    else if(C.trader&&C.trader.drone)say(m+'|A DRONE ZIPS IN AND DROPS IT OFF',3);
    else if(C.trader){moveTrader(18);say(m+(isJail()?'|THE TRADER SNEAKS TO ANOTHER CELL':'|THE DEALER SLIPS AWAY...'),3.5);}
    else{truck.mode='leave';truck.t=3.5;say(m+'|THE TRUCK DRIVES OFF...',3.5);}
  }
}

      else if(k.type!=='coco'){k.got=true;if(i===0)gain(k.val);RSTATS.loot[i]+=k.val;sfx.coin();floatTxt(k.x*T+8,k.y*T,'+$'+k.val,i?'#c8a070':'#7dff7d');}
    }
    // pickpocket guards (and the warden's keycard) from behind
    if(!pl.hidden)for(const c of cops){
      if(!c.guard||c.dog||facesTile(c,ptx,pty)||Math.abs(c.x-pl.x)>=18||Math.abs(c.y-pl.y)>=18)continue;
      if(c.wallet>0){if(i===0)gain(c.wallet);RSTATS.loot[i]+=c.wallet;floatTxt(c.x+8,c.y-4,'+$'+c.wallet,i?'#c8a070':'#7dff7d');c.wallet=0;sfx.coin();}
      if(c.hasKeyCard&&pl.pieces<G.need){c.hasKeyCard=false;grGot(pl,i,{kind:'warden',k:c},'KEYCARD');}
    }
    // island: dig (stand still on a mound 6 seconds)
    if(G.kind==='mounds'){
      const m=C.mounds.find(m=>!m.dug&&m.x===ptx&&m.y===pty);
      if(m&&!G.open&&!pl.moving&&!pl.inDoor&&pl.stun<=0&&pl.pieces<G.need){
        if(pl.digT===0){pl.digNoise=3.5;grSay(pl,'DIGGING... STAY 6 SECONDS!',2);}
        pl.digT+=dt;pl.digNoise-=dt;
        if(Math.floor(pl.digT*4)!==Math.floor((pl.digT-dt)*4))beep(140+rI(40),.05,'square',.025,-40);
        if(pl.digNoise<=0){pl.digNoise=2;beep(120+rI(60),.12,'square',.05,-60);makeNoise(pl.x+8,pl.y+8,6);}
        if(pl.digT>=6){m.dug=true;pl.digT=0;sfx.win();grGot(pl,i,{kind:'mound',k:m},PARTS[m.part]);}
      }else if(pl.digT>0){pl.digT=0;grSay(pl,'YOU STOPPED DIGGING.|THE HOLE FILLS BACK IN',1.5);}
    }
    // rooftops: cut a power box (stand next to it 3 seconds)
    if(G.kind==='boxes'){
      const bx=C.boxes.find(b=>!b.cut&&Math.abs(b.x-ptx)+Math.abs(b.y-pty)===1);
      if(bx&&!G.open&&!pl.moving&&!pl.inDoor&&pl.stun<=0&&pl.pieces<G.need){
        if(pl.cutT===0){pl.cutNoise=0;grSay(pl,'CUTTING THE POWER... 3 SEC!',2);}
        pl.cutT+=dt;pl.cutBox=bx;pl.cutNoise-=dt;
        if(pl.cutNoise<=0){pl.cutNoise=1;beep(2200,.08,'sawtooth',.04,-1500);makeNoise(pl.x+8,pl.y+8,9);}
        if(pl.cutT>=3){bx.cut=true;pl.cutT=0;sfx.zap();grGot(pl,i,{kind:'box',k:bx},'POWER CUT');}
      }else if(pl.cutT>0){pl.cutT=0;grSay(pl,'YOU STOPPED. THE BOX RESETS',1.5);}
    }
  });
  if(G.winner)return;
  // STEAL: sneak up behind the other thief to take what they're carrying
  if(G.kind!=='boxes'&&!G.open)G.pl.forEach((a,i)=>{const b=G.pl[1-i];
    if(a.stealCD>0||b.hidden||b.inv>0||!b.got.length||a.pieces>=G.need)return;
    if(Math.abs(a.x-b.x)>18||Math.abs(a.y-b.y)>18)return;
    if((a.x-b.x)*b.dx+(a.y-b.y)*b.dy>0)return; // b is looking at a: no luck
    a.got.push(b.got.pop());b.pieces--;a.pieces++;a.stealCD=3;b.stealCD=4;b.inv=1.5;a.inv=Math.max(a.inv,2);RSTATS.steals[i]++;sfx.key();
    grBanner(pname(i)+' STOLE '+(G.need>1?'A '+OBJN[G.kind]:'THE '+OBJN[G.kind])+' FROM '+pname(1-i)+'!',i?'#c8a070':'#ffffff');
    floatTxt(a.x+8,a.y-8,'STOLE IT!','#ffd400');grSay(a,'YOU STOLE IT!'+(G.need>1?' '+a.pieces+'/'+G.need:''),2.5);grSay(b,(i?'VINNIE':'VINAE')+' STOLE YOUR|'+OBJN[G.kind]+'!',2.5);});
  // tomatoes
  for(const t of toms){t.x+=t.vx*dt;t.y+=t.vy*dt;t.life-=dt;
    if(solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)))){t.life=0;splats.push({x:t.x-t.vx*dt,y:t.y-t.vy*dt,t:1.5});sfx.splat();continue;}
    if(t.life<=0)continue;
    const v=G.pl[1-t.owner];
    if(!v.hidden&&v.inv<=0&&Math.abs(v.x+8-t.x)<9&&Math.abs(v.y+8-t.y)<9){t.life=0;v.stun=1.3;v.inv=.6;v.digT=0;v.cutT=0;RSTATS.hits[t.owner]++;splats.push({x:t.x,y:t.y,t:1.5});sfx.splat();floatTxt(v.x+8,v.y-8,'SPLAT!','#f55');grSay(v,'SPLAT! A TOMATO!',1.5);continue;}
    for(const c of cops)if(Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){t.life=0;c.blind=2;c.state='patrol';sfx.splat();floatTxt(c.x+8,c.y-4,'SPLAT!','#f55');break;}}
  toms=toms.filter(t=>t.life>0);for(const sp of splats)sp.t-=dt;splats=splats.filter(sp=>sp.t>0);
  const vis=pl=>!pl.hidden;
  // traffic: cars + cop cars (city), laundry carts (jail), jeeps (island)
  for(const c of cars){let sp=c.sp;if(c.cop&&wanted())sp*=1.35;if(sp&&!carCanGo(c))sp=0;
    if(c.ax==='x'){c.x+=c.d*sp*dt;if(c.x>WW+4)c.x=-c.w-4;if(c.x<-c.w-4)c.x=WW+4;}else{c.y+=c.d*sp*dt;if(c.y>WH+4)c.y=-c.h-4;if(c.y<-c.h-4)c.y=WH+4;}
    for(const pl of G.pl)if(vis(pl)&&pl.x+4<c.x+c.w-1&&pl.x+12>c.x+1&&pl.y+3<c.y+c.h-1&&pl.y+14>c.y+1)
      grCaught(pl,c.jeep?'HIT BY A PATROL JEEP!':c.laundry?'RUN OVER BY A LAUNDRY CART!':c.cart?'HIT BY A CART!':c.cop?'HIT BY A COP CAR!':'RUN OVER BY A CAR!');}
  // security robots
  for(const b of C.bots||[]){
    const nx=b.x+b.dx*b.sp*dt,ny=b.y+b.dy*b.sp*dt;
    if(!walkC(Math.floor((nx+8+b.dx*7)/T),Math.floor((ny+8+b.dy*7)/T))){b.x=Math.round(b.x/T)*T;b.y=Math.round(b.y/T)*T;
      const opts=DIRS.filter(([dx,dy])=>walkC(Math.round(b.x/T)+dx,Math.round(b.y/T)+dy));[b.dx,b.dy]=opts.length?pick(opts):[-b.dx,-b.dy];}
    else{b.x=nx;b.y=ny;}
    for(const pl of G.pl)if(vis(pl)&&Math.abs(b.x-pl.x)<11&&Math.abs(b.y-pl.y)<11)grCaught(pl,'BUMPED BY A SECURITY ROBOT!');
  }
  // island crabs (they scuttle at whoever is digging) + seagulls
  for(const b of C.crabs||[]){
    const dg=G.pl.find(pl=>pl.digT>3.5&&Math.abs(b.x-pl.x)+Math.abs(b.y-pl.y)<3*T);
    if(dg){const ddx=dg.x-b.x,ddy=dg.y-b.y,w=Math.abs(ddx)>Math.abs(ddy)?[Math.sign(ddx),0]:[0,Math.sign(ddy)];if(walkC(Math.round(b.x/T)+w[0],Math.round(b.y/T)+w[1])){b.dx=w[0];b.dy=w[1];}}
    const csp=b.sp*(dg?1.25:1),nx=b.x+b.dx*csp*dt,ny=b.y+b.dy*csp*dt;
    if(!walkC(Math.floor((nx+8+b.dx*7)/T),Math.floor((ny+8+b.dy*7)/T))){b.dx=-b.dx;b.dy=-b.dy;}else{b.x=nx;b.y=ny;}
    for(const pl of G.pl)if(vis(pl)&&Math.abs(b.x-pl.x)<10&&Math.abs(b.y-pl.y)<10)grCaught(pl,'PINCHED BY A CRAB!');
  }
  for(const gl of C.gulls||[]){
    if(gl.state==='sit'){const pl=G.pl.find(pl=>vis(pl)&&Math.hypot(pl.x+8-gl.x,pl.y+8-gl.y)<36);if(pl){spookGulls(gl,false);grSay(pl,'SQUAWK! THE SEAGULLS|CALLED THE GUARDS',1.8);}}
    else if(gl.state==='fly'){gl.t-=dt;gl.x+=50*dt;gl.y-=70*dt;if(gl.t<=0){gl.state='gone';gl.t=15;}}
    else if(gl.state==='gone'){gl.t-=dt;if(gl.t<=0)Object.assign(gl,placeGulls(P.sx,P.sy));}
  }
  // police helicopters (rooftops)
  for(const h of C.helis||[]){
    h.x+=h.vx*dt;h.y+=h.vy*dt;h.cool-=dt;if(h.x<60||h.x>WW-60)h.vx*=-1;if(h.y<60||h.y>WH-60)h.vy*=-1;
    const pl=G.pl.find(pl=>vis(pl)&&Math.hypot(pl.x+8-h.x,pl.y+8-h.y)<38);
    if(h.cool<=0&&pl){h.cool=3;sfx.alarm();grSay(pl,'THE HELICOPTER SPOTTED YOU!|SWAT IS COMING',2.2);
      for(const c of cops)if(!(c.blind>0)&&Math.abs(c.tx-pl.ptx)+Math.abs(c.ty-pl.pty)<=24){c.state='chase';c.tgt=pl;c.lost=5;c.alert=1;c.goal=[pl.ptx,pl.pty];}}
  }
  // cops / guards / dogs / SWAT: each one goes after the nearest thief it can see
  for(const c of cops){
    c.cx=Math.round(c.x/T);c.cy=Math.round(c.y/T);c.alert-=dt;
    if(c.blind>0){c.blind-=dt;
      if(c.confused){c.spinT-=dt;if(c.spinT<=0){c.spinT=.45;const d=DIRS[rI(4)];c.dx=d[0];c.dy=d[1];}if(c.blind<=0){c.confused=false;if(c.noiseAt){c.state='investigate';c.inv=c.noiseAt;c.invT=5;}}}
      continue;}
    let seen=null,sd=99;
    for(const pl of G.pl){if(!vis(pl))continue;const d=Math.abs(c.cx-pl.ptx)+Math.abs(c.cy-pl.pty),r=c.dog?3:C.dark[pl.pty*CW+pl.ptx]?2:6;
      if(d<=r&&d<sd&&(c.dog||(!c.guard&&!c.cone)||facesTile(c,pl.ptx,pl.pty))&&los(c.cx,c.cy,pl.ptx,pl.pty)){seen=pl;sd=d;}}
    if(seen){if(c.state!=='chase'){c.alert=1.2;sfx.alarm();}c.state='chase';c.tgt=seen;c.lost=4;c.goal=[seen.ptx,seen.pty];}
    else if(c.state==='chase'){if(!c.tgt||c.tgt.hidden)c.lost=Math.min(c.lost,1.5);c.lost-=dt;if(c.lost<=0)c.state='patrol';}
    if(c.state==='investigate'){c.invT-=dt;if(c.invT<=0)c.state='patrol';}
    // city cops and SWAT shoot along straight lines
    if((!c.guard||c.swat||c.armed)&&!c.dog&&seen&&(c.cx===seen.ptx||c.cy===seen.pty)&&sd<=8&&sd>0){
      c.shootT-=dt;if(c.shootT<=0){c.shootT=c.swat?1.1:1.8;const vx=Math.sign(seen.ptx-c.cx),vy=Math.sign(seen.pty-c.cy);c.dx=vx;c.dy=vy;
        bullets.push({x:c.x+8+vx*6,y:c.y+8+vy*6,vx:vx*155,vy:vy*155,life:1.6});sfx.shoot();}
    }else c.shootT=Math.max(c.shootT,c.swat?.35:.8);
    const sp=c.dog?(c.state==='chase'?68:46):c.state==='chase'?62:c.state==='investigate'?50:38;
    if(c.moving)stepMover(c,sp,dt);
    if(!c.moving){
      let nx=null;
      if(c.state==='chase'&&c.goal){const g=walkC(...c.goal)?c.goal:(nearestWalk(...c.goal)||c.goal);nx=bfsStep(c.tx,c.ty,g[0],g[1]);
        if(!nx&&!seen)c.lost=Math.min(c.lost,.5);}
      else if(c.state==='investigate'){nx=bfsStep(c.tx,c.ty,c.inv[0],c.inv[1]);if(!nx)c.invT=Math.min(c.invT,1.5);}
      else nx=patrolNext(c);
      if(nx){c.dx=nx[0]-c.tx;c.dy=nx[1]-c.ty;c.ttx=nx[0];c.tty=nx[1];c.moving=true;}
    }
    for(const pl of G.pl)if(vis(pl)&&(seen===pl||(c.state==='chase'&&c.tgt===pl))&&Math.abs(c.x-pl.x)<10&&Math.abs(c.y-pl.y)<10)
      grCaught(pl,c.dog?'CAUGHT BY A GUARD DOG!':c.swat?'GRABBED BY SWAT!':c.guard?'CAUGHT BY A GUARD!':'TACKLED BY A COP!',c);
  }
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const pl of G.pl)if(vis(pl)&&b.x>pl.x+3&&b.x<pl.x+13&&b.y>pl.y+2&&b.y<pl.y+15){b.life=0;grCaught(pl,'SHOT BY POLICE!');}
    if(solidCity(ct(Math.floor(b.x/T),Math.floor(b.y/T))))b.life=0;}
  bullets=bullets.filter(b=>b.life>0);
  // cameras, searchlight towers and the lighthouse call guards over to whoever they spot
  for(const cm of C.cams||[]){
    cm.ang=cm.tower?cm.ph+cityTime*.55:cm.base+Math.sin(cityTime*.8+cm.ph)*1.05;cm.cool-=dt;if(cm.cool>0)continue;
    for(const pl of G.pl){
      const vx=pl.x+8-cm.x,vy=pl.y+8-cm.y,d=Math.hypot(vx,vy);let diff=Math.atan2(vy,vx)-cm.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
      if(d<cm.range&&Math.abs(diff)<cm.half&&vis(pl)&&!C.dark[pl.pty*CW+pl.ptx]&&(cm.noLos||los(cm.tx,cm.ty,pl.ptx,pl.pty))){
        cm.cool=4;sfx.alarm();grSay(pl,(cm.lighthouse?'THE LIGHTHOUSE':cm.tower?'A SEARCHLIGHT':'A CAMERA')+' SPOTTED YOU!|GUARDS ARE COMING',2.5);
        const g=nearestWalk(pl.ptx,pl.pty)||[pl.ptx,pl.pty];
        for(const c of cops)if(c.state!=='chase'&&!(c.blind>0)&&Math.abs(c.tx-pl.ptx)+Math.abs(c.ty-pl.pty)<=18){c.state='investigate';c.inv=g;c.invT=8;c.alert=1;}
        break;}
    }
  }
}

function helpKey(){
  if(state==='title'||!C)return 'title';
  if(state==='lock')return 'lock';if(state==='boat')return 'boat';
  if(state==='bank'&&sideMode)return 'side';
  if(state==='bank'&&B&&B.race)return 'race';
  if(state==='city'&&C&&C.race&&GRACE)return 'race_'+GRACE.kind;
  if(state==='lock'&&LK&&LK.race)return 'lockrace';
  if(state==='boat'&&BTS&&BTS.race)return 'boatrace';
  if(state==='bank')return B&&B.kind==='museum'?'museum':isGauntlet()?'gauntlet':'bank';
  if(isJail())return isIsland()?'island':'jail';
  return isGallery()?'gallery':isRoof()?'roof':'city';
}
