<script>
'use strict';
// ================= SETUP =================
const VW=320,VH=224,T=16,MAXL=3,MAXHP=MAXL*3; // hp counts thirds of a heart
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW;cv.height=VH;
const lc=document.createElement('canvas');lc.width=VW;lc.height=VH;const lx=lc.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){
  let s=Math.min(innerWidth/VW,innerHeight/VH);
  if(s>=2)s=Math.floor(s);
  wrap.style.width=cv.style.width=Math.floor(VW*s)+'px';
  wrap.style.height=cv.style.height=Math.floor(VH*s)+'px';
}
addEventListener('resize',fit);fit();

const FONT="'Press Start 2P', monospace";
const rI=n=>Math.floor(Math.random()*n);
const pick=a=>a[rI(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
function txt(s,x,y,col='#fff',al='left',sz=8){
  ctx.font=sz+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';
  ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

// ================= INPUT =================
const keys={},pressed={};let lastDir='down';
const KEYMAP={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',
  ArrowRight:'right',d:'right',D:'right',f:'flash',F:'flash',m:'map',M:'map',p:'pause',P:'pause',Escape:'pause',
  Enter:'start',' ':'fire',x:'fire',X:'fire',e:'use',E:'use',n:'music',N:'music',t:'tomato',T:'tomato',h:'help',H:'help',r:'scores',R:'scores'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.key];if(!k)return;e.preventDefault();initAudio();
  if(!keys[k])pressed[k]=true;keys[k]=true;
  if(k==='up'||k==='down'||k==='left'||k==='right')lastDir=k;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false;});
// raw key state by physical key, for the 2-player race (P1 = arrow keys, P2 = W A S D) and the 1/2 menu
const rawKeys={},rawPressed={};
addEventListener('keydown',e=>{if(!rawKeys[e.code])rawPressed[e.code]=true;rawKeys[e.code]=true;});
addEventListener('keyup',e=>{rawKeys[e.code]=false;});
addEventListener('blur',()=>{for(const k in rawKeys)rawKeys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// ================= AUDIO =================
let actx=null;
function initAudio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  else if(actx.state==='suspended')actx.resume();
}
function beep(f,d,type='square',vol=.05,slide=0,delay=0){
  if(!actx)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  coin:()=>{beep(988,.05);beep(1319,.09,'square',.05,0,.05);},
  big:()=>{beep(784,.06);beep(1047,.06,'square',.05,0,.06);beep(1568,.12,'square',.05,0,.12);},
  hurt:()=>beep(220,.35,'sawtooth',.08,-170),
  splat:()=>{beep(160,.12,'square',.06,-90);beep(90,.1,'sawtooth',.04,-40,.03);},
  toss:()=>beep(500,.08,'triangle',.05,250),
  shoot:()=>beep(900,.08,'square',.035,-700),
  zapGun:()=>beep(1800,.12,'sawtooth',.04,-1400),
  jump:()=>beep(330,.12,'square',.035,330),
  click:()=>beep(1200,.03,'square',.03),
  alarm:()=>{beep(880,.08,'square',.04);beep(660,.08,'square',.04,0,.09);},
  key:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.1,'square',.05,0,i*.08));},
  deny:()=>beep(140,.15,'square',.05),
  zap:()=>beep(1400,.3,'sawtooth',.06,-1200),
  buy:()=>{[659,880,1175].forEach((f,i)=>beep(f,.09,'square',.05,0,i*.07));},
  horn:()=>{beep(330,.15,'square',.05);beep(330,.2,'square',.05,0,.2);},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.16,'square',.05,0,i*.13));},
  cp:()=>{beep(660,.08);beep(990,.12,'square',.05,0,.08);}
};

// ================= MUSIC (generated chiptune, no audio files) =================
// Each track: 4 bars x 16 steps. Notes are names like A4 / C#5, '.' is a rest.
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,Bb:10,B:11};
const midi=n=>{const m=n.match(/^([A-G][#b]?)(\d)$/);return 12*(+m[2]+1)+NOTE[m[1]];};
const mf=m=>440*Math.pow(2,(m-69)/12);
const seq=str=>str.trim().split(/\s+/).map(t=>t==='.'?0:midi(t));
// bass line from chords: one chord per bar, eighth notes
const bassFrom=(chords,pat)=>chords.flatMap(ch=>{const r=midi(ch)-12,out=Array(16).fill(0);pat.forEach((o,i)=>{if(o!==null)out[i*2]=r+o;});return out;});
const ANDALUSIAN=['A3','G3','F3','E3'];
const cityLead=seq(`A4 . . C5 . . B4 . A4 . . . E4 . . .  G4 . . B4 . . A4 . G4 . . . D4 . . .
                    F4 . . A4 . . G4 . F4 . . . C5 . . .  E4 . G#4 . B4 . D5 . C5 . B4 . G#4 . . .`);
const TRACKS={
  city:{bpm:96,lead:cityLead,leadVol:.022,leadLen:.09,bassVol:.085,
    bass:bassFrom(ANDALUSIAN,[0,null,7,null,12,null,7,3]),
    kick:[0,8],hat:[2,6,10,14],snare:[]},
  title:{bpm:100,lead:cityLead,leadVol:.026,leadLen:.14,bassVol:.085,
    bass:bassFrom(ANDALUSIAN,[0,null,7,null,12,null,7,3]),
    kick:[0,8],hat:[2,6,10,14],snare:[4,12]},
  chase:{bpm:152,leadVol:.016,leadLen:.06,bassVol:.09,
    lead:ANDALUSIAN.flatMap(ch=>{const r=midi(ch)+12,t=r+(ch==='A3'?3:4),f=r+7;return [r,t,f,t+12,f,t,r+12,f,r,t,f,t+12,r+12,f,t,f];}),
    bass:bassFrom(ANDALUSIAN,[0,12,0,12,0,12,0,12]),
    kick:[0,4,8,12],hat:[2,6,10,14],snare:[4,12]},
  jail:{bpm:84,leadVol:.02,leadLen:.22,bassVol:.09,
    lead:seq(`E5 . . . . . . . D5 . . . . . . .  C5 . . . . . . . B4 . . . . . A4 .
              E5 . . . . . G5 . F5 . . . E5 . . .  D5 . . . C5 . . . B4 . . . . . . .`),
    bass:bassFrom(['A3','A3','F3','E3'],[0,null,null,7,0,null,12,null]),
    kick:[0,10],hat:[4,12],snare:[]},
  bank:{bpm:116,leadVol:.02,leadLen:.16,bassVol:.09,
    lead:seq(`D5 . . . A4 . . . C5 . D5 . . . . .  F5 . . . E5 . . . D5 . C5 . . . . .
              D5 . . . F5 . . . Bb4 . . . D5 . . .  C#5 . . . E5 . . . A4 . . . C#5 . E5 .`),
    bass:bassFrom(['D3','D3','Bb2','A2'],[0,0,12,0,0,0,12,0]),
    kick:[0,6,8],hat:[0,2,4,6,8,10,12,14],snare:[12]}
};
const music={on:true,master:null,noise:null,name:null,next:0,step:0};
try{music.on=localStorage.getItem('nh_music')!=='off';}catch(e){}
function musicSetup(){
  if(music.master||!actx)return;
  music.master=actx.createGain();music.master.gain.value=.8;music.master.connect(actx.destination);
  const b=actx.createBuffer(1,actx.sampleRate*.3,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;music.noise=b;
}
function tone(f,t,dur,type,vol,slide=0){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(music.master);o.start(t);o.stop(t+dur+.02);
}
function hit(t,dur,vol,hp){
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=music.noise;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(music.master);s.start(t);s.stop(t+dur+.02);
}
function wantTrack(){
  if(!music.on||paused)return null;
  if(state==='title')return 'title';
  if(state==='story'||state==='choose')return 'title';
  if(state==='lock')return null; // the lock plays its own metronome
  if(state==='boat')return 'chase';
  if(state==='city')return wanted()||isRoof()?'chase':isJail()?'jail':isGallery()?'bank':'city';
  if(state==='bank')return 'bank';
  return null;
}
function musicTick(){
  if(!actx)return;musicSetup();
  const name=wantTrack();
  if(name!==music.name){music.name=name;music.step=0;music.next=actx.currentTime+.06;}
  if(!name)return;
  const tr=TRACKS[name],sp=60/tr.bpm/4;
  if(music.next<actx.currentTime-.2)music.next=actx.currentTime+.05; // tab was in background
  while(music.next<actx.currentTime+.15){
    const t=music.next,i=music.step%64,b=i%16;
    if(tr.bass[i])tone(mf(tr.bass[i]),t,sp*1.8,'triangle',tr.bassVol);
    if(tr.lead[i])tone(mf(tr.lead[i]),t,tr.leadLen,'square',tr.leadVol);
    if(tr.kick.includes(b))tone(140,t,.12,'sine',.18,-100);
    if(tr.snare.includes(b))hit(t,.12,.06,1200);
    if(tr.hat.includes(b))hit(t,.03,.025,7000);
    music.next+=sp;music.step++;
  }
}
function toggleMusic(){
  music.on=!music.on;try{localStorage.setItem('nh_music',music.on?'on':'off');}catch(e){}
  say(music.on?'MUSIC ON':'MUSIC OFF',1.2);
}

// ================= GLOBAL STATE =================
let state='title',cash=0,cityCash=0,spent=0,hp=MAXHP,battery=600,flashOn=false,hasKey=false;
let showMap=false,paused=false,msg='',msgT=0,shake=0,hurtFlash=0,endT=0,trans=null,gameT=0;
let speedLvl=0,weapon=null,ammo=0,fireCD=0,shopOpen=false,shopSel=0,tomatoes=0,tomCD=0,armor=false,toms=[],splats=[];
let floaters=[];
const cam={x:0,y:0};
function say(t,d=2.6){msg=t;msgT=d;}
function floatTxt(x,y,s,col='#7dff7d'){floaters.push({x,y,s,col,t:1});}
function startTrans(cb){trans={t:0,cb,fired:false};}
function toEnd(s){state=s;endT=0;flashOn=false;shopOpen=false;sfx.win();}

// ================= CITY =================
// map size changes per night (big city vs smaller jail)
let NBX,NBY,CW,CH,WW,WH,BKX,BKY,BK0X,BK1X,BK0Y,BK1Y;
function setDims(nx,ny,tbx=nx-1,tby=ny-1){NBX=nx;NBY=ny;CW=nx*12+2;CH=ny*11+2;WW=CW*T;WH=CH*T;BKX=tbx;BKY=tby;BK0X=12*BKX+3;BK1X=12*BKX+10;BK0Y=11*BKY+3;BK1Y=11*BKY+9;}
setDims(9,7);
// ---------- the 5-night story loop ----------
// odd nights: city heist + bank.  even nights: jailbreak.  night 5 ends with the getaway.
const NIGHTS=5;
let soap=0,disguiseT=0,boostT=0,coconuts=0; // jail-only items from the Inmate Trader
let night=1,stolen=0,nightStolen=0,nightLog=[],story=null,storyT=0,best=0;
try{best=+localStorage.getItem('nh_best')||0;}catch(e){}
const nightLvl=()=>(night-1)>>1; // 0,0,1,1,2 -> difficulty
const isJail=()=>!!(C&&C.jail);
const isMuseum=()=>night===3;
const isGauntlet=()=>night===5; // night 5: rooftops + the hardest interior
const isRoof=()=>!!(C&&C.theme==='roof');
const isGallery=()=>!!(C&&C.theme==='gallery'); // night 3 top-down part: inside the museum, not the street
const isIsland=()=>night===4; // night 4: outdoor island prison instead of the jail
const keyName=()=>isIsland()?'BOAT KEY':'KEYCARD',bossName=()=>isIsland()?'HARBOR MASTER':'WARDEN'; // night 3: rainy city + museum instead of bank
const CONE_HALF=70*Math.PI/180,CONE=Math.cos(CONE_HALF),JAIL_SIGHT=6; // guards see as far as city cops, 140-degree view
// is tile (x,y) inside this guard's view cone?
function facesTile(c,x,y){const vx=x-c.cx,vy=y-c.cy,l=Math.hypot(vx,vy);return !l||(vx*c.dx+vy*c.dy)/l>CONE;}
function gain(v){cash+=v;stolen+=v;nightStolen+=v;}
// ===== per-night HIGH SCORES: fewest hearts lost wins (0 is perfect), then most money =====
let nightHurt=0,testMode=false; // nightHurt counts thirds of a heart
const NIGHT_NAMES={1:'THE BANK',2:'THE JAIL',3:'THE MUSEUM',4:'ISLAND PRISON',5:'THE GAUNTLET'};
function loseHP(n){hp-=n;nightHurt+=n;}
function fmtH(t){const w=Math.floor(t/3),r=t%3;return w||!r?(w+(r?' '+r+'/3':'')):r+'/3';}
const betterScore=(a,b)=>a.h<b.h||(a.h===b.h&&a.m>b.m);
function loadScores(){try{return JSON.parse(localStorage.getItem('nh_scores')||'{}')||{};}catch(e){return {};}}
function recordScore(){
  const sc={h:nightHurt,m:nightStolen},all=loadScores(),r=all[night]||{};
  const res={sc,newBest:false,newWorst:false};
  if(!testMode){
    if(!r.best||betterScore(sc,r.best)){r.best=sc;res.newBest=true;}
    if(!r.worst||betterScore(r.worst,sc)){r.worst=sc;res.newWorst=!res.newBest;}
    r.plays=(r.plays||0)+1;all[night]=r;try{localStorage.setItem('nh_scores',JSON.stringify(all));}catch(e){}
  }
  res.best=r.best;res.worst=r.worst;return res;
}
const TR=0,TS=1,TB=2,TA=3,TD=4,TK=5,TKD=6; // road, sidewalk, building, alley, door(hideout), bank, bank door
const DIRS=[[0,-1],[0,1],[-1,0],[1,0]];
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let C,P,cars,cops,bullets,bolts,picks,truck,lanes,cityTime=0,lockMsgT=0,lastSeenG=null,copsSee=false,keyPick=null,lostPiles=[];
const ct=(x,y)=>(x<0||y<0||x>=CW||y>=CH)?TB:C.g[y*CW+x];
const solidCity=t=>t===TB||t===TK||t===TD||t===TKD;
const walkP=(x,y)=>{const t=ct(x,y);return t===TR||t===TS||t===TA||t===TD||(t===TKD&&hasKey);};
const walkC=(x,y)=>{const t=ct(x,y);return t===TR||t===TS||t===TA;};
const wanted=()=>!!cops&&cops.some(c=>c.state==='chase');

function genCity(jail,nPieces=1){
  const g=new Uint8Array(CW*CH),dark=new Uint8Array(CW*CH),blk=new Int16Array(CW*CH).fill(-1);
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const mx=x%12,my=y%11,i=y*CW+x;
    if(mx<=1||my<=1)g[i]=TR;
    else if(mx===2||mx===11||my===2||my===10)g[i]=TS;
    else{g[i]=TB;blk[i]=Math.floor(x/12)+Math.floor(y/11)*NBX;}
  }
  for(let y=BK0Y;y<=BK1Y;y++)for(let x=BK0X;x<=BK1X;x++)g[y*CW+x]=TK;
  g[BK1Y*CW+BK0X+3]=TKD;g[BK1Y*CW+BK0X+4]=TKD;
  const isBank=(bx,by)=>bx===BKX&&by===BKY;
  // keycard goes in a block far from the start (top-left)
  const cand=[];
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++)if(!isBank(bx,by)&&bx+by>=(nPieces>1?4:NBX+NBY-6))cand.push([bx,by]);
  const kbs=[];
  if(!jail){const c2=cand.slice();while(kbs.length<nPieces&&c2.length){const b=c2.splice(rI(c2.length),1)[0];if(kbs.every(k=>Math.abs(k[0]-b[0])+Math.abs(k[1]-b[1])>=4)||c2.length===0)kbs.push(b);}}
  const alleys=[],keys=[];let key=null;
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    const isK=kbs.some(k=>k[0]===bx&&k[1]===by);
    if(!isK&&Math.random()>(jail?.35:.45))continue;
    const tiles=[];
    if(Math.random()<0.5){const ax=12*bx+5+rI(4);for(let y=11*by+3;y<=11*by+9;y++)tiles.push([ax,y]);}
    else{const ay=11*by+4+rI(4);for(let x=12*bx+3;x<=12*bx+10;x++)tiles.push([x,ay]);}
    for(const [x,y] of tiles){g[y*CW+x]=TA;dark[y*CW+x]=1;}
    alleys.push(tiles);
    if(isK)keys.push(tiles[Math.floor(tiles.length/2)]);
  }
  // hideout doors
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    let n=0,tries=0;
    while(n<(jail?4:2)&&tries<80){
      tries++;const s=rI(4);let x,y,ox=0,oy=0;
      if(s===0){x=12*bx+4+rI(6);y=11*by+3;oy=-1;}
      else if(s===1){x=12*bx+4+rI(6);y=11*by+9;oy=1;}
      else if(s===2){x=12*bx+3;y=11*by+4+rI(5);ox=-1;}
      else{x=12*bx+10;y=11*by+4+rI(5);ox=1;}
      if(g[y*CW+x]!==TB||g[(y+oy)*CW+x+ox]!==TS)continue;
      g[y*CW+x]=TD;n++;
    }
  }
  const lights=[];
  for(let i=0;i<=NBX;i++)for(let j=0;j<=NBY;j++){
    for(const [x,y] of [[12*i-1,11*j-1],[12*i+2,11*j-1],[12*i-1,11*j+2],[12*i+2,11*j+2]]){
      if(x<0||y<0||x>=CW||y>=CH||g[y*CW+x]!==TS)continue;
      if(Math.random()<(jail?.7:.45))lights.push({x:x*T+8,y:y*T+8});
    }
  }
  if(jail){g[3*CW+5]=TD;dark[3*CW+5]=0;} // your cell, top-left
  key=keys[0]||null;
  return {g,dark,blk,alleys,key,keys,lights,jail:!!jail,cell:jail?[5,3]:null};
}

const PAL_BLD=[['#6b2f2f','#4f2121'],['#2f4a6b','#223853'],['#5a4630','#43341f'],['#3d5a35','#2c4426'],['#56355e','#3f2546'],['#5e5e66','#45454c']];
function renderCity(){
  const c=document.createElement('canvas');c.width=WW;c.height=WH;const g=c.getContext('2d');
  const r=Math.random,pal={};
  const rain=C.theme==='rain',PAL_RAIN=[['#2f5a5e','#21454a'],['#5e6a72','#46525a'],['#3b4a5e','#2b384a'],['#6a6458','#504a40'],['#2f4a40','#223830']];
  for(let i=0;i<NBX*NBY;i++)pal[i]=pick(rain?PAL_RAIN:PAL_BLD);

function genGallery(){

    while(h<q.length){const c=q[h++],x=c%CW,y=(c/CW)|0;for(const [dx,dy] of DIRS){const n=(y+dy)*CW+x+dx;if(!seen[n]&&walk(g[n])){seen[n]=1;q.push(n);}}}

      const nb=DIRS.filter(([dx,dy])=>g[(y+dy)*CW+x+dx]===TS).length,wallLine=(g[i-1]===TB&&g[i+1]===TB)||(g[i-CW]===TB&&g[i+CW]===TB);
      if(nb===1&&wallLine&&Math.random()<.26)g[i]=TD;}
    for(const L of leaves){if(L===vault)continue;
      const edge=[];for(let xx=L.x;xx<=L.x+L.w;xx++)for(const yy of [L.y,L.y+L.h])edge.push([xx,yy]);for(let yy=L.y;yy<=L.y+L.h;yy++)for(const xx of [L.x,L.x+L.w])edge.push([xx,yy]);
      const have=edge.filter(([xx,yy])=>g[yy*CW+xx]===TD).length;if(have>=2)continue;
      const opts=edge.filter(([xx,yy])=>{const i=yy*CW+xx;if(xx<1||yy<1||xx>CW-2||yy>CH-2||g[i]!==TB)return false;

      const want=Math.max(2,Math.round((L.w+L.h)*2/8)); // about one per 8 tiles of wall

          if((g[i]===TR||g[i]===TA)&&DIRS.every(([dx,dy])=>{const v=g[i+dy*CW+dx];return v===TR||v===TS||v===TA;})){g[i]=TD;k++;}}}}

function genRoofs(){

const prevArr=new Int32Array(CW*CH);
function bfsStep(sx,sy,gx,gy){
  if(sx===gx&&sy===gy)return null;
  prevArr.fill(-1);const s=sy*CW+sx,goal=gy*CW+gx;prevArr[s]=s;const q=[s];let h=0;
  while(h<q.length){
    const cur=q[h++];if(cur===goal)break;
    const cx=cur%CW,cy=(cur/CW)|0;
    for(const [dx,dy] of DIRS){
      const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=CW||ny>=CH)continue;
      const n=ny*CW+nx;if(prevArr[n]!==-1||!walkC(nx,ny))continue;prevArr[n]=cur;q.push(n);
    }
  }
  if(prevArr[goal]===-1)return null;
  let cur=goal;while(prevArr[cur]!==s)cur=prevArr[cur];
  return [cur%CW,(cur/CW)|0];
}
function nearestWalk(x,y){
  for(let r=0;r<=3;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    if(walkC(x+dx,y+dy))return [x+dx,y+dy];
  }
  return null;
}
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy,x=x0,y=y0;
  while(!(x===x1&&y===y1)){
    const e2=2*err;if(e2>=dy){err+=dy;x+=sx;}if(e2<=dx){err+=dx;y+=sy;}
    if(x===x1&&y===y1)break;if(solidCity(ct(x,y)))return false;
  }
  return true;
}
function patrolStep(c){
  const opts=DIRS.filter(([dx,dy])=>walkC(c.tx+dx,c.ty+dy));if(!opts.length)return null;
  const fwd=opts.find(d=>d[0]===c.dx&&d[1]===c.dy);
  if(fwd&&Math.random()<.75)return [c.tx+fwd[0],c.ty+fwd[1]];
  const nr=opts.filter(d=>!(d[0]===-c.dx&&d[1]===-c.dy));
  const p=pick(nr.length?nr:opts);return [c.tx+p[0],c.ty+p[1]];
}
// where this cop heads: the closest cop goes straight for you, the others cut you off and flank
function chaseTarget(c,ptx,pty){

  const fx=P.dx,fy=P.dy;let ox,oy;
  if(c.role===1){ox=fx*6;oy=fy*6;}
  else if(c.role===2){ox=-fy*5+fx*2;oy=fx*5+fy*2;}
  else if(c.role===3){ox=fy*5+fx*2;oy=-fx*5+fy*2;}
  else{ox=-fx*5;oy=-fy*5;}
  return nearestWalk(lx0+ox,ly0+oy)||[lx0,ly0];
}
function stepMover(m,sp,dt){
  const tx=m.ttx*T,ty=m.tty*T,ddx=tx-m.x,ddy=ty-m.y,d=Math.abs(ddx)+Math.abs(ddy);
  m.anim+=dt;
  if(d<=sp*dt){m.x=tx;m.y=ty;m.tx=m.ttx;m.ty=m.tty;m.moving=false;return true;}
  m.x+=Math.sign(ddx)*sp*dt;m.y+=Math.sign(ddy)*sp*dt;return false;
}

function bust(why){
  const lost=cash,dx=P.x,dy=P.y;
  if(lost>0)lostPiles.push({x:dx,y:dy,val:lost,ph:Math.random()*6});
  cash=0;
  if(isJail()){
    // guards drag you back to your cell and hand the keycard back to the warden
    let keyBack=false;
    if(hasKey&&!isIsland()){hasKey=false;keyBack=true;const w=cops.find(c=>c.warden);if(w)w.hasKeyCard=true;}
    const [cx0,cy0]=C.cell;
    Object.assign(P,{tx:cx0,ty:cy0,ttx:cx0,tty:cy0,x:cx0*T,y:cy0*T,moving:false,inv:2.5,hidden:true});
    for(const c of cops){c.state='patrol';c.lost=0;c.alert=0;}
    lastSeenG=null;hurtFlash=.8;
    say(why+' BACK TO YOUR CELL!|'+(keyBack?'THE WARDEN HAS THE KEYCARD AGAIN':lost>0?'YOU DROPPED $'+lost+'. GO FIND IT!':'TRY AGAIN, QUIETER.'),4.5);
    return;
  }
  const avoid=[[dx/T,dy/T],C.door||[BK0X+3,BK1Y]];
  if(!hasKey&&C.key)avoid.push(...(C.keys||[C.key]));
  for(const p of lostPiles)avoid.push([p.x/T,p.y/T]);
  let best=null,bestS=-1;
  for(let i=0;i<800;i++){
    const x=rI(CW),y=rI(CH);if(C.g[y*CW+x]!==TS)continue;
    let s=Infinity;for(const [ax,ay] of avoid)s=Math.min(s,Math.abs(x-ax)+Math.abs(y-ay));
    for(const c of cops)s=Math.min(s,(Math.abs(x-c.tx)+Math.abs(y-c.ty))*3);
    if(s>bestS){bestS=s;best=[x,y];}
  }
  Object.assign(P,{tx:best[0],ty:best[1],ttx:best[0],tty:best[1],x:best[0]*T,y:best[1]*T,moving:false,inv:2.5,hidden:false});
  for(const c of cops){c.state='patrol';c.lost=0;c.alert=0;}
  lastSeenG=null;bullets=[];bolts=[];hurtFlash=.8;
  say(why+(lost>0?'|YOU DROPPED $'+lost+'. GO FIND IT!':'|YOU WAKE UP ACROSS TOWN'),4.5);
}

// Rings spin around the lock. Each ring has one gap. Jump [UP] when the next ring's gap
// is at the top. Every gap passes the top exactly on a metronome tick: keep the rhythm.
let LK=null;
const LOCK_BEAT=.5,LOCK_CX=160,LOCK_CY=126; // low enough that the thief on top is never under the HUD
function startLock(){
  state='lock';flashOn=false;
  // 6 rings. one is fast (once a second), one lands OFF the beat (between ticks),
  // two have a red fake gap. every real window is about 1/6 of a second.
  const beats=[4,3,5,2,3,4],first=[3,4,5.5,6,7,8],fake=[false,true,false,false,true,false];
  LK={t:0,layer:0,n:6,rings:[],jumpT:0,lastBeat:-1,openT:0,shake:0,from:0,alarm:45};
  for(let i=0;i<LK.n;i++){const per=beats[i]*LOCK_BEAT;
    LK.rings.push({period:per,dir:i%2?-1:1,first:first[i]*LOCK_BEAT,gap:Math.max(.16,.09*2*Math.PI/per),fake:fake[i],dinged:-1});}
  say('THE GIANT LOCK! JUMP [UP] WHEN|THE GAP IS ON TOP. 45 SECONDS!',4);showHelp();
}
const lockR=i=>88-i*13;
function lockGap(r){return -Math.PI/2+r.dir*2*Math.PI*(LK.t-r.first)/r.period;}
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function updLock(dt){
  LK.t+=dt;LK.jumpT-=dt;LK.shake-=dt;msgT-=dt;hurtFlash-=dt;
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(LK.openT>0){LK.openT-=dt;if(LK.openT<=0){LK=null;escapeJail();}return;}
  LK.alarm-=dt;
  if(LK.alarm<=0){LK.alarm=45;LK.layer=0;sfx.alarm();LK.shake=.4;say('TIME UP! THE GUARDS RESET|THE LOCK. START AGAIN',3);}
  const b=Math.floor(LK.t/LOCK_BEAT);
  if(b!==LK.lastBeat){LK.lastBeat=b;beep(b%4===0?1100:800,.04,'square',b%4===0?.05:.03);}
  // a soft 'ding' when the gap you need is dead center on top
  const r=LK.rings[LK.layer];
  if(r){const cyc=Math.round((LK.t-r.first)/r.period);if(cyc!==r.dinged&&Math.abs(angDiff(lockGap(r),-Math.PI/2))<.06){r.dinged=cyc;beep(1568,.08,'triangle',.05);}}
  if((pressed.up||pressed.fire)&&LK.jumpT<=0&&r){
    LK.jumpT=.22;LK.from=LK.layer;
    if(Math.abs(angDiff(lockGap(r),-Math.PI/2))<r.gap){
      LK.layer++;sfx.jump();floatTxt(LOCK_CX,LOCK_CY-lockR(LK.layer-1)-4,'CLICK!','#7dff7d');
      if(LK.layer>=LK.n){LK.openT=1.6;sfx.win();say('THE LOCK OPENS!',2);}
    }else{
      loseHP(armor?1:3);sfx.hurt();LK.shake=.3;hurtFlash=.35;
      if(hp<=0){hp=MAXHP;LK.layer=0;say('OUT OF HEARTS! START AGAIN|FROM THE OUTSIDE',3);}
      else{LK.layer=Math.max(0,LK.layer-2);say('CLANG! BACK 2 RINGS|'+(armor?'-1/3 HEART':'-1 HEART'),1.8);}
    }
  }
}
function drawLock(){
  const sx=LK.shake>0?rI(5)-2:0,cx=LOCK_CX+sx,cy=LOCK_CY;
  ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2;ctx.fillStyle='#1a1d24';ctx.fillRect(cx+Math.cos(a)*100-3,cy+Math.sin(a)*100-3,6,6);}
  ctx.strokeStyle='#2a2e36';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,97,0,7);ctx.stroke();
  // the drop line from the top to the keyhole
  ctx.fillStyle='rgba(120,255,160,.12)';ctx.fillRect(cx-6,cy-94,12,94);
  LK.rings.forEach((r,i)=>{
    const a=lockGap(r),R=lockR(i),open=i<LK.layer,next=i===LK.layer;
    ctx.strokeStyle=open?'#3a4a3a':i%2?'#7a8290':'#9aa3b0';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(cx,cy,R,a+r.gap,a+Math.PI*2-r.gap);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R-3,a+r.gap,a+Math.PI*2-r.gap);ctx.stroke();
    for(let k=0;k<10;k++){const ta=a+r.gap+(k+.5)*(Math.PI*2-2*r.gap)/10;ctx.fillStyle='#4a505a';ctx.fillRect(cx+Math.cos(ta)*R-1,cy+Math.sin(ta)*R-1,2,2);}
    if(r.fake&&!open){ // red electrified fake gap on the opposite side (it's solid: jumping there = CLANG)
      const fa=a+Math.PI;ctx.strokeStyle=Math.floor(gameT*10)%2?'#ff3030':'#801010';ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(cx,cy,R,fa-.2,fa+.2);ctx.stroke();
    }
    if(next){ // marks which gap you need (no hint about WHEN)
      ctx.strokeStyle='rgba(255,220,120,.5)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,R+5,a-r.gap,a+r.gap);ctx.stroke();
    }
  });
  // keyhole core
  const opened=LK.layer>=LK.n;
  ctx.fillStyle=opened?'#7dff7d':'#d4a017';ctx.beginPath();ctx.arc(cx,cy,14,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy-3,4,0,7);ctx.fill();ctx.fillRect(cx-2,cy-2,4,9);
  if(opened){ctx.globalCompositeOperation='lighter';glow(cx,cy,60,'120,255,160',.5);ctx.globalCompositeOperation='source-over';}
  // the thief, standing at the top just outside the next ring (hops inward on a jump)
  const rOut=k=>k>=LK.n?0:lockR(k)+(k===0?10:6);
  const f=Math.max(0,LK.jumpT)/.22,rr=rOut(LK.layer)*(1-f)+rOut(LK.from)*f,hop=Math.sin(f*Math.PI)*6;
  const tx=cx-4,ty=cy-rr-10-hop;
  ctx.fillStyle='#151515';ctx.fillRect(tx+1,ty,6,2);ctx.fillStyle='#e0ac69';ctx.fillRect(tx+2,ty+2,4,3);ctx.fillStyle='#151515';ctx.fillRect(tx+2,ty+3,4,1);
  ctx.fillStyle=armor?'#8a8f99':'#ff7a1a';ctx.fillRect(tx+1,ty+5,6,4);ctx.fillStyle='#1d1d2b';ctx.fillRect(tx+2,ty+9,1,2);ctx.fillRect(tx+5,ty+9,1,2);
  if(LK.t<4&&Math.floor(gameT*4)%2)txt('YOU',cx+10,ty+1,'#ffd400');
  // beat light
  const ph=(LK.t%LOCK_BEAT)/LOCK_BEAT;ctx.fillStyle=`rgba(255,220,120,${1-ph})`;ctx.fillRect(12,VH-20,8,8);txt('BEAT',24,VH-20,'#889');
  txt('LAYER '+Math.min(LK.layer+1,LK.n)+'/'+LK.n,VW-12,VH-20,'#9fd3ff','right');
  if(LK.openT<=0)txt('ALARM '+Math.ceil(LK.alarm),VW-12,VH-32,LK.alarm<10&&Math.floor(gameT*4)%2?'#f33':'#ffb000','right');
  drawFloaters(0,0);
}

// Steer to the mainland. Rocks and police patrol boats with searchlights are in the way.
let BTS=null;
function startBoat(){
  state='boat';flashOn=false;
  const len=3400,rocks=[],pats=[],logs=[],sharks=[],pools=[],bottles=[],fuel=[];
  for(let d=300;d<len-160;d+=90+rI(70))rocks.push({d,x:24+rI(272),r:7+rI(7)});
  for(let d=600;d<len-250;d+=420+rI(180))pats.push({d,x:40+rI(240),vx:(Math.random()<.5?-1:1)*(30+rI(25)),ph:Math.random()*6});
  for(let d=450;d<len-200;d+=300+rI(200))logs.push({d,x:40+rI(240),vx:(Math.random()<.5?-1:1)*(25+rI(20)),w:34+rI(14)});
  for(let d=800;d<len-300;d+=500+rI(250))sharks.push({d,x:30+rI(260),ph:Math.random()*6});
  for(let d=700;d<len-300;d+=550+rI(250))pools.push({d,x:50+rI(220),r:26+rI(8)});
  for(let d=200;d<len-120;d+=120+rI(110))bottles.push({d,x:24+rI(272),crab:Math.random()<.35,got:false,ph:Math.random()*6});
  for(let d=900;d<len-300;d+=650+rI(300))fuel.push({d,x:30+rI(260),got:false});
  BTS={d:0,x:160,len,rocks,pats,logs,sharks,pools,bottles,fuel,inv:0,t:0,turbo:0,match:null};
  say('ESCAPE BY BOAT! STEER WITH|LEFT/RIGHT. UP = FASTER',4);showHelp();
}
const BOAT_Y=VH-46;
// ---- crash into a rock: "PATCH THE HULL!" memory game. match all pairs before time runs out ----
const CARD_ICONS=['anchor','fish','star','shell','wheel','crab'];
function startMatch(){
  const icons=CARD_ICONS.slice().sort(()=>Math.random()-.5).slice(0,4),cards=[...icons,...icons].sort(()=>Math.random()-.5).map(ic=>({ic,up:false,done:false}));
  BTS.match={cards,cur:0,open:[],wait:0,time:16,result:null,resT:0};sfx.hurt();shake=.4;
}
function updMatch(dt){
  const m=BTS.match;
  if(m.result){m.resT-=dt;if(m.resT<=0){BTS.match=null;BTS.inv=1.5;}return;}
  m.time-=dt;
  if(m.time<=0){m.result='fail';m.resT=1.4;loseHP(armor?1:3);sfx.hurt();hurtFlash=.4;
    if(hp<=0){hp=MAXHP;say('OUT OF HEARTS! BACK TO THE DOCK',3);startBoat();helpOpen=false;return;}
    say('TOO SLOW! THE BOAT LEAKS|'+(armor?'-1/3 HEART':'-1 HEART'),2);return;}
  if(pressed.left)m.cur=(m.cur+7)%8;if(pressed.right)m.cur=(m.cur+1)%8;if(pressed.up||pressed.down)m.cur=(m.cur+4)%8;
  if(m.wait>0){m.wait-=dt;if(m.wait<=0){for(const i of m.open)m.cards[i].up=false;m.open=[];}return;}
  if(pressed.fire||pressed.start)flipCard(m.cur);
}
function flipCard(i){
  const m=BTS&&BTS.match;if(!m||m.result||m.wait>0)return;
  if(!m.cards[i].up&&!m.cards[i].done){m.cur=i;
    m.cards[i].up=true;m.open.push(i);sfx.click();
    if(m.open.length===2){const [a,b]=m.open;
      if(m.cards[a].ic===m.cards[b].ic){m.cards[a].done=m.cards[b].done=true;m.open=[];sfx.coin();
        if(m.cards.every(c=>c.done)){m.result='win';m.resT=1.2;sfx.big();say('HULL PATCHED! NO DAMAGE',1.6);}}
      else m.wait=.6;}
  }
}
// mouse: click a card to flip it, hover to highlight it
function cardAt(e){
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*VW/r.width,y=(e.clientY-r.top)*VH/r.height;
  for(let i=0;i<8;i++){const cx=70+(i%4)*48,cy=82+Math.floor(i/4)*52;if(x>=cx-2&&x<cx+34&&y>=cy-2&&y<cy+44)return i;}
  return -1;
}
cv.addEventListener('mousedown',e=>{if(state==='boat'&&BTS&&BTS.match&&!paused){const i=cardAt(e);if(i>=0){initAudio();flipCard(i);}}});
cv.addEventListener('mousemove',e=>{if(state==='boat'&&BTS&&BTS.match){const i=cardAt(e);if(i>=0&&!BTS.match.result)BTS.match.cur=i;cv.style.cursor=i>=0?'pointer':'default';}else cv.style.cursor='default';});
function drawCardIcon(ic,x,y){

  if(ic==='anchor'){R(9,3,2,14,'#c0c5cf');R(6,5,8,2,'#c0c5cf');R(4,15,12,2,'#c0c5cf');R(4,12,2,4,'#c0c5cf');R(14,12,2,4,'#c0c5cf');R(8,1,4,3,'#c0c5cf');}
  else if(ic==='fish'){R(4,8,10,6,'#ff9a3c');R(14,6,4,10,'#ff9a3c');R(6,9,2,2,'#000');R(3,9,2,4,'#ffb070');}
  else if(ic==='star'){R(9,3,2,14,'#ffd400');R(3,9,14,2,'#ffd400');R(6,6,8,8,'#ffd400');R(8,8,4,4,'#fff6a0');}
  else if(ic==='shell'){R(5,6,10,9,'#f0c8c0');R(7,4,6,2,'#f0c8c0');R(7,7,1,8,'#c89890');R(10,6,1,9,'#c89890');R(13,7,1,8,'#c89890');R(8,15,4,2,'#c89890');}
  else if(ic==='wheel'){ctx.strokeStyle='#8a5a30';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+10,y+10,6,0,7);ctx.stroke();R(9,2,2,16,'#8a5a30');R(2,9,16,2,'#8a5a30');R(8,8,4,4,'#d4a017');}
  else{R(5,9,10,6,'#d8402a');R(6,8,8,1,'#f06040');R(6,6,1,3,'#000');R(13,6,1,3,'#000');R(2,8,3,3,'#d8402a');R(15,8,3,3,'#d8402a');R(4,15,2,2,'#a02010');R(14,15,2,2,'#a02010');}
}
function drawMatch(){
  const m=BTS.match;
  ctx.fillStyle='rgba(0,10,25,.85)';ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#14283e';ctx.fillRect(40,30,240,170);ctx.fillStyle='#ffb000';ctx.fillRect(40,30,240,2);ctx.fillRect(40,198,240,2);

  });
  txt(m.result==='win'?'PATCHED!':m.result==='fail'?'LEAKING...':'CLICK OR SPACE   '+t+'s',VW/2,188,m.result==='fail'?'#f33':m.result==='win'?'#7dff7d':'#ccd','center');
}
function updBoat(dt){
  const b=BTS;msgT-=dt;hurtFlash-=dt;shake-=dt;
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(b.match){updMatch(dt);return;}
  b.t+=dt;b.inv-=dt;b.turbo-=dt;
  let sp=(keys.up?125:keys.down?45:80)+(b.turbo>0?70:0),steer=(keys.right?1:0)-(keys.left?1:0);
  const sy=o=>BOAT_Y-(o.d-b.d);
  // whirlpools drag you toward the middle and slow you down
  for(const w of b.pools){const dy=sy(w)-BOAT_Y,dx=w.x-b.x,dist=Math.hypot(dx,dy);
    if(dist<w.r*2.2){b.x+=Math.sign(dx)*55*dt*(1-dist/(w.r*2.2))*1.6;sp*=.6;if(dist<w.r*.6&&!b.spun){b.spun=1;say('WHIRLPOOL! STEER OUT!',1.2);}}else if(dist>w.r*3)b.spun=0;}
  b.d+=sp*dt;b.x=clamp(b.x+steer*130*dt,14,VW-14);
  const hit=why=>{if(b.inv>0)return;loseHP(armor?1:3);b.inv=1.5;sfx.hurt();shake=.3;hurtFlash=.4;
    if(hp<=0){hp=MAXHP;say('OUT OF HEARTS! BACK TO THE DOCK',3);startBoat();helpOpen=false;return;}else say(why+(armor?' -1/3 HEART':' -1 HEART'),1.8);};
  for(const r of b.rocks){if(r.hit)continue;const y=sy(r);if(b.inv<=0&&Math.abs(y-BOAT_Y)<r.r+6&&Math.abs(r.x-b.x)<r.r+5){r.hit=true;startMatch();return;}}
  for(const l of b.logs){l.x+=l.vx*dt;if(l.x<l.w/2||l.x>VW-l.w/2)l.vx*=-1;const y=sy(l);if(Math.abs(y-BOAT_Y)<8&&Math.abs(l.x-b.x)<l.w/2+5)hit('CRASHED INTO A LOG!');}
  for(const k of b.sharks){const y=sy(k);if(y>-60&&y<VH)k.x+=Math.sign(b.x-k.x)*38*dt+Math.sin(b.t*3+k.ph)*20*dt;k.d+=40*dt; // sharks swim after you
    if(Math.abs(sy(k)-BOAT_Y)<10&&Math.abs(k.x-b.x)<11)hit('A SHARK BIT THE BOAT!');}
  for(const bt of b.bottles){if(bt.got)continue;const y=sy(bt);if(Math.abs(y-BOAT_Y)<12&&Math.abs(bt.x-b.x)<11){bt.got=true;
    if(bt.crab){floatTxt(b.x,BOAT_Y-14,'CRAB!','#f55');beep(300,.1,'square',.05,-150);hit('A CRAB JUMPED OUT AND BIT YOU!');}
    else{const v=100+rI(5)*50;gain(v);sfx.coin();floatTxt(b.x,BOAT_Y-14,'+$'+v,'#7dff7d');}}}
  for(const fu of b.fuel){if(fu.got)continue;const y=sy(fu);if(Math.abs(y-BOAT_Y)<12&&Math.abs(fu.x-b.x)<11){fu.got=true;b.turbo=3;sfx.big();floatTxt(b.x,BOAT_Y-14,'TURBO!','#ffb000');}}

  }

}

    else{c.y+=c.d*sp*dt;if(c.y>WH+4)c.y=-c.h-4;if(c.y<-c.h-4)c.y=WH+4;}
    if(!c.truck&&!P.hidden&&P.x+4<c.x+c.w-1&&P.x+12>c.x+1&&P.y+3<c.y+c.h-1&&P.y+14>c.y+1)
      hurtCity(c.jeep?'HIT BY A PATROL JEEP!':c.laundry?'RUN OVER BY A LAUNDRY CART!':c.cart?'HIT BY A SECURITY CART!':c.cop?'HIT BY A COP CAR!':'RUN OVER BY A CAR!',c.cop,!!c.cart);
  }

      h.x+=h.vx*dt;h.y+=h.vy*dt;h.cool-=dt;if(h.x<60||h.x>WW-60)h.vx*=-1;if(h.y<60||h.y>WH-60)h.vy*=-1;

      }

    const bx=C.boxes.find(b=>!b.cut&&Math.abs(b.x-ptx)+Math.abs(b.y-pty)===1);

      if(C.cutT===0)say('CUTTING THE POWER... STAY 3 SEC!',2);

      b.x=Math.round(b.x/T)*T;b.y=Math.round(b.y/T)*T;const opts=DIRS.filter(([dx,dy])=>walkC(Math.round(b.x/T)+dx,Math.round(b.y/T)+dy));

  // --- cops: perception + radio
  const pdark=C.dark[pty*CW+ptx];
  const lvl=nightLvl(),jail=isJail();
  const sightR=flashOn?11:pdark?2:(C.mounds&&C.digT>0)?3:6; // crouched down digging = hard to spot
  copsSee=false;
  for(const c of cops){

    const looking=c.dog||!c.guard||facesTile(c,ptx,pty),fooled=c.guard&&disguiseT>0;
    c.sees=!(c.blind>0)&&!P.hidden&&looking&&!fooled&&c.dist<=(c.dog?3:sightR)&&los(c.cx,c.cy,ptx,pty);
    c.fresh=false;
    if(c.sees)copsSee=true;
  }
  // the flashlight beam attracts cops from far away, even around corners
  for(const c of cops){
    if(c.state==='investigate'){c.invT-=dt;if(c.invT<=0)c.state='patrol';}
    if(flashOn&&!P.hidden&&c.state!=='chase'&&!(c.blind>0)&&c.dist<=18){
      if(c.state!=='investigate')c.alert=0;
      c.state='investigate';c.inv=pGoal;c.invT=6;
    }
  }
  if(copsSee){
    lastSeenG=pGoal;
    // spotter radios nearby units; at most 5 cops chase at once
    const team=cops.filter(c=>c.sees||c.state==='chase'||c.dist<=14).sort((a,b)=>a.dist-b.dist).slice(0,5);
    let newAlarm=false;
    for(const c of team){if(c.state!=='chase'){c.alert=1.2;newAlarm=true;}c.state='chase';c.lost=4;c.fresh=true;}
    if(newAlarm)sfx.alarm();
  }
  for(const c of cops)if(c.state==='chase'&&!c.fresh){
    if(P.hidden)c.lost=Math.min(c.lost,2);
    c.lost-=dt;if(c.lost<=0)c.state='patrol';
  }
  cops.filter(c=>c.state==='chase').sort((a,b)=>a.dist-b.dist).forEach((c,i)=>c.role=i);
  for(const c of cops){
    c.alert-=dt;
    if(c.blind>0){c.blind-=dt;c.shootT=Math.max(c.shootT,.8);
      if(c.confused){c.spinT-=dt;if(c.spinT<=0){c.spinT=.45;const d=DIRS[rI(4)];c.dx=d[0];c.dy=d[1];}
        if(c.blind<=0){c.confused=false;if(c.noiseAt){c.state='investigate';c.inv=c.noiseAt;c.invT=5;}}}
      continue;}
    if((!c.guard||c.swat)&&!c.dog&&c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist<=8&&c.dist>0){
      c.shootT-=dt;
      if(c.shootT<=0){
        c.shootT=c.swat?1.1:1.8-.2*lvl;const vx=Math.sign(ptx-c.cx),vy=Math.sign(pty-c.cy);c.dx=vx;c.dy=vy;
        bullets.push({x:c.x+8+vx*6,y:c.y+8+vy*6,vx:vx*155,vy:vy*155,life:1.6});sfx.shoot();
      }
    }else c.shootT=Math.max(c.shootT,c.swat?.35:.8); // SWAT aim fast
    const sp=(c.dog?(c.state==='chase'?68:46):c.state==='chase'?58+4*lvl:c.state==='investigate'?50:38); // guards walk at normal speed to check the digging noise
    // SWAT with a clear shot hold position and fire instead of charging
    const holding=c.swat&&c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist>1&&c.dist<=6;
    if(c.moving)stepMover(c,sp,dt);
    if(!c.moving&&!holding){
      let nx=null;
      if(c.state==='chase'&&lastSeenG){
        const tg=chaseTarget(c,ptx,pty);
        nx=bfsStep(c.tx,c.ty,tg[0],tg[1])||bfsStep(c.tx,c.ty,lastSeenG[0],lastSeenG[1]);
      }else if(c.state==='investigate'){
        nx=bfsStep(c.tx,c.ty,c.inv[0],c.inv[1]);
        if(!nx)c.invT=Math.min(c.invT,1.5); // reached the light: look around, then give up
      }else if(c.state!=='chase')nx=patrolStep(c);
      if(nx){c.dx=nx[0]-c.tx;c.dy=nx[1]-c.ty;c.ttx=nx[0];c.tty=nx[1];c.moving=true;}
    }
    // pickpocket: any guard who isn't FACING you can be robbed from the next tile
    if(c.guard&&!P.hidden&&!facesTile(c,ptx,pty)&&(c.wallet>0||c.hasKeyCard)&&Math.abs(c.x-P.x)<18&&Math.abs(c.y-P.y)<18){
      if(c.wallet>0){gain(c.wallet);floatTxt(c.x+8,c.y-4,'+$'+c.wallet);c.wallet=0;sfx.coin();}
      if(c.hasKeyCard){c.hasKeyCard=false;hasKey=true;sfx.key();floatTxt(c.x+8,c.y-14,keyName(),'#5ff');say(isIsland()?'YOU LIFTED THE BOAT KEY!|NOW SNEAK TO THE DOCK':"YOU LIFTED THE WARDEN'S KEYCARD!|NOW SNEAK TO THE EXIT GATE",4);}
    }
    const reach=P.inDoor?18:10,aware=!c.guard||c.sees||(c.state==='chase'&&disguiseT<=0);
    if(aware&&!P.hidden&&!(c.blind>0)&&Math.abs(c.x-P.x)<reach&&Math.abs(c.y-P.y)<reach)
      {const h0=hp;hurtCity(c.dog?'CAUGHT BY A GUARD DOG!':c.guard?'CAUGHT BY A GUARD!':'TACKLED BY A COP!');
       if(hp<h0){c.blind=1.5;c.slip=true;c.confused=false;c.state='patrol';floatTxt(P.x+8,P.y-8,'WRIGGLED FREE!','#ffb000');}}
  }
  // --- cop bullets
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    const btx=Math.floor(b.x/T),bty=Math.floor(b.y/T);
    const inMyDoor=P.inDoor&&btx===ptx&&bty===pty; // a lit doorway doesn't stop bullets
    if(!P.hidden&&(inMyDoor||(b.x>P.x+3&&b.x<P.x+13&&b.y>P.y+2&&b.y<P.y+15))){b.life=0;hurtCity('SHOT BY POLICE!');continue;}
    if(solidCity(ct(btx,bty)))b.life=0;
  }
  bullets=bullets.filter(b=>b.life>0);
  // --- player stun bolts
  for(const b of bolts){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(solidCity(ct(Math.floor(b.x/T),Math.floor(b.y/T))))b.life=0;
    if(b.life<=0)continue;
    for(const c of cops)if(Math.abs(c.x+8-b.x)<9&&Math.abs(c.y+8-b.y)<9){zapCop(c);b.life=0;break;}
  }
  bolts=bolts.filter(b=>b.life>0);
  for(const t of toms){
    t.x+=t.vx*dt;t.y+=t.vy*dt;t.life-=dt;
    if(t.coco){ // coconut: flies, BONKs a guard it hits, and the THUD where it lands draws guards over
      const wall=solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)));
      for(const c of cops)if(!t.hit.has(c)&&!c.dog&&Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){t.hit.add(c);c.blind=2.5;c.slip=true;c.state='patrol';floatTxt(c.x+8,c.y-4,'BONK!','#ffb000');beep(180,.15,'square',.06,-80);t.life=0;}
      if(wall||t.life<=0){if(wall){t.x-=t.vx*dt;t.y-=t.vy*dt;}t.life=0;beep(90,.18,'triangle',.08,-30);floatTxt(t.x,t.y-6,'THUD','#c8a070');
        const tx0=Math.round(t.x/T),ty0=Math.round(t.y/T),spot=nearestWalk(tx0,ty0);let n=0;
        for(const c of cops)if(c.guard&&!(c.blind>0)&&Math.abs(c.tx-tx0)+Math.abs(c.ty-ty0)<=10){
          c.blind=3;c.confused=true;c.slip=false;c.state='patrol';c.alert=0;c.noiseAt=spot;c.spinT=0;n++;}
        if(n)say('THUD! '+n+(n>1?' GUARDS ARE':' GUARD IS')+' CONFUSED!',1.8);
        for(const gl of C.gulls||[])if(gl.state==='sit'&&Math.hypot(gl.x-t.x,gl.y-t.y)<40)spookGulls(gl);}
      continue;
    }
    if(solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)))){t.life=0;if(!t.soap)splats.push({x:t.x-t.vx*dt,y:t.y-t.vy*dt,t:1.5});sfx.splat();}
    if(t.life<=0)continue;
    for(const c of cops)if(!t.hit.has(c)&&Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){
      t.hit.add(c);c.blind=t.soap?3:2;c.slip=!!t.soap;c.alert=0;c.state='patrol';sfx.splat();
      floatTxt(c.x+8,c.y-4,t.soap?'SLIP!':'SPLAT!',t.soap?'#cff':'#f55');
    }
  }
  toms=toms.filter(t=>t.life>0);
  if(C.cams)for(const cm of C.cams){
    if(cm.tower&&C.mounds&&C.digT>0)cm.ph+=dt*.15; // towers sweep a little faster while you dig
    cm.ang=cm.tower?cm.ph+cityTime*.55:cm.base+Math.sin(cityTime*.8+cm.ph)*1.05;cm.cool-=dt;
    const vx=P.x+8-cm.x,vy=P.y+8-cm.y,d=Math.hypot(vx,vy);
    let diff=Math.atan2(vy,vx)-cm.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const dark=pdark&&!flashOn;
    if(cm.cool<=0&&d<cm.range&&Math.abs(diff)<cm.half&&!P.hidden&&disguiseT<=0&&!dark&&(cm.noLos||los(cm.tx,cm.ty,ptx,pty))){
      cm.cool=4;sfx.alarm();say(cm.lighthouse?'THE LIGHTHOUSE BEAM FOUND YOU!|GUARDS ARE ON THEIR WAY':cm.tower?'A SEARCHLIGHT SPOTTED YOU!|GUARDS ARE ON THEIR WAY':'A CAMERA SPOTTED YOU!|GUARDS ARE ON THEIR WAY',2.5);
      for(const c of cops)if(c.state!=='chase'&&!(c.blind>0)&&c.dist<=18){c.state='investigate';c.inv=pGoal;c.invT=8;c.alert=1;}
    }
  }
  for(const sp of splats)sp.t-=dt;splats=splats.filter(sp=>sp.t>0);
  cam.x=clamp(P.x+8-VW/2,0,WW-VW);cam.y=clamp(P.y+8-(VH+12)/2,-12,WH-VH);
}

function updShop(){
  const L=shopList();
  if(pressed.up)shopSel=(shopSel+L.length-1)%L.length,sfx.click();
  if(pressed.down)shopSel=(shopSel+1)%L.length,sfx.click();
  if(pressed.pause||pressed.use){closeShop();return;}
  if(pressed.start||pressed.fire){
    const it=L[shopSel];
    if(it.name==='LEAVE'){closeShop();return;}
    const cost=it.cost();
    if(cost===null){sfx.deny();return;}
    if(cash<cost){sfx.deny();say('NOT ENOUGH CASH! NEED $'+cost,1.6);return;}
    cash-=cost;spent+=cost;const m=it.buy();sfx.buy();
    closeShop();
    if(C.trader){moveTrader(18);say(m+(isJail()?'|THE TRADER SNEAKS TO ANOTHER CELL':'|THE DEALER SLIPS AWAY...'),3.5);}
    else{truck.mode='leave';truck.t=3.5;say(m+'|THE TRUCK DRIVES OFF...',3.5);}
  }
}

// big glowing keycard, drawn on top of the darkness so it is always visible
function drawKeycard(cx,cy){
  if(hasKey||!keyPick)return;
  const x=keyPick.x*T-cx,y=keyPick.y*T-cy;
  if(x<-80||y<-80||x>VW+80||y>VH+80)return;
  const pulse=.5+.5*Math.sin(gameT*5),b=Math.round(Math.sin(gameT*3)*2);
  ctx.globalCompositeOperation='lighter';
  glow(x+8,y+8,34+pulse*8,'80,255,255',.35+pulse*.25);
  ctx.fillStyle=`rgba(80,255,255,${.12+pulse*.15})`;ctx.fillRect(x+5,y-70,6,76);
  ctx.fillStyle=`rgba(200,255,255,${.2+pulse*.2})`;ctx.fillRect(x+7,y-70,2,76);

  ctx.fillStyle='#033';ctx.fillRect(x-1,y+2+b,18,13);

  txt('KEYCARD',x+8,y-12+b,'#7ff','center');
}
function glow(x,y,r,rgb,a){const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
// arrow on the screen edge pointing at an off-screen target
function edgeArrow(wx,wy,cx,cy,col,label){
  const sx=wx-cx,sy=wy-cy;
  if(sx>8&&sx<VW-8&&sy>20&&sy<VH-8)return;
  const px=P.x+8-cx,py=P.y+8-cy,a=Math.atan2(sy-py,sx-px);
  const ax=clamp(px+Math.cos(a)*400,14,VW-14),ay=clamp(py+Math.sin(a)*400,26,VH-14);
  ctx.save();ctx.translate(ax,ay);ctx.rotate(a);
  ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,-7);ctx.lineTo(-6,7);ctx.closePath();ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();
  ctx.restore();
  if(Math.floor(gameT*3)%2)txt(label,clamp(ax,30,VW-30),ay+(ay>VH/2?-16:10),col,'center');
}

function buildBank(){
  const rooms=BANK_ROOMS.filter(r=>isGauntlet()||!r.gauntlet);for(let i=rooms.length-1;i>0;i--){const j=rI(i+1);[rooms[i],rooms[j]]=[rooms[j],rooms[i]];}
  const chosen=rooms.slice(0,isGauntlet()?9:5); // the Gauntlet is the longest run in the game
  const W=19+chosen.reduce((a,r)=>a+r.w,0)+36,H=15,g=new Uint8Array(W*H);
  const S=(x,y,v=1)=>{if(x>=0&&x<W&&y>=0&&y<H)g[y*W+x]=v;};
  for(let x=0;x<W;x++){S(x,0);S(x,13);S(x,14);}
  for(let y=0;y<H;y++){S(0,y);S(W-1,y);}
  const items=[],lasers=[],cps=[],darks=[],hints=[],conv={},alarms={},drones=[];
  const it=(x,y,type,val)=>items.push({x:x*T+8,y:y*T+8,type,val,got:false,ph:Math.random()*6});
  const E={
    glass:(a,b,y)=>{for(let x=a;x<=b;x++)S(x,y,3);},
    alarm:(a,b,period,on,phase)=>{for(let x=a;x<=b;x++){S(x,13,4);alarms[13*W+x]={period,on,phase};}},
    drone:(a,b,ty,speed,phase)=>drones.push({x0:a*T+8,x1:b*T+8,y:ty*T+8,speed,phase,period:3.4,on:1.9}),
    pit:(a,b)=>{for(let x=a;x<=b;x++){S(x,13,0);S(x,14,0);}},
    plat:(a,b,y)=>{for(let x=a;x<=b;x++)S(x,y,1);},
    one:(a,b,y)=>{for(let x=a;x<=b;x++)S(x,y,2);},
    wall:(x,a,b)=>{for(let y=a;y<=b;y++)S(x,y,1);},
    cash:(x,y)=>it(x,y,'cash',100),gold:(x,y)=>it(x,y,'gold',500),gem:(x,y)=>it(x,y,'gem',1000),
    LV:(x,period=0,on=0,phase=0)=>lasers.push({k:'v',tx:x,ty0:1,period,on,phase}),
    LH:(a,b,y,period=0,on=0,phase=0)=>lasers.push({k:'h',tx0:a,tx1:b,ty:y,period,on,phase}),
    LM:(a,b,speed,phase=0)=>lasers.push({k:'m',tx0:a,tx1:b,ty0:1,ty1:11,speed,phase,period:0}),
    shut:(x,period,on,phase)=>lasers.push({k:'s',tx:x,period,on,phase}),
    rotor:(tx,ty,len,speed,phase)=>lasers.push({k:'r',px:tx*T+8,py:ty*T+8,len,speed,phase,period:0}),
    conv:(a,b,dir)=>{for(let x=a;x<=b;x++){S(x,13,5);conv[13*W+x]=dir;}},
    spring:x=>S(x,13,6),
    dark:(a,b)=>darks.push([a,b]),
    cp:x=>cps.push({x,on:false}),
    hint:(x,y,s)=>hints.push({x:x*T,y:y*T,s})
  };
  // lobby (always first)
  E.hint(2,3,'UP = JUMP');E.hint(2,4,'DOWN = CROUCH');
  for(let x=4;x<=8;x++)E.cash(x,12);
  E.LV(10,3,1.4,0);E.plat(12,15,10);E.cash(13,9);E.cash(14,9);E.LV(17,3,1.4,1.5);E.cash(18,12);
  // random rooms
  let o=19;for(const r of chosen){E.cp(o);r.build(o,E);o+=r.w;}
  // the vault (always last)
  E.cp(o);E.hint(o+1,3,'THE VAULT!');
  E.LM(o+4,o+10,1.6,0);E.cash(o+6,12);E.cash(o+8,12);
  E.LM(o+13,o+19,2.1,1.5);E.cash(o+15,12);E.cash(o+17,12);
  E.LV(o+22,2.2,1,0);for(let x=o+23;x<=o+27;x++)E.gold(x,12);E.gem(o+25,10);E.LV(o+28,2.2,1,1.1);
  const vaultTile=o+30;
  for(const l of lasers)if(l.k==='v'){let y=l.ty0;while(y<H&&g[y*W+l.tx]!==1)y++;l.y1=y*T;}
  const lamps=[];
  for(let x=4;x<W-4;x+=8)if(!darks.some(([a,b])=>x>=a-2&&x<=b+2))lamps.push(x*T+8);
  const glassIdx=[];for(let i=0;i<g.length;i++)if(g[i]===3)glassIdx.push(i);
  return {kind:'bank',rooms:chosen.map(r=>r.name),W,H,g,items,lasers,cps,darks,hints,lamps,conv,vaultTile,start:{x:3*T,y:13*T-22},vaultX:vaultTile*T,
    glassIdx,alarms,drones,crack:new Float32Array(W*H),broken:new Float32Array(W*H)};
}

function update(dt){
  gameT+=dt;
  if(helpOpen){helpT+=dt;if(helpT>.4&&(pressed.start||pressed.fire||pressed.help||pressed.pause)){helpOpen=false;sfx.click();}return;}
  if(showScores){if(pressed.start||pressed.fire||pressed.scores||pressed.pause){showScores=false;sfx.click();}return;}
  if(state==='title'){if(pressed.scores){showScores=true;sfx.click();return;}if(pressed.help){showHelp();return;}if(pressed.start||pressed.fire)newGame();return;}
  if(state==='win'){endT+=dt;if((pressed.start||pressed.fire)&&endT>1)state='title';return;}
  if(state==='choose'){updChoose();return;}
  if(state==='story'){storyT+=dt;if((pressed.start||pressed.fire)&&storyT>.6){if(story.page<story.more.length){story.page++;storyT=0;sfx.click();}else{const cb=story.cb;story=null;cb();}}return;}
  if(trans){trans.t+=dt;if(!trans.fired&&trans.t>=.5){trans.fired=true;trans.cb();}if(trans.t>=1)trans=null;return;}
  if(shopOpen){updShop();return;}
  if(pressed.help&&(state==='city'||state==='bank'||state==='lock'||state==='boat')){showHelp();return;}
  if(pressed.map&&(state==='city'||state==='bank')){showMap=!showMap;sfx.click();}
  if(pressed.pause&&!showMap)paused=!paused;
  if(showMap||paused)return;
  if(pressed.flash&&(state==='city'||state==='bank')){if(battery>0){flashOn=!flashOn;sfx.click();}else{say('FLASHLIGHT BATTERY IS DEAD!');sfx.deny();}}
  if(flashOn){battery-=dt;if(battery<=0){battery=0;flashOn=false;say('FLASHLIGHT BATTERY IS DEAD!');}}
  msgT-=dt;shake-=dt;hurtFlash-=dt;if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(state==='city')updCity(dt);else if(state==='bank'&&B&&B.race)updRace(dt);else if(state==='bank')updBank(dt);else if(state==='lock')updLock(dt);else if(state==='boat')updBoat(dt);
}

    ['GIVE $5000',()=>{cash+=5000;}],['GIVE KEY / PLANS',()=>{hasKey=true;if(C&&C.pieces)for(const k of C.pieces)k.got=true;if(cops)for(const c of cops)c.hasKeyCard=false;}],
    ['FULL HEARTS',()=>{hp=MAXHP;}],['TITLE SCREEN',()=>{state='title';B=null;}]
  ];
  for(const [label,fn] of items){
    if(!fn){list.appendChild(document.createElement('hr'));continue;}
    const b=document.createElement('button');b.textContent=label;
    b.style.cssText='display:block;width:100%;margin:2px 0;background:#222;color:#ff0;border:1px solid #555;padding:3px 6px;font:11px monospace;text-align:left;cursor:pointer';
    b.onclick=()=>{fn();list.style.display='none';b.blur();btn.blur();};list.appendChild(b);
  }
  btn.onclick=()=>{list.style.display=list.style.display==='none'?'block':'none';btn.blur();};
})();
// ===== END TEST MENU =====
(document.fonts&&document.fonts.load?document.fonts.load("8px 'Press Start 2P'").catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
