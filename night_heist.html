<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Heist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Press Start 2P';src:url('PressStart2P-Regular.ttf') format('truetype');} /* the iPhone app ships this file, so it works offline */
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  html.app,html.app body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none} /* the iPhone app only */
  /* the app: keep the corner buttons clear of the phone's rounded corners and notch */
  html.app body{padding-top:36px;box-sizing:border-box} /* a strip at the top for the buttons, so they don't cover the money row */
  html.app #muteBtn{left:calc(env(safe-area-inset-left) + 14px)!important}
  html.app #helpBtn,html.app #scoreBtn,html.app #hideBtn,html.app #saveBtn{right:calc(env(safe-area-inset-right) + 14px)!important}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;box-shadow:0 0 40px rgba(80,120,255,.25)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #crt{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px);
    box-shadow:inset 0 0 90px rgba(0,0,0,.75)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div id="crt"></div></div>
<button id="helpBtn" style="position:fixed;top:8px;right:8px;z-index:9;background:#14142a;color:#ffd400;border:2px solid #ffd400;padding:4px 8px;font:bold 11px monospace;cursor:pointer">? HOW TO PLAY</button>
<button id="saveBtn" style="position:fixed;top:98px;right:8px;z-index:9;background:#14142a;color:#ff8cc8;border:2px solid #ff8cc8;padding:4px 8px;font:bold 11px monospace;cursor:pointer;display:none">SAVE / LOAD</button>
<div id="saveBox" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,10,.85);align-items:center;justify-content:center;font:bold 12px monospace;color:#fff">
  <div style="background:#14142a;border:3px solid #ffd400;padding:16px 18px;max-width:440px;width:90%">
    <div style="color:#ffd400;font-size:16px;margin-bottom:10px">SAVE / LOAD YOUR PROGRESS</div>
    <div style="color:#9fd3ff;margin-bottom:4px">YOUR SAVE CODE (write it down or copy it):</div>
    <div style="display:flex;gap:6px"><input id="saveCode" readonly style="flex:1;min-width:0;font:bold 12px monospace;padding:6px 4px;background:#000;color:#7dff7d;border:2px solid #445"><button id="saveCopy" style="font:bold 12px monospace;padding:6px 10px;background:#ffd400;border:0;cursor:pointer">COPY</button></div>
    <div style="color:#889;font-size:11px;margin:4px 0 14px">Stash, upgrades, trophies, thief level, outfit, unlocked nights. (Badges stay on each device.)</div>
    <div style="color:#9fd3ff;margin-bottom:4px">HAVE A CODE? TYPE IT HERE:</div>
    <div style="display:flex;gap:6px"><input id="loadCode" placeholder="NH-...." style="flex:1;font:bold 14px monospace;padding:6px;background:#000;color:#fff;border:2px solid #445;letter-spacing:1px;text-transform:uppercase"><button id="loadGo" style="font:bold 12px monospace;padding:6px 10px;background:#7dff7d;border:0;cursor:pointer">LOAD</button></div>
    <div id="saveMsg" style="min-height:16px;margin-top:8px;color:#ffd400"></div>
    <div style="text-align:right;margin-top:8px"><button id="saveClose" style="font:bold 12px monospace;padding:6px 12px;background:#445;color:#fff;border:0;cursor:pointer">CLOSE</button></div>
  </div>
</div>
<button id="hideBtn" style="position:fixed;top:68px;right:8px;z-index:9;background:#14142a;color:#ffb070;border:2px solid #ffb070;padding:4px 8px;font:bold 11px monospace;cursor:pointer;display:none">HIDEOUT</button>
<button id="scoreBtn"  style="position:fixed;top:38px;right:8px;z-index:9;background:#14142a;color:#7dff7d;border:2px solid #7dff7d;padding:4px 8px;font:bold 11px monospace;cursor:pointer">HIGH SCORES</button>
<button id="muteBtn" style="position:fixed;top:8px;left:8px;z-index:9;background:#14142a;color:#9fd3ff;border:2px solid #9fd3ff;padding:4px 8px;font:bold 11px monospace;cursor:pointer">SOUND: ON</button>
<div id="touch" style="display:none"></div>
<!-- ===== TEST MENU (temporary, for testing levels) — REMOVE WHEN DONE ===== -->
<div id="keys2p" style="position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:9;background:#14142a;border:2px solid #ffd400;color:#fff;font:bold 11px monospace;padding:3px 8px;display:none;white-space:nowrap;pointer-events:none"></div>
<div id="testMenu" style="position:fixed;bottom:8px;left:8px;z-index:9;font:11px monospace;display:flex;flex-direction:column-reverse;align-items:flex-start">
  <button id="testBtn" style="background:#ff0;color:#000;border:2px solid #000;padding:4px 8px;font:bold 11px monospace;cursor:pointer">TEST LEVELS</button>
  <div id="testList" style="display:none;margin-bottom:4px;background:#111;border:2px solid #ff0;padding:6px;max-height:80vh;overflow:auto"></div>
</div>
<!-- ===== END TEST MENU ===== -->
<script>
'use strict';
// ================= SETUP =================
let VW=320;const VH=224,T=16;let MAXL=3,MAXHP=MAXL*3; // VW grows with a wide window, so the levels fill the screen. // hp counts thirds of a heart (an EXTRA HEART upgrade makes it 4)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW;cv.height=VH;
const lc=document.createElement('canvas');lc.width=VW;lc.height=VH;const lx=lc.getContext('2d');
const wrap=document.getElementById('wrap');
// the app: how much of each side the phone's notch and rounded corners cover (the game stays inside the rest)
const safeSides=()=>{if(!window.NH_APP)return 0;const d=document.createElement('div');d.style.cssText='position:fixed;visibility:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)';
  document.body.appendChild(d);const cs=getComputedStyle(d),w=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);d.remove();return w;};
function fit(){
  const kh=window.NH_APP?36:0,innerWidth=window.innerWidth-safeSides(); // (the app keeps a strip at the top for the buttons)
  // the game is always 224 pixels tall; on a wide window it gets wider (up to 640) instead of leaving black bars
  const nw=Math.max(320,Math.min(640,2*Math.round(VH*innerWidth/Math.max(1,innerHeight-kh)/2)));
  if(nw!==VW){VW=nw;cv.width=VW;cv.height=VH;lc.width=VW;lc.height=VH;try{viewW=VW;}catch(e){}} // (viewW doesn't exist yet on the very first call)
  let s=Math.min(innerWidth/VW,(innerHeight-kh)/VH);
  if(s>=2)s=Math.floor(s);
  wrap.style.width=cv.style.width=Math.floor(VW*s)+'px';
  wrap.style.height=cv.style.height=Math.floor(VH*s)+'px';
}
addEventListener('resize',fit);fit();
if(window.NH_APP)setInterval(fit,500); // the phone reports its notch size a moment after loading (and again after turning it)

const FONT="'Press Start 2P', monospace";
const rI=n=>Math.floor(Math.random()*n);
const pick=a=>a[rI(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const TOUCH_TXT=[['PRESS ENTER TO PLAY','TAP TO PLAY'],['PRESS ENTER (MORE...)','TAP (MORE...)'],['PRESS ENTER','TAP TO GO ON'],
  ['UP/DOWN + ENTER, OR CLICK','TAP A CHOICE'],['UP/DOWN + ENTER.  P = RESUME','TAP THE GAME TO RESUME'],['ENTER / ESC = BACK','TAP = BACK'],['LEFT/RIGHT = PLAYERS  ESC = BACK','TOP = PLAYERS   SIDE = BACK'],['CLICK, OR PRESS 1 - 4','TAP A CHOICE'],['WRONG = BACK TO THE FLAG.  ESC = BACK','WRONG = BACK TO THE FLAG.  TAP OUTSIDE = BACK'],['ESC = STEP BACK','TAP A CHOICE'],['CLICK, OR PRESS 1 / 2 / 3','TAP A CHOICE'],['CLICK, OR PRESS 1 / 2','TAP A CHOICE'],['PRESS UP WHEN THE NEXT GAP','TAP ANYWHERE WHEN THE GAP'],['H = HOW TO PLAY    ESC = BACK','TAP THE SIDE = BACK'],
  ['ENTER = TRY   BACKSPACE = FIX   ESC = GIVE UP','TYPE IT IN THE BOX AT THE TOP'],['ENTER: BUY   E: EXIT','TAP AN ITEM TO BUY IT'],
  ['ESC = TITLE SCREEN',''],['ARROWS / WASD   MOVE (UP = JUMP)','DRAG          MOVE (UP = JUMP)'],['DOWN           CROUCH (INSIDE)','DRAG DOWN      CROUCH (INSIDE)'],
  ['SPACE  STUN GUN','X      STUN GUN'],['P   PAUSE',''],['ARROWS','DRAG'],['SPACE','X'],['P / ESC',''],['PAUSE MENU',''],['  R = SCORES',''],[/\bENTER = /,'TAP = '],[/\bPRESS E\b/,'TAP USE']];
const touchTxt=s=>{for(const [a,b] of TOUCH_TXT)s=s.replace(a,b);return s;};
function txt(s,x,y,col='#fff',al='left',sz=8){
  if(TOUCH_ON&&typeof s==='string')s=touchTxt(s);
  ctx.font=sz+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';
  ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

// ================= INPUT =================
const keys={},pressed={};let lastDir='down';
let TOUCH_ON=false; // set by the touch controls once they're on screen
const KEYMAP={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',
  ArrowRight:'right',d:'right',D:'right',f:'flash',F:'flash',m:'map',M:'map',p:'pause',P:'pause',Escape:'pause',
  Enter:'start',' ':'fire',x:'fire',X:'fire',e:'use',E:'use',t:'tomato',T:'tomato',h:'help',H:'help',r:'scores',R:'scores'};
// ---- PASSWORD HIDES (solo jail + island): typing the password eats every key until you finish or press ESC
let PW=null;
addEventListener('keydown',e=>{
  if(!PW||(e.target&&e.target.tagName==='INPUT'))return;e.preventDefault();e.stopImmediatePropagation();initAudio();
  if(e.key==='Escape'){PW=null;say('YOU GAVE UP ON THE LOCK',1.5);sfx.deny();return;}
  if(e.key==='Backspace'){PW.typed=PW.typed.slice(0,-1);return;}
  if(e.key==='Enter'){pwSubmit();return;}
  if(e.key.length===1&&PW.typed.length<60){PW.typed+=e.key;beep(900+Math.random()*300,.03,'square',.02);if(pwNorm(PW.typed)===pwNorm(PW.phrase))pwSubmit();}
},true);
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return; // typing a save code
  const k=KEYMAP[e.key];if(!k)return;e.preventDefault();initAudio();
  if(!keys[k])pressed[k]=true;keys[k]=true;
  if(k==='up'||k==='down'||k==='left'||k==='right')lastDir=k;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=false;});
// raw key state by physical key, for the 2-player race (Vinae = W A S D, Vinnie = arrow keys) and the 1/2 menu
const rawKeys={},rawPressed={};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(!rawKeys[e.code])rawPressed[e.code]=true;rawKeys[e.code]=true;});
addEventListener('keyup',e=>{rawKeys[e.code]=false;});
addEventListener('blur',()=>{for(const k in rawKeys)rawKeys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

// ================= AUDIO =================
let actx=null;
// Browsers (Safari especially) only allow sound after the player touches/clicks/types, and Safari pauses
// ("suspends" or "interrupts") audio when you switch tabs. So: start or wake the audio on EVERY interaction.
let audioTries=0,audioLastTry=0;
function makeAudio(){
  try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;return;}
  music.master=null;audioTries=0; // the music bus is rebuilt on the new context
  try{const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){} // Safari unlock: a silent blip
}
function initAudio(){
  if(!actx){makeAudio();if(!actx)return;}
  if(actx.state==='running'){audioTries=0;return;}
  // Safari can keep a context stuck paused if it was made at the "wrong" moment: after a few tries, start fresh
  const now=performance.now();if(now-audioLastTry>600){audioLastTry=now;audioTries++;} // one click fires several events: count it once
  if(audioTries>3){try{actx.close();}catch(e){}makeAudio();if(!actx)return;}
  try{const r=actx.resume();if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
// Safari only trusts some events as "the player chose to start sound" (mostly the RELEASE of a click/tap and key presses),
// so try on all of them
for(const ev of ['pointerup','mouseup','touchend','click','keydown','keyup','pointerdown','touchstart'])addEventListener(ev,initAudio,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&actx&&actx.state!=='running')initAudio();});
function beep(f,d,type='square',vol=.05,slide=0,delay=0){
  if(!actx||muted)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
}
const sfx={
  coin:()=>{beep(988,.05);beep(1319,.09,'square',.05,0,.05);},
  big:()=>{beep(784,.06);beep(1047,.06,'square',.05,0,.06);beep(1568,.12,'square',.05,0,.12);},
  hurt:()=>beep(220,.35,'sawtooth',.08,-170),
  splat:()=>{beep(160,.12,'square',.06,-90);beep(90,.1,'sawtooth',.04,-40,.03);},
  toss:()=>beep(500,.08,'triangle',.05,250),
  shoot:()=>beep(900,.08,'square',.035,-700),
  zapGun:()=>beep(1800,.12,'sawtooth',.04,-1400),
  jump:()=>beep(330,.12,'square',.035,330),
  click:()=>beep(1200,.03,'square',.03),
  // police alarm: the original high-low beep. It plays once even when many police join at the same moment
  // (each cop used to play his own, and they piled up into a loud rattle), at most once every 2 seconds
  alarm:()=>{const now=performance.now();if(now-(sfx._alarmAt||0)<2000)return;sfx._alarmAt=now;beep(880,.08,'square',.04);beep(660,.08,'square',.04,0,.09);},
  key:()=>{[523,659,784,1047].forEach((f,i)=>beep(f,.1,'square',.05,0,i*.08));},
  deny:()=>beep(140,.15,'square',.05),
  zap:()=>beep(1400,.3,'sawtooth',.06,-1200),
  buy:()=>{[659,880,1175].forEach((f,i)=>beep(f,.09,'square',.05,0,i*.07));},
  horn:()=>{beep(330,.15,'square',.05);beep(330,.2,'square',.05,0,.2);},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.16,'square',.05,0,i*.13));},
  cp:()=>{beep(660,.08);beep(990,.12,'square',.05,0,.08);}
};

// ================= MUSIC (generated chiptune, no audio files) =================
// Each track: 4 bars x 16 steps. Notes are names like A4 / C#5, '.' is a rest.
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const midi=n=>{const m=n.match(/^([A-G][#b]?)(\d)$/);return 12*(+m[2]+1)+NOTE[m[1]];};
const mf=m=>440*Math.pow(2,(m-69)/12);
const seq=str=>str.trim().split(/\s+/).map(t=>t==='.'?0:midi(t));
// bass line from chords: one chord per bar, eighth notes
const bassFrom=(chords,pat)=>chords.flatMap(ch=>{const r=midi(ch)-12,out=Array(16).fill(0);pat.forEach((o,i)=>{if(o!==null)out[i*2]=r+o;});return out;});
const ANDALUSIAN=['A3','G3','F3','E3'];
const cityLead=seq(`A4 . . C5 . . B4 . A4 . . . E4 . . .  G4 . . B4 . . A4 . G4 . . . D4 . . .
                    F4 . . A4 . . G4 . F4 . . . C5 . . .  E4 . G#4 . B4 . D5 . C5 . B4 . G#4 . . .`);
// night 5 has its own music: E Phrygian on the rooftops (dark, Spanish-flavored), B minor in the Reserve
const roofArp=(chords,shape)=>chords.flatMap(([ch,third])=>{const r=midi(ch);return shape.map(o=>r+(o===3?third:o===15?12+third:o));});
const TRACKS={
  roof:{bpm:120,leadVol:.02,leadLen:.12,bassVol:.085,leadType:'sawtooth',
    lead:seq(`B4 . . . . . C5 . B4 . . . G4 . . .  A4 . . . . . B4 . A4 . . . F4 . . .
              G4 . . . . . A4 . G4 . . . E4 . . .  F4 . . . G4 . . . F4 . E4 . . . . .`),
    bass:bassFrom(['E3','F3','G3','F3'],[0,null,0,12,null,0,7,null]),
    kick:[0,8],hat:[2,6,10,14],snare:[12]},
  roofChase:{bpm:168,leadVol:.016,leadLen:.07,bassVol:.095,leadType:'sawtooth',siren:true,
    lead:roofArp([['E4',3],['F4',4],['E4',3],['D4',3]],[24,19,15,12,24,19,15,12,22,19,15,12,24,22,19,15]),
    bass:bassFrom(['E3','F3','E3','D3'],[0,12,0,12,0,12,0,12]),
    kick:[0,4,8,12],hat:[0,2,4,6,8,10,12,14,1,5,9,13],snare:[4,12]},
  reserve:{bpm:126,leadVol:.022,leadLen:.3,bassVol:.09,leadType:'triangle',arpVol:.009,
    lead:seq(`F#5 . . . . . . . . . . . E5 . D5 .  C#5 . . . . . . . . . . . . . . .
              D5 . . . . . . . C#5 . . . B4 . . .  Bb4 . . . . . . . . . . . . . . .`),
    arp:roofArp([['B4',3],['B4',3],['G4',4],['F#4',4]],[0,7,12,7,3,7,12,7,0,7,12,7,3,7,12,7]),
    bass:bassFrom(['B3','B3','G3','F#3'],[0,null,null,0,null,null,0,null]),
    kick:[0,10],hat:[0,4,8,12],snare:[8]},
  // island prison: slow, minor and laid-back. Soft triangle lead, dub bass, off-beat hats like waves
  island:{bpm:88,leadVol:.022,leadLen:.32,bassVol:.085,leadType:'triangle',
    lead:seq(`A4 . . . . . C5 . . . E5 . . . D5 .  C5 . . . . . . . . . . . . . . .
              G4 . . . . . Bb4 . . . D5 . . . C5 .  A4 . . . . . . . . . . . . . . .
              A4 . . . . . C5 . . . E5 . . . G5 .  F5 . . . E5 . . . D5 . . . . . . .
              E5 . . . . . D5 . . . C5 . . . Bb4 .  A4 . . . . . . . . . . . . . . .`),
    bass:bassFrom(['D3','G2','D3','A2'],[0,null,null,0,null,null,7,null]),
    kick:[0],hat:[2,6,10,14],snare:[8]},
  storm:{bpm:104,leadVol:.02,leadLen:.2,bassVol:.09,leadType:'triangle',
    lead:seq(`C5 . . . Eb5 . . . G5 . . . F5 . Eb5 .  D5 . . . . . . . Bb4 . . . . . . .
              C5 . . . Eb5 . . . Ab5 . . . G5 . F5 .  G5 . . . . . . . . . . . . . . .`),
    bass:bassFrom(['C3','C3','Ab2','Bb2'],[0,null,7,null,0,12,7,null]),
    kick:[0,8],hat:[4,12],snare:[]},
  station:{bpm:124,leadVol:.02,leadLen:.14,bassVol:.09,
    lead:seq(`G4 . Bb4 . D5 . . . C5 . Bb4 . A4 . . .  G4 . Bb4 . D5 . F5 . Eb5 . D5 . C5 . . .
              Bb4 . . . C5 . . . D5 . . . Eb5 . D5 .  C5 . . . A4 . . . F#4 . . . . . . .`),
    bass:bassFrom(['G2','G2','Eb3','D3'],[0,0,12,0,0,0,12,7]),
    kick:[0,6,8],hat:[0,2,4,6,8,10,12,14],snare:[12]},
  city:{bpm:96,lead:cityLead,leadVol:.022,leadLen:.09,bassVol:.085,
    bass:bassFrom(ANDALUSIAN,[0,null,7,null,12,null,7,3]),
    kick:[0,8],hat:[2,6,10,14],snare:[]},
  title:{bpm:100,lead:cityLead,leadVol:.026,leadLen:.14,bassVol:.085,
    bass:bassFrom(ANDALUSIAN,[0,null,7,null,12,null,7,3]),
    kick:[0,8],hat:[2,6,10,14],snare:[4,12]},
  chase:{bpm:152,leadVol:.016,leadLen:.06,bassVol:.09,
    lead:ANDALUSIAN.flatMap(ch=>{const r=midi(ch)+12,t=r+(ch==='A3'?3:4),f=r+7;return [r,t,f,t+12,f,t,r+12,f,r,t,f,t+12,r+12,f,t,f];}),
    bass:bassFrom(ANDALUSIAN,[0,12,0,12,0,12,0,12]),
    kick:[0,4,8,12],hat:[2,6,10,14],snare:[4,12]},
  jail:{bpm:84,leadVol:.02,leadLen:.22,bassVol:.09,
    lead:seq(`E5 . . . . . . . D5 . . . . . . .  C5 . . . . . . . B4 . . . . . A4 .
              E5 . . . . . G5 . F5 . . . E5 . . .  D5 . . . C5 . . . B4 . . . . . . .`),
    bass:bassFrom(['A3','A3','F3','E3'],[0,null,null,7,0,null,12,null]),
    kick:[0,10],hat:[4,12],snare:[]},
  bank:{bpm:116,leadVol:.02,leadLen:.16,bassVol:.09,
    lead:seq(`D5 . . . A4 . . . C5 . D5 . . . . .  F5 . . . E5 . . . D5 . C5 . . . . .
              D5 . . . F5 . . . Bb4 . . . D5 . . .  C#5 . . . E5 . . . A4 . . . C#5 . E5 .`),
    bass:bassFrom(['D3','D3','Bb2','A2'],[0,0,12,0,0,0,12,0]),

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

function wantTrack(){
  if(!music.on||paused)return null;

  if(state==='story'||state==='choose'||state==='menu'||state==='hideout'||state==='badges'||state==='backpack'||state==='dailyres'||state==='nightsel'||state==='results'||state==='win')return 'title';
  if(state==='lock')return null; // the lock plays its own metronome
  if(state==='boat')return 'chase';
  if(state==='city')return isRoof()?(wanted()?'roofChase':'roof'):wanted()?'chase':isIsland()?'island':isJail()?'jail':isGallery()?'bank':isStorm()?'storm':'city';
  if(state==='bank')return B&&B.theme==='reserve'?(B.timer>0&&B.timer<30?'roofChase':'reserve'):B&&B.theme==='station'?'station':B&&B.kind==='museum'?'bank':'vault'; // museum halls: 'bank' tune. The bank (and side jobs): its own 'vault' tune

function musicTick(){
  if(!actx)return;musicSetup();
  const name=wantTrack();
  if(name!==music.name){music.name=name;music.step=0;music.next=actx.currentTime+.06;}
  if(!name)return;
  const tr=TRACKS[name],sp=60/tr.bpm/4;
  if(music.next<actx.currentTime-.2)music.next=actx.currentTime+.05; // tab was in background
  while(music.next<actx.currentTime+.15){
    const t=music.next,i=music.step%64,b=i%16;
    if(tr.bass[i])tone(mf(tr.bass[i]),t,sp*1.8,'triangle',tr.bassVol);
    if(tr.lead[i])tone(mf(tr.lead[i]),t,tr.leadLen,tr.leadType||'square',tr.leadVol);
    if(tr.arp&&tr.arp[i])tone(mf(tr.arp[i]),t,sp*.9,'square',tr.arpVol);
    if(tr.siren&&i%32===0){tone(620,t,sp*16,'triangle',.022,320);tone(940,t+sp*16,sp*16,'triangle',.022,-320);}
    if(tr.kick.includes(b))tone(140,t,.12,'sine',.18,-100);
    if(tr.snare.includes(b))hit(t,.12,.06,1200);
    if(tr.hat.includes(b))hit(t,.03,.025,7000);
    music.next+=sp;music.step++;
  }
}

const NIGHT_PAY=[0,6000,8000,8000,10000,12000,16000],CLEAN_PAY=5000;
function recordScore(){
  if(!testMode&&night<NIGHTS&&night+1>unlocked()){try{localStorage.setItem('nh_unlocked',String(night+1));}catch(e){}}

    const bonus=Math.round((NIGHT_PAY[night]||0)*(1+.15*upLvl('getaway')))+(nightHurt===0?CLEAN_PAY:0),pay=Math.round((nightStolen+bonus)*(impossibleMode?3:extremeMode?2:hardMode?1.5:1)*(1-tradeoff('pay')));
    {const l=upLvl('interest'),it=Math.min(3000*l,Math.round(save.stash*.03*l));if(it>0){save.stash+=it;toasts.push({a:'PIGGY BANK: +$'+it,b:'INTEREST ON YOUR STASH',t:3.2});}} // PIGGY BANK
    if(pay>0){save.stash+=pay;writeSave();toast('+$'+pay+' TO YOUR STASH','LOOT $'+nightStolen+' + NIGHT BONUS $'+bonus+(impossibleMode?' (X3 IMPOSSIBLE)':extremeMode?' (X2 EXTREME)':hardMode?' (X1.5 HARD)':''));}

function genCity(jail,nPieces=1){
  const g=new Uint8Array(CW*CH),dark=new Uint8Array(CW*CH),blk=new Int16Array(CW*CH).fill(-1);
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const mx=x%12,my=y%11,i=y*CW+x;
    if(mx<=1||my<=1)g[i]=TR;
    else if(mx===2||mx===11||my===2||my===10)g[i]=TS;
    else{g[i]=TB;blk[i]=Math.floor(x/12)+Math.floor(y/11)*NBX;}
  }
  for(let y=BK0Y;y<=BK1Y;y++)for(let x=BK0X;x<=BK1X;x++)g[y*CW+x]=TK;
  g[BK1Y*CW+BK0X+3]=TKD;g[BK1Y*CW+BK0X+4]=TKD;
  const isBank=(bx,by)=>bx===BKX&&by===BKY;
  // keycard goes in a block far from the start (top-left)
  const cand=[];
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++)if(!isBank(bx,by)&&bx+by>=(nPieces>1?4:NBX+NBY-6))cand.push([bx,by]);
  const kbs=[];
  if(!jail){const c2=cand.slice();while(kbs.length<nPieces&&c2.length){const b=c2.splice(rI(c2.length),1)[0];if(kbs.every(k=>Math.abs(k[0]-b[0])+Math.abs(k[1]-b[1])>=4)||c2.length===0)kbs.push(b);}}
  const alleys=[],keys=[];let key=null;
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    const isK=kbs.some(k=>k[0]===bx&&k[1]===by);
    if(!isK&&Math.random()>(jail?.35:.45))continue;
    const tiles=[];
    if(Math.random()<0.5){const ax=12*bx+5+rI(4);for(let y=11*by+3;y<=11*by+9;y++)tiles.push([ax,y]);}
    else{const ay=11*by+4+rI(4);for(let x=12*bx+3;x<=12*bx+10;x++)tiles.push([x,ay]);}
    for(const [x,y] of tiles){g[y*CW+x]=TA;dark[y*CW+x]=1;}
    alleys.push(tiles);
    if(isK)keys.push(tiles[Math.floor(tiles.length/2)]);
  }
  // hideout doors
  for(let by=0;by<NBY;by++)for(let bx=0;bx<NBX;bx++){
    if(isBank(bx,by))continue;
    let n=0,tries=0;
    while(n<(jail?4:2)&&tries<80){
      tries++;const s=rI(4);let x,y,ox=0,oy=0;
      if(s===0){x=12*bx+4+rI(6);y=11*by+3;oy=-1;}
      else if(s===1){x=12*bx+4+rI(6);y=11*by+9;oy=1;}
      else if(s===2){x=12*bx+3;y=11*by+4+rI(5);ox=-1;}
      else{x=12*bx+10;y=11*by+4+rI(5);ox=1;}
      if(g[y*CW+x]!==TB||g[(y+oy)*CW+x+ox]!==TS)continue;
      g[y*CW+x]=TD;n++;
    }
  }
  const lights=[];
  for(let i=0;i<=NBX;i++)for(let j=0;j<=NBY;j++){
    for(const [x,y] of [[12*i-1,11*j-1],[12*i+2,11*j-1],[12*i-1,11*j+2],[12*i+2,11*j+2]]){
      if(x<0||y<0||x>=CW||y>=CH||g[y*CW+x]!==TS)continue;
      if(Math.random()<(jail?.7:.45))lights.push({x:x*T+8,y:y*T+8});
    }
  }
  if(jail){g[3*CW+5]=TD;dark[3*CW+5]=0;} // your cell, top-left
  key=keys[0]||null;
  return {g,dark,blk,alleys,key,keys,lights,jail:!!jail,cell:jail?[5,3]:null};
}

// night 4: a quiet NEIGHBORHOOD instead of the downtown. The same street grid, but every block is lawns with
// tiny houses (porch doors to hide in), trees, and dark backyards to sneak through. The station is in the corner.
function genSuburb(){
  const g=new Uint8Array(CW*CH).fill(TA),dark=new Uint8Array(CW*CH),blk=new Int16Array(CW*CH).fill(-1),tree=new Uint8Array(CW*CH),hid=new Int16Array(CW*CH).fill(-1),houses=[];

  const carRows=[0,4,7],carCols=[0,5,9],side=[['v',2,0,4],['v',7,4,7],['h',2,5,9],['h',6,0,5]];
  const road=(ax,k,a,b)=>{if(ax==='h'){const y=11*k;for(let x=12*a;x<=Math.min(CW-1,12*b+1);x++){S(x,y,TR);S(x,y+1,TR);}}
    else{const x=12*k;for(let y=11*a;y<=Math.min(CH-1,11*b+1);y++){S(x,y,TR);S(x+1,y,TR);}}};
  for(const k of carRows)road('h',k,0,NBX);for(const k of carCols)road('v',k,0,NBY);for(const [ax,k,a,b] of side)road(ax,k,a,b);
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){if(g[y*CW+x]!==TA)continue; // a sidewalk along every street
    let nr=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<CW&&yy<CH&&g[yy*CW+xx]===TR)nr=true;}if(nr)g[y*CW+x]=TS;}
  for(let y=BK0Y;y<=BK1Y;y++)for(let x=BK0X;x<=BK1X;x++)g[y*CW+x]=TK;
  g[BK1Y*CW+BK0X+3]=TKD;g[BK1Y*CW+BK0X+4]=TKD;
  const free=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x<0||y<0||x>=CW||y>=CH||g[y*CW+x]!==TA)return false;return true;};
  const nearStation=(x,y)=>x>=BK0X-3&&x<=BK1X+3&&y>=BK0Y-3&&y<=BK1Y+3;
  // the CORNER STORE: a real building on a street, bigger than the houses. Its welcome mat (on the sidewalk) opens the shop
  let shop=null;
  for(let tr=0;tr<6000&&!shop;tr++){const w=6,h=4,x=2+rI(CW-w-4),y=2+rI(CH-h-4),ex=x+(w>>1);
    if(nearStation(x,y)||nearStation(x+w,y+h)||Math.abs(x-2)+Math.abs(y-2)<14||!free(x-1,y-1,x+w,y+h-1)||g[(y+h)*CW+ex]!==TS)continue;
    const id=houses.length;houses.push({x,y,w,h,col:0,shop:true});for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){g[yy*CW+xx]=TB;hid[yy*CW+xx]=id;}
    shop={tx:ex,ty:y+h};}
  // houses of all sizes dotted around the lawns: each with a porch (hide there) and its own front walk to the street
  for(let tr=0;tr<8000&&houses.length<80;tr++){
    const big=Math.random()<.3,w=big?4+rI(2):2+rI(2),h=big?3+rI(2):2+rI(2),x=1+rI(CW-w-2),y=1+rI(CH-h-2);
    if(nearStation(x,y)||nearStation(x+w,y+h)||!free(x-1,y-1,x+w,y+h))continue;
    let best=null;
    for(const [dx,dy] of DIRS){const px=dx>0?x+w:dx<0?x-1:x+rI(w),py=dy>0?y+h:dy<0?y-1:y+rI(h),path=[];let ok=false;

const HOUSE_COL=[['#8a3a2e','#6e2c22'],['#3a5a7a','#2c465e'],['#6a6a72','#52525a'],['#7a5a2e','#5e4422'],['#4a6a3a','#38522c']];

// ---- street details seen from above (drawn once into the city picture): stop signs, street-name signs,

function streetDeco(g,R,r){
  const walk=(x,y)=>{const t=ct(x,y);return x>=0&&y>=0&&x<CW&&y<CH&&(t===TS||(C.suburb&&t===TA));},road=(x,y)=>x>=0&&y>=0&&x<CW&&y<CH&&ct(x,y)===TR;

  const stopSign=(px,py)=>{R(px+2,py+4,5,2,'rgba(0,0,0,.45)'); // shadow of the pole + sign
    g.fillStyle='#f4f4f4';oct(px,py,5.6);g.fillStyle='#d01c24';oct(px,py,4.6);for(let k=0;k<4;k++)R(px-4+k*2+(k>1?1:0),py-1,1,2,'#fff');}; // red octagon, white rim, tiny 'STOP' letters

  const nameSign=(px,py)=>{R(px+1,py+2,6,2,'rgba(0,0,0,.4)');R(px-4,py-1,9,2,'#1f7a3a');R(px-1,py-4,2,9,'#1f7a3a'); // two green street-name blades
    R(px-3,py-1,1,1,'#e8fff0');R(px-1,py-1,1,1,'#e8fff0');R(px+2,py-1,1,1,'#e8fff0');R(px-1,py-3,1,1,'#e8fff0');R(px-1,py+2,1,1,'#e8fff0');R(px-1,py-1,2,2,'#9aa0a8');};
  const hydrant=(px,py)=>{R(px+1,py+2,5,2,'rgba(0,0,0,.4)');R(px-2,py-2,5,5,'#c0262c');R(px-1,py-1,3,3,'#ff5a5a');R(px-3,py-1,1,3,'#8a1a1e');R(px+3,py-1,1,3,'#8a1a1e');};
  const busStop=(px,py)=>{R(px-6,py+3,12,3,'#6b4a2a');R(px-6,py+3,12,1,'#8a6a40');R(px+5,py-4,1,4,'#555');R(px+3,py-7,6,5,'#2a5ad0');R(px+4,py-6,4,3,'#fff');R(px+5,py-5,2,1,'#2a5ad0');}; // bench + blue BUS sign
  const parkSign=(px,py)=>{R(px+1,py+2,5,2,'rgba(0,0,0,.4)');R(px-2,py-3,6,6,'#2a5ad0');R(px-1,py-2,1,4,'#fff');R(px,py-2,2,1,'#fff');R(px,py,2,1,'#fff');R(px+1,py-1,1,1,'#fff');}; // blue P
  const speedSign=(px,py)=>{R(px+1,py+3,5,2,'rgba(0,0,0,.4)');R(px-3,py-4,6,7,'#f4f4f4');R(px-2,py-3,4,1,'#222');R(px-2,py-1,1,3,'#222');R(px+1,py-1,1,3,'#222');R(px,py-1,1,1,'#222');R(px,py+1,1,1,'#222');}; // white SPEED 20
  const warnSign=(px,py)=>{R(px+1,py+3,5,2,'rgba(0,0,0,.4)');g.fillStyle='#222';g.beginPath();g.moveTo(px,py-5);g.lineTo(px+5,py);g.lineTo(px,py+5);g.lineTo(px-5,py);g.closePath();g.fill();
    g.fillStyle='#ffd400';g.beginPath();g.moveTo(px,py-4);g.lineTo(px+4,py);g.lineTo(px,py+4);g.lineTo(px-4,py);g.closePath();g.fill();R(px,py-2,1,3,'#222');R(px,py+2,1,1,'#222');}; // yellow (!) diamond
  const manhole=(px,py)=>{g.fillStyle='#1c1c24';g.beginPath();g.arc(px,py,4.5,0,7);g.fill();g.fillStyle='#3a3a46';g.beginPath();g.arc(px,py,3.5,0,7);g.fill();R(px-3,py-1,6,1,'#26262e');R(px-3,py+1,6,1,'#26262e');};
  const busy=new Set(); // tiles that already have a sign
  for(let i=0;i<=NBX;i++)for(let j=0;j<=NBY;j++){const ix=12*i,iy=11*j;
    if(!road(ix,iy)||!road(ix+1,iy+1))continue;
    if(C.suburb){ // no traffic lights in the neighborhood: a 4-way stop. A white stop line on each lane coming in, and its sign on the driver's right

      const A=[[road(ix+2,iy)&&road(ix+3,iy),()=>{R((ix+2)*T,iy*T+1,2,14,'#e8e8e8');paint('STOP',(ix+2)*T+22,iy*T+8,-Math.PI/2);},ix+2,iy-1,5,10],       // from the right, top lane (driving left)

  }
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){const X=x*T,Y=y*T,mx=x%12,my=y%11,nearX=(mx>=11||mx<=2)&&(my>=10||my<=2);
    if(road(x,y)){ // roads: a few manhole covers (not on crosswalks or in the middle of a crossing)
      if(!C.suburb&&!(mx<=1&&my<=1)&&!(mx===2||mx===11||my===2||my===10)&&r()<.025)manhole(X+8,Y+8);continue;}

// Museum floor plan: split the building into rooms of different sizes (BSP), connect them with
// doorways, make 3 dark storage rooms (blueprints) and a walled Moonstone Vault Wing near the middle.
function genGallery(){
  for(let attempt=0;attempt<60;attempt++){
    CW=92;CH=64;WW=CW*T;WH=CH*T;NBX=0;NBY=0;
    const g=new Uint8Array(CW*CH).fill(TB),dark=new Uint8Array(CW*CH),leaves=[],splits=[];
    const split=(x,y,w,h)=>{
      const canV=w>=20,canH=h>=18;
      if((canV||canH)&&!(w<26&&h<22&&Math.random()<.3)){
        if(canV&&(!canH||w>h*1.2||Math.random()<.5)){const sx=x+9+rI(w-17);splits.push({v:true,at:sx,a:y,b:y+h});split(x,y,sx-x,h);split(sx,y,x+w-sx,h);}
        else{const sy=y+8+rI(h-15);splits.push({v:false,at:sy,a:x,b:x+w});split(x,y,w,sy-y);split(x,sy,w,y+h-sy);}
      }else leaves.push({x,y,w,h});
    };
    split(0,0,CW-1,CH-1);
    for(const L of leaves)for(let yy=L.y+1;yy<L.y+L.h;yy++)for(let xx=L.x+1;xx<L.x+L.w;xx++)g[yy*CW+xx]=TR;
    const fl=(x,y)=>x>0&&y>0&&x<CW-1&&y<CH-1&&g[y*CW+x]!==TB;

    for(const sp of splits){

        if(sp.v){if(fl(sp.at-1,k)&&fl(sp.at+1,k)&&fl(sp.at-1,k+1)&&fl(sp.at+1,k+1))opts.push(k);}
        else{if(fl(k,sp.at-1)&&fl(k,sp.at+1)&&fl(k+1,sp.at-1)&&fl(k+1,sp.at+1))opts.push(k);}}
      if(!opts.length)continue;const k=pick(opts);
      if(sp.v){g[k*CW+sp.at]=TR;g[(k+1)*CW+sp.at]=TR;}else{g[sp.at*CW+k]=TR;g[sp.at*CW+k+1]=TR;}
    }
    const cx0=CW/2,cy0=CH/2,dist=L=>Math.abs(L.x+L.w/2-cx0)+Math.abs(L.y+L.h/2-cy0);
    const start=leaves.find(L=>L.x===0&&L.y===0);
    const vault=leaves.filter(L=>L!==start&&L.w>=9&&L.h>=8).sort((a,b)=>dist(a)-dist(b))[0];
    if(!start||!vault)continue;
    // the vault wing: solid gold-trimmed block with ONE door
    for(let yy=vault.y;yy<=vault.y+vault.h;yy++)for(let xx=vault.x;xx<=vault.x+vault.w;xx++)
      g[yy*CW+xx]=(xx===vault.x||yy===vault.y||xx===vault.x+vault.w||yy===vault.y+vault.h)?TB:TK;
    const doorOpts=[];
    for(let xx=vault.x+2;xx<vault.x+vault.w-1;xx++){if(fl(xx,vault.y+vault.h+1))doorOpts.push([xx,vault.y+vault.h,0,1]);if(fl(xx,vault.y-1))doorOpts.push([xx,vault.y,0,-1]);}
    for(let yy=vault.y+2;yy<vault.y+vault.h-1;yy++){if(fl(vault.x-1,yy))doorOpts.push([vault.x,yy,-1,0]);if(fl(vault.x+vault.w+1,yy))doorOpts.push([vault.x+vault.w,yy,1,0]);}
    if(!doorOpts.length)continue;
    const [ddx,ddy]=pick(doorOpts);g[ddy*CW+ddx]=TKD;
    // exhibit rooms get a carpet ring and scattered statues/cases; 3 far-apart rooms are dark storage
    const others=leaves.filter(L=>L!==start&&L!==vault);
    const store=[];for(const L of others.slice().sort(()=>Math.random()-.5)){if(store.length>=3)break;if(L.w>=8&&L.h>=7&&store.every(o=>Math.abs(o.x-L.x)+Math.abs(o.y-L.y)>=24))store.push(L);}
    if(store.length<3)continue;
    const alleys=[],keys=[];
    for(const L of leaves){
      if(L===vault)continue;
      const isStore=store.includes(L),tiles=[];
      for(let yy=L.y+1;yy<L.y+L.h;yy++)for(let xx=L.x+1;xx<L.x+L.w;xx++){
        const i=yy*CW+xx;if(g[i]===TB)continue;
        if(isStore){g[i]=TA;dark[i]=1;tiles.push([xx,yy]);continue;}
        const edge=xx===L.x+1||yy===L.y+1||xx===L.x+L.w-1||yy===L.y+L.h-1;
        g[i]=edge?TS:TR;
        const inner=xx>L.x+2&&yy>L.y+2&&xx<L.x+L.w-2&&yy<L.y+L.h-2;
        if(inner&&L!==start&&Math.random()<.07)g[i]=TB; // statue / display case
      }
      if(isStore){alleys.push(tiles);keys.push([L.x+Math.floor(L.w/2),L.y+Math.floor(L.h/2)]);}
    }
    // extra doorways: most rooms get several ways in and out
    const isFl=i=>g[i]===TR||g[i]===TS||g[i]===TA,inVault=(x,y)=>x>=vault.x-1&&x<=vault.x+vault.w+1&&y>=vault.y-1&&y<=vault.y+vault.h+1;
    for(let y=2;y<CH-3;y++)for(let x=2;x<CW-3;x++){
      const i=y*CW+x;if(g[i]!==TB||inVault(x,y)||inVault(x+1,y+1))continue;
      if(isFl(i-1)&&isFl(i+1)&&isFl(i+CW-1)&&isFl(i+CW+1)&&g[i-CW]===TB&&g[i+CW]===TB&&Math.random()<.3){g[i]=TR;g[i+CW]=TR;} // through a vertical wall
      else if(isFl(i-CW)&&isFl(i+CW)&&isFl(i-CW+1)&&isFl(i+CW+1)&&g[i-1]===TB&&g[i+1]===TB&&Math.random()<.3){g[i]=TR;g[i+1]=TR;} // through a horizontal wall
    }
    for(const L of leaves){if(L===vault)continue;
      const sides=[[L.x,L.y+1,L.y+L.h-1,true],[L.x+L.w,L.y+1,L.y+L.h-1,true],[L.y,L.x+1,L.x+L.w-1,false],[L.y+L.h,L.x+1,L.x+L.w-1,false]];
      for(const [at,a,b,vert] of sides){
        const T2=(k,o)=>vert?(k*CW+at+o):((at+o)*CW+k);
        if(vert?(at<=0||at>=CW-1):(at<=0||at>=CH-1))continue;
        let open=false;for(let k=a;k<=b;k++)if(isFl(T2(k,0)))open=true;if(open)continue;
        const opts=[];for(let k=a+1;k<b-1;k++)if(isFl(T2(k,-1))&&isFl(T2(k,1))&&isFl(T2(k+1,-1))&&isFl(T2(k+1,1))&&!inVault(vert?at:k,vert?k:at))opts.push(k);
        if(opts.length){const k=pick(opts);g[T2(k,0)]=TR;g[T2(k+1,0)]=TR;}
      }}
    // everything must be reachable from the start room
    const seen=new Uint8Array(CW*CH),q=[2*CW+2];seen[q[0]]=1;let h=0;const walk=v=>v===TR||v===TS||v===TA||v===TKD;
    while(h<q.length){const c=q[h++],x=c%CW,y=(c/CW)|0;for(const [dx,dy] of DIRS){const n=(y+dy)*CW+x+dx;if(!seen[n]&&walk(g[n])){seen[n]=1;q.push(n);}}}
    let ok=true;for(let i=0;i<g.length;i++)if((g[i]===TR||g[i]===TS||g[i]===TA)&&!seen[i]){g[i]=TB;}  // seal off unreachable bits

    if(!ok)continue;
    // sarcophagi along room walls
    for(let i=0;i<g.length;i++){if(g[i]!==TB)continue;const x=i%CW,y=(i/CW)|0;if(x<1||y<1||x>CW-2||y>CH-2)continue;
      const nb=DIRS.filter(([dx,dy])=>g[(y+dy)*CW+x+dx]===TS).length,wallLine=(g[i-1]===TB&&g[i+1]===TB)||(g[i-CW]===TB&&g[i+CW]===TB);
      if(nb===1&&wallLine&&Math.random()<.26)g[i]=TD;}
    for(const L of leaves){if(L===vault)continue;
      const edge=[];for(let xx=L.x;xx<=L.x+L.w;xx++)for(const yy of [L.y,L.y+L.h])edge.push([xx,yy]);for(let yy=L.y;yy<=L.y+L.h;yy++)for(const xx of [L.x,L.x+L.w])edge.push([xx,yy]);
      const have=edge.filter(([xx,yy])=>g[yy*CW+xx]===TD).length;if(have>=2)continue;
      const opts=edge.filter(([xx,yy])=>{const i=yy*CW+xx;if(xx<1||yy<1||xx>CW-2||yy>CH-2||g[i]!==TB)return false;
        const nb=DIRS.filter(([dx,dy])=>{const v=g[(yy+dy)*CW+xx+dx];return v===TS||v===TA||v===TR;}).length;return nb===1&&((g[i-1]===TB&&g[i+1]===TB)||(g[i-CW]===TB&&g[i+CW]===TB));});
      const want=Math.max(2,Math.round((L.w+L.h)*2/8)); // about one per 8 tiles of wall
      for(let k=have;k<want&&opts.length;k++){const [xx,yy]=opts.splice(rI(opts.length),1)[0];g[yy*CW+xx]=TD;}
      if(L.w>=12&&L.h>=10&&L!==start){ // free-standing mummy cases in the middle of big rooms
        for(let k=0,tr=0;k<2&&tr<40;tr++){const xx=L.x+3+rI(L.w-5),yy=L.y+3+rI(L.h-5),i=yy*CW+xx;

function copDodge(c,dt,shots){

  c.dodgeCD=(c.dodgeCD||0)-dt;
  if(c.dodging>0){c.dodging-=dt;if(c.moving){stepMover(c,115,dt);return true;}c.dodging=0;}
  if(c.wit>=99||c.dodgeCD>0)return false;

  for(const q of shots){if(!(q.life>0)||q.coco||(q.hit&&q.hit.has(c)))continue;const v=Math.hypot(q.vx,q.vy);if(!v)continue;
    const ux=q.vx/v,uy=q.vy/v,dx=cx-q.x,dy=cy-q.y,along=dx*ux+dy*uy,off=Math.abs(dx*uy-dy*ux);
    if(along>0&&along<v*.7&&off<11){th={q,ux,uy};break;}}

    c.ttx=nx;c.tty=ny;c.dx=ddx;c.dy=ddy;c.moving=true;c.dodging=.45;c.dodgeCD=.9;c.seenT=0;
    if(c.wit<.14)floatTxt(c.x+8,c.y-6,pick(['NOPE!','TOO SLOW!','HA!']),'#9fd3ff');
    stepMover(c,115,dt);return true;}
  c.dodgeCD=.4;return false; // nowhere to go

function stepMover(m,sp,dt){
  const tx=m.ttx*T,ty=m.tty*T,ddx=tx-m.x,ddy=ty-m.y,d=Math.abs(ddx)+Math.abs(ddy);

      }else if(k.type==='uniform'){disguiseT=Math.max(0,disguiseT)+20+10*upLvl('uniform');for(const c of cops)if(c.guard)c.state='patrol';sfx.buy();floatTxt(k.x*T+8,k.y*T,'UNIFORM ON!','#c0c5cf');say('A GUARD UNIFORM FROM THE LAUNDRY!|20S: GUARDS + CAMERAS IGNORE YOU',3.5);
      }else if(k.type==='key'){hasKey=true;keyTaken=false;sfx.key();say('KEYCARD GET! NOW ROB THE|BIG BANK (FOLLOW THE ARROW)',4);floatTxt(k.x*T+8,k.y*T,'KEYCARD','#5ff');}
      else if(k.type==='rare'){lootGain(k.val,k.x*T+8,k.y*T,true);stat('rares',1,5,'rare');say('YOU FOUND THE '+k.name+'!|A RARE TREASURE: +$'+Math.round(k.val*comboMult()),3.5);}
      else lootGain(k.val,k.x*T+8,k.y*T,k.type==='bag');
    }
  }
  // --- cops: perception + radio
  const pdark=C.dark[pty*CW+ptx];
  const lvl=nightLvl(),jail=isJail();
  const sightR=Math.max(1,Math.round((C.flash>0?(pdark?4:10):(flashOn?11:pdark?2:(C.mounds&&C.digT>0)?3:6)+(hardMode&&!extremeMode&&!pdark?1:0))*(impossibleMode?2.5:extremeMode?1.85:1))-(C.flash>0||flashOn?0:upLvl('stealth'))+Math.round(tradeoff('sight'))); // SHADOW STEP. extreme: they see almost twice as far // lightning lights up everything // crouched down digging = hard to spot
  copsSee=false;
  for(const c of cops){
    c.cx=Math.round(c.x/T);c.cy=Math.round(c.y/T);
    c.dist=Math.abs(c.cx-ptx)+Math.abs(c.cy-pty);
    if(c.tend){c.sees=false;continue;} // busy with a fallen buddy
    // guards: only inside their view cone (fooled by a uniform). dogs: sniff all around, short range
    if(c.dog&&dogTreatT>0){c.sees=false;continue;} // busy with a treat
    const nose=k9Nose(c,c.dist),looking=c.dog||nose||(!c.guard&&!c.cone)||facesTile(c,ptx,pty),fooled=c.guard&&disguiseT>0&&!nose;
    c.sees=!(c.blind>0)&&!P.hidden&&looking&&!fooled&&c.dist<=(c.dog?3:c.k9?sightR+3:sightR)&&los(c.cx,c.cy,ptx,pty);
    if(c.k9&&c.sees&&!C.k9Tip&&!C.race){C.k9Tip=true;beep(320,.08,'square',.06,-120);beep(300,.1,'square',.06,-120,.14);say('WOOF! A K9 UNIT SAW YOU! IT IS FAST,|AND THE DOG SMELLS YOU UP CLOSE. HIDE!',3.5);}
    c.fresh=false;
    if(c.sees)copsSee=true;
  }
  // the flashlight beam attracts cops from far away, even around corners
  for(const c of cops){
    if(c.state==='investigate'){c.invT-=dt;if(c.invT<=0)c.state='patrol';}
    if(flashOn&&!P.hidden&&c.state!=='chase'&&!(c.blind>0)&&c.dist<=(impossibleMode?30:18)){
      if(c.state!=='investigate')c.alert=0;
      c.state='investigate';c.inv=pGoal;c.invT=6;
    }
  }
  if(copsSee){
    lastSeenG=pGoal;
    // spotter radios nearby units; at most 5 cops chase at once
    const team=cops.filter(c=>!(c.dog&&dogTreatT>0)&&(c.sees||c.state==='chase'||c.dist<=(impossibleMode?24:14))).sort((a,b)=>a.dist-b.dist).slice(0,impossibleMode?12:5);
    let newAlarm=false;
    for(const c of team){if(c.state!=='chase'){c.alert=1.2;newAlarm=true;}c.state='chase';c.lost=(impossibleMode?8:4)-.6*upLvl('coolhead');c.fresh=true;} // COOL HEAD: they give up sooner
    if(newAlarm)sfx.alarm();
  }
  for(const c of cops)if(c.state==='chase'&&!c.fresh){
    if(P.hidden)c.lost=Math.min(c.lost,impossibleMode?4:2);
    c.lost-=dt;if(c.lost<=0)c.state='patrol';
  }
  cops.filter(c=>c.state==='chase').sort((a,b)=>a.dist-b.dist).forEach((c,i)=>c.role=i);
  for(const c of cops){
    c.alert-=dt;
    if(tendStep(c,dt))continue;
    if(c.blind>0){c.blind-=dt;c.shootT=Math.max(c.shootT,.8);
      if(c.confused){c.spinT-=dt;if(c.spinT<=0){c.spinT=.45;const d=DIRS[rI(4)];c.dx=d[0];c.dy=d[1];}
        if(c.blind<=0){c.confused=false;if(c.noiseAt){c.state='investigate';c.inv=c.noiseAt;c.invT=5;}}}
      continue;}
    if(copDodge(c,dt,bolts.concat(toms)))continue;
    if((!c.guard||c.swat||c.armed||c.k9||impossibleMode)&&!c.dog&&c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist<=(impossibleMode?18:8)&&c.dist>0){
      c.shootT-=dt;
      if(c.shootT<=0){
        c.shootT=(c.swat?1.1:1.8-.2*lvl)*(impossibleMode?.5:1);const vx=Math.sign(ptx-c.cx),vy=Math.sign(pty-c.cy);c.dx=vx;c.dy=vy;
        bullets.push({x:c.x+8+vx*6,y:c.y+8+vy*6,vx:vx*(impossibleMode?240:155),vy:vy*(impossibleMode?240:155),life:impossibleMode?2.2:1.6,own:c});sfx.shoot();
      }
    }else c.shootT=Math.max(c.shootT,c.swat?.35:.8); // SWAT aim fast
    const sp=(impossibleMode?1.25:1)*(1+tradeoff('copspd'))*(c.dog?(c.state==='chase'?68:46):c.k9&&c.state==='chase'&&!(dogTreatT>0)?70+3*lvl:c.state==='chase'?58+4*lvl:c.state==='investigate'?50:38); // guards walk at normal speed to check the digging noise
    // SWAT with a clear shot hold position and fire instead of charging
    const holding=c.swat&&c.sees&&(c.cx===ptx||c.cy===pty)&&c.dist>1&&c.dist<=6;
    if(c.moving)stepMover(c,sp,dt);
    if(!c.moving&&!holding){
      let nx=null;
      if(c.state==='chase'&&lastSeenG){
        const tg=chaseTarget(c,ptx,pty);
        nx=bfsStep(c.tx,c.ty,tg[0],tg[1])||bfsStep(c.tx,c.ty,lastSeenG[0],lastSeenG[1]);
      }else if(c.state==='investigate'){
        nx=bfsStep(c.tx,c.ty,c.inv[0],c.inv[1]);
        if(!nx)c.invT=Math.min(c.invT,1.5); // reached the light: look around, then give up
      }else if(c.state!=='chase')nx=patrolNext(c);
      if(nx&&carComing(nx[0],nx[1]))nx=sideStep(c); // look both ways: a car is in the way, so go another way (or wait if there's none)
      if(nx){c.dx=nx[0]-c.tx;c.dy=nx[1]-c.ty;c.ttx=nx[0];c.tty=nx[1];c.moving=true;}
    }
    // pickpocket: any guard who isn't FACING you can be robbed from the next tile
    if(c.guard&&!P.hidden&&!facesTile(c,ptx,pty)&&(c.wallet>0||c.hasKeyCard)&&Math.abs(c.x-P.x)<18&&Math.abs(c.y-P.y)<18){
      if(c.wallet>0){lootGain(c.wallet,c.x+8,c.y-4);c.wallet=0;stat('pick',1,50,'pick');}
      if(c.hasKeyCard){c.hasKeyCard=false;hasKey=true;sfx.key();floatTxt(c.x+8,c.y-14,keyName(),'#5ff');say(isIsland()?'YOU LIFTED THE BOAT KEY!|NOW SNEAK TO THE DOCK':"YOU LIFTED THE WARDEN'S KEYCARD!|NOW SNEAK TO THE EXIT GATE",4);}
    }
    const reach=P.inDoor?18:10,aware=(!c.guard&&!c.cone)||c.sees||(c.state==='chase'&&disguiseT<=0);
    if(aware&&!P.hidden&&!(c.blind>0)&&!(c.dog&&dogTreatT>0)&&Math.abs(c.x-P.x)<reach&&Math.abs(c.y-P.y)<reach)
      {const h0=hp;hurtCity(c.dog?'CAUGHT BY A GUARD DOG!':c.k9?'CAUGHT BY A K9 UNIT!':c.guard?'CAUGHT BY A GUARD!':'TACKLED BY A COP!');
       if(hp<h0){c.blind=1.5;c.slip=true;c.confused=false;c.state='patrol';floatTxt(P.x+8,P.y-8,'WRIGGLED FREE!','#ffb000');}}
  }
  updDownCops(dt);
  // --- cop bullets
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    const btx=Math.floor(b.x/T),bty=Math.floor(b.y/T);
    const inMyDoor=P.inDoor&&btx===ptx&&bty===pty; // a lit doorway doesn't stop bullets
    if(!P.hidden&&P.inv<=0&&Math.hypot(b.x-(P.x+8),b.y-(P.y+8))<12&&!(b.x>P.x+3&&b.x<P.x+13&&b.y>P.y+2&&b.y<P.y+15))nearMiss(P.x+8,P.y-6);
    if(!P.hidden&&(inMyDoor||(b.x>P.x+3&&b.x<P.x+13&&b.y>P.y+2&&b.y<P.y+15))){b.life=0;if(Math.random()<.1*upLvl('clover')){floatTxt(P.x+8,P.y-8,'LUCKY MISS!','#7dff7d');continue;}hurtCity('SHOT BY POLICE!');continue;}
    if(copHitByBullet(b)){b.life=0;continue;}
    if(solidCity(ct(btx,bty)))b.life=0;
  }
  bullets=bullets.filter(b=>b.life>0);
  // --- player stun bolts
  for(const b of bolts){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(solidCity(ct(Math.floor(b.x/T),Math.floor(b.y/T))))b.life=0;
    if(b.life<=0)continue;
    if(hitRunner(b.x,b.y,true)){b.life=0;continue;}
    for(const c of cops)if(Math.abs(c.x+8-b.x)<9&&Math.abs(c.y+8-b.y)<9){zapCop(c);b.life=0;break;}
  }
  bolts=bolts.filter(b=>b.life>0);
  for(const t of toms){
    t.x+=t.vx*dt;t.y+=t.vy*dt;t.life-=dt;
    if(t.coco){ // coconut: flies, BONKs a guard it hits, and the THUD where it lands draws guards over
      const wall=solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)));
      for(const c of cops)if(!t.hit.has(c)&&!c.dog&&Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){t.hit.add(c);c.blind=2.5;c.slip=true;c.state='patrol';floatTxt(c.x+8,c.y-4,'BONK!','#ffb000');beep(180,.15,'square',.06,-80);t.life=0;}
      if(wall||t.life<=0){if(wall){t.x-=t.vx*dt;t.y-=t.vy*dt;}t.life=0;beep(90,.18,'triangle',.08,-30);floatTxt(t.x,t.y-6,'THUD','#c8a070');
        const tx0=Math.round(t.x/T),ty0=Math.round(t.y/T),spot=nearestWalk(tx0,ty0);let n=0;
        for(const c of cops)if(c.guard&&!(c.blind>0)&&Math.abs(c.tx-tx0)+Math.abs(c.ty-ty0)<=10){
          c.blind=3;c.confused=true;c.slip=false;c.state='patrol';c.alert=0;c.noiseAt=spot;c.spinT=0;n++;}
        if(n)say('THUD! '+n+(n>1?' GUARDS ARE':' GUARD IS')+' CONFUSED!',1.8);
        for(const gl of C.gulls||[])if(gl.state==='sit'&&Math.hypot(gl.x-t.x,gl.y-t.y)<40)spookGulls(gl);}
      continue;
    }
    if(solidCity(ct(Math.floor(t.x/T),Math.floor(t.y/T)))){t.life=0;if(!t.soap)splats.push({x:t.x-t.vx*dt,y:t.y-t.vy*dt,t:1.5});sfx.splat();}
    if(t.life<=0)continue;
    if(!t.soap&&hitRunner(t.x,t.y,false)){t.life=0;splats.push({x:t.x,y:t.y,t:1.5});continue;}
    for(const c of cops)if(!t.hit.has(c)&&Math.abs(c.x+8-t.x)<9&&Math.abs(c.y+8-t.y)<9){
      t.hit.add(c);c.blind=hardMode?3:4;if(!t.soap)stat('splat',1,100,'splat');c.slip=!!t.soap;c.alert=0;c.state='patrol';sfx.splat();
      floatTxt(c.x+8,c.y-4,t.soap?'SLIP!':'SPLAT!',t.soap?'#cff':'#f55');
    }
  }
  toms=toms.filter(t=>t.life>0);
  if(C.cams)for(const cm of C.cams){
    if(cm.tower&&C.mounds&&C.digT>0)cm.ph+=dt*.15; // towers sweep a little faster while you dig
    cm.ang=cm.tower?cm.ph+cityTime*.55:cm.base+Math.sin(cityTime*.8+cm.ph)*1.05;cm.cool-=dt;
    const vx=P.x+8-cm.x,vy=P.y+8-cm.y,d=Math.hypot(vx,vy);
    let diff=Math.atan2(vy,vx)-cm.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    const dark=pdark&&!flashOn;
    if(cm.cool<=0&&d<cm.range&&Math.abs(diff)<cm.half&&!P.hidden&&disguiseT<=0&&!dark&&(cm.noLos||los(cm.tx,cm.ty,ptx,pty))){
      cm.cool=4;sfx.alarm();say(cm.lighthouse?'THE LIGHTHOUSE BEAM FOUND YOU!|GUARDS ARE ON THEIR WAY':cm.tower?'A SEARCHLIGHT SPOTTED YOU!|GUARDS ARE ON THEIR WAY':'A CAMERA SPOTTED YOU!|GUARDS ARE ON THEIR WAY',2.5);
      for(const c of cops)if(c.state!=='chase'&&!(c.blind>0)&&c.dist<=(impossibleMode?30:18)){c.state='investigate';c.inv=pGoal;c.invT=8;c.alert=1;}
    }
  }
  for(const sp of splats)sp.t-=dt;splats=splats.filter(sp=>sp.t>0);
  cam.x=clamp(P.x+8-VW/2,0,WW-VW);cam.y=clamp(P.y+8-(VH+12)/2,-12,WH-VH);
}

function updShop(){
  const L=shopList();
  if(pressed.up)shopSel=(shopSel+L.length-1)%L.length,sfx.click();
  if(pressed.down)shopSel=(shopSel+1)%L.length,sfx.click();
  if(pressed.pause||pressed.use){closeShop();return;}
  if(pressed.start||pressed.fire){
    const it=L[shopSel];
    if(it.name==='LEAVE'){closeShop();return;}
    const c0=it.cost(),cost=c0===null?null:Math.round(c0*(impossibleMode?3:1)*(1-.1*upLvl('coupon'))*(1+tradeoff('price'))); // IMPOSSIBLE: 3x // COUPON BOOK (null = can't buy it right now)
    if(cost===null){sfx.deny();return;}
    if(cash<cost){sfx.deny();say('NOT ENOUGH CASH! NEED $'+cost,1.6);return;}
    cash-=cost;spent+=cost;const m=it.buy();sfx.buy();stat('spent',cost,100000,'spend');
    closeShop();
    if(C.trader&&C.trader.machine)say(m+'|*CLUNK* THE MACHINE DROPS IT OUT',3);
    else if(C.trader&&C.trader.store)say(m+'|THE CLERK SLIDES IT UNDER THE GLASS',3);
    else if(C.trader&&C.trader.drone)say(m+'|A DRONE ZIPS IN AND DROPS IT OFF',3);
    else if(C.trader&&C.trader.corner)say(m+'|THE SHOPKEEPER BAGS IT UP',3);
    else if(C.trader){moveTrader(18);say(m+(isJail()?'|THE TRADER SNEAKS TO ANOTHER CELL':'|THE DEALER SLIPS AWAY...'),3.5);}
    else{truck.mode='leave';truck.t=3.5;say(m+'|THE TRUCK DRIVES OFF...',3.5);}
  }
}

function startTopRace(n){
  RSTATS={lead:null,fin:null,loot:[0,0],steals:[0,0],hits:[0,0]};
  startNight(n);helpOpen=false;C.race=true;flashOn=false;showMap=false;
  const kind=n===1?'key':n===2?'warden':n===3?'pieces':n===4?'courier':n===5?'mounds':'boxes';
  const mk=(tx,ty,vinnie)=>({tx,ty,x:tx*T,y:ty*T,ttx:tx,tty:ty,dx:0,dy:1,dir:'down',moving:false,anim:0,hidden:false,inDoor:false,inv:1.5,stun:0,
    pieces:0,got:[],loot:0,vinnie,lastDir:null,msg:'',msgT:0,hp:MAXHP,sx:tx,sy:ty,digT:0,cutT:0,cash:0,shop:null,shopBlock:false,boostT:0,disguiseT:0,rapidT:0});

  if(kind==='pieces'){ // 5 blueprint pieces: first to 3
    const far=(x,y)=>Math.abs(x-s1[0])+Math.abs(y-s1[1])>16&&C.pieces.every(k=>Math.abs(k.x-x)+Math.abs(k.y-y)>14)&&!picks.some(k=>k.x===x&&k.y===y);
    for(let tr=0;tr<5000&&C.pieces.length<5;tr++){const x=rI(CW),y=rI(CH);if((C.g[y*CW+x]===TR||C.g[y*CW+x]===TS)&&far(x,y)){const o={x,y,type:'piece',val:0,ph:Math.random()*6,got:false};picks.push(o);C.pieces.push(o);}}
    need=3;total=5;}
  if(kind==='mounds'){ // 5 buried boat parts: first to dig up 3
    for(let tr=0;tr<6000&&C.mounds.length<5;tr++){const x=rI(CW),y=rI(CH),t=C.g[y*CW+x];
      if((t===TS||t===TA)&&Math.abs(x-s1[0])+Math.abs(y-s1[1])>=12&&C.mounds.every(m=>Math.abs(m.x-x)+Math.abs(m.y-y)>=10)&&!picks.some(k=>k.x===x&&k.y===y))C.mounds.push({x,y,part:C.mounds.length%4,val:0,dug:false});}
    picks=picks.filter(k=>k.type!=='coco');need=3;total=5;}

  if(kind==='boxes'){need=2;total=C.boxes.length;}
  GRACE={pl:[P,p2],other:null,winner:null,winT:0,kind,need,total};
  for(const c of cops)if(Math.abs(c.tx-s1[0])+Math.abs(c.ty-s1[1])<14)c.state='patrol';
  showHelp();
}

const shopName=()=>!C.trader?'PINK SHOP TRUCK':C.trader.machine?'SNACK MACHINE':C.trader.store?'COMMISSARY':C.trader.drone?'DRONE DELIVERY':C.trader.truck?'PINK SHOP TRUCK':C.trader.corner?'CORNER STORE':'BLACK MARKET DEALER';
function updRaceShop(pl,i,K){
  const n=RSHOP.length+1,sh=pl.shop;
  if(rawPressed[K.up]){sh.sel=(sh.sel+n-1)%n;sfx.click();}
  if(rawPressed[K.down]){sh.sel=(sh.sel+1)%n;sfx.click();}
  const leave=()=>{pl.shop=null;pl.shopBlock=true;pl.hidden=false;pl.inv=Math.max(pl.inv,1);sfx.click();};
  if(hit1(K.wh)||rawPressed[K.left]||rawPressed[K.right]){leave();return;}
  if(hit1(K.thr)){
    if(sh.sel===RSHOP.length){leave();return;}
    const it=RSHOP[sh.sel];if(pl.cash<it.cost){sfx.deny();grSay(pl,'NOT ENOUGH CASH!|NEED $'+it.cost,1.5);return;}
    const m=it.buy(pl);if(!m){sfx.deny();grSay(pl,'YOUR HEARTS ARE FULL',1.5);return;}
    pl.cash-=it.cost;sfx.buy();grSay(pl,m,2);}
}

const GR_KEYS=[{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',thr:['KeyQ'],wh:['KeyE'],zap:['KeyF']},{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',thr:['Enter','NumpadEnter'],wh:['ShiftRight'],zap:['Slash','Period']}];

// put a collected objective back where it came from
function dropObj(w){if(w.kind==='pick'&&w.k.type==='key'){const kp=keyPick;keyPick=w.k;relocateKey(GRACE.pl.map(p=>[Math.round(p.x/T),Math.round(p.y/T)]));keyPick=kp;}else if(w.kind==='pick')w.k.got=false;else if(w.kind==='warden')w.k.hasKeyCard=true;else if(w.kind==='runner')placeRunner(GRACE.pl.map(p=>[Math.round(p.x/T),Math.round(p.y/T)]),14,30);else if(w.kind==='mound')w.k.dug=false;else if(w.kind==='box')w.k.cut=false;}
function grCaught(pl,why,c){
  if(pl.inv>0||godMode)return;
  pl.inv=2.2;pl.hitT=1;beep(pl.vinnie?300:200,.3,'sawtooth',.06,-120); // no freeze: while you blink you can run for it
  if(c){c.blind=2.5;c.slip=true;c.state='patrol';}
  pl.hp-=3;pl.hurt=.45;pl.digT=0;pl.cutT=0;
  let dropped=false;const keyRace=GRACE.need===1;

    grBanner(pname(pl.vinnie?1:0)+(GRACE.kind==='boxes'?' LOST A POWER BOX!':' DROPPED THE '+OBJN[GRACE.kind]+'!'+(GRACE.kind==='key'?' THE COPS HID IT':'')),'#ff6b6b');}
  const obj=GRACE.kind==='boxes'?'A POWER BOX TURNED BACK ON!':'DROPPED THE '+OBJN[GRACE.kind]+'!';
  if(pl.hp<=0){ // out of hearts: back to the start
    pl.hp=MAXHP;Object.assign(pl,{tx:pl.sx,ty:pl.sy,ttx:pl.sx,tty:pl.sy,x:pl.sx*T,y:pl.sy*T,moving:false,stun:0,inv:2});
    grSay(pl,'OUT OF HEARTS!|BACK TO THE START',3);return;}
  floatTxt(pl.x+8,pl.y-8,dropped?(GRACE.kind==='boxes'?'POWER BACK ON!':'DROPPED IT!'):'-1 HEART','#ff6b6b');
  grSay(pl,why+'|-1 HEART'+(dropped?'. '+obj:''),3);
}
const OPEN_TXT={pieces:['ALL PLANS FOUND! VAULT WING OPEN. RACE!','ALL PLANS FOUND!|BOTH CAN GO IN. RACE!'],
  mounds:['ALL PARTS DUG UP! THE BOAT IS READY. RACE!','ALL PARTS DUG UP!|BOTH CAN GO. RACE!'],

function updGalRace(dt){
  cityTime+=dt;flashOn=false;const G=GRACE;stormTick(dt);if(C.runner)updRunner(dt);if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(G.winner){G.winT-=dt;if(G.winT<=0&&!trans){const w=G.winner,hps=G.pl.map(p=>Math.min(MAXHP,p.hp+3)),zs=G.pl.map(p=>p.zaps||0);startTrans(()=>{startInterior(w,hps);if(RACE&&state==='bank'){RACE.p1.zaps=zs[0];RACE.p2.zaps=zs[1];}});G.winT=99;}return;}
  G.pl.forEach((pl,i)=>{
    const K=GR_KEYS[i],o=G.pl[1-i];pl.inv-=dt;pl.hurt=(pl.hurt||0)-dt;pl.thrCD=(pl.thrCD||0)-dt;pl.whCD=(pl.whCD||0)-dt;pl.stealCD=(pl.stealCD||0)-dt;pl.stun-=dt;pl.hitT=(pl.hitT||0)-dt;pl.zapCD=(pl.zapCD||0)-dt;pl.msgT-=dt;
    pl.boostT-=dt;pl.disguiseT-=dt;pl.rapidT-=dt;

    for(const d of ['up','down','left','right'])if(rawPressed[K[d]])pl.lastDir=d;
    let want=pl.lastDir&&rawKeys[K[pl.lastDir]]?pl.lastDir:['up','down','left','right'].find(d=>rawKeys[K[d]]);
    if(pl.stun>0)want=null;
    const ready=grReady(pl);
    if(pl.moving){
      if(want){const [wx,wy]=DV[want];if(wx===-pl.dx&&wy===-pl.dy){const ox=pl.tx,oy=pl.ty;pl.tx=pl.ttx;pl.ty=pl.tty;pl.ttx=ox;pl.tty=oy;pl.dx=wx;pl.dy=wy;pl.dir=want;}}
      if(stepMover(pl,74+(pl.boostT>0?30:0),dt)&&ct(pl.tx,pl.ty)===TKD){G.winner=i?'p2':'p1';G.winT=2;sfx.win();return;}
    }
    if(!pl.moving&&want){
      const [dx,dy]=DV[want];pl.dir=want;pl.dx=dx;pl.dy=dy;const nx=pl.tx+dx,ny=pl.ty+dy,t=ct(nx,ny);

      else if(t===TKD||walkC(nx,ny)||t===TD){pl.ttx=nx;pl.tty=ny;pl.moving=true;}
    }
    const ptx=Math.round(pl.x/T),pty=Math.round(pl.y/T);
    pl.inDoor=ct(ptx,pty)===TD;pl.hidden=pl.inDoor;pl.ptx=ptx;pl.pty=pty;
    // step onto the shop to open your own menu (step off before it opens again)
    const atShop=C.trader?ptx===C.trader.tx&&pty===C.trader.ty:truck.mode==='park'&&cars.includes(truck)&&pl.x+8>truck.x-9&&pl.x+8<truck.x+truck.w+9&&pl.y+8>truck.y-9&&pl.y+8<truck.y+truck.h+9;
    if(!atShop)pl.shopBlock=false;
    if(atShop&&!pl.shopBlock&&pl.stun<=0){const t=C.trader||{tx:Math.round(pl.x/T),ty:Math.round(pl.y/T)};if(!walkP(t.tx,t.ty)&&!C.trader){t.tx=pl.tx;t.ty=pl.ty;}Object.assign(pl,{tx:t.tx,ty:t.ty,ttx:t.tx,tty:t.ty,x:t.tx*T,y:t.ty*T,moving:false});pl.shop={sel:0};pl.hidden=true;sfx.coin();return;}
    // THROW a rotten tomato: stuns the other thief (or blinds a guard)

      else{pl.zaps--;pl.zapCD=.5;sfx.zapGun();const a=aimAng(pl.x+8,pl.y+8,200,pl.dx,pl.dy,(o.hidden?[]:[o]).concat(runnerTarget()));bolts.push({x:pl.x+8,y:pl.y+8,vx:Math.cos(a)*240,vy:Math.sin(a)*240,life:.9,owner:i});}}
    // WHISTLE: guards near the other thief go to check on them
    if(hit1(K.wh)){if(pl.whCD>0){sfx.deny();grSay(pl,'WHISTLE IN '+Math.ceil(pl.whCD)+'S',1);}else{pl.whCD=10;beep(1800,.12,'sine',.06,600);beep(2400,.18,'sine',.05,-400,.13);let n=0;

  // tomatoes

  }

      c.shootT-=dt;if(c.shootT<=0){c.shootT=(c.swat?1.1:1.8)*(impossibleMode?.5:1);const vx=Math.sign(seen.ptx-c.cx),vy=Math.sign(seen.pty-c.cy);c.dx=vx;c.dy=vy;

function updRace(dt){

  if(RACE.winner){RACE.winT-=dt;if(RACE.winT<=0){RES=Object.assign({},RSTATS,{fin:RACE.winner});state='results';storyT=0;sfx.win();}return;}
  // shared: broken glass grows back when nobody is standing on it
  for(const i of B.glassIdx||[]){
    if(B.crack[i]>0){B.crack[i]-=dt;if(B.crack[i]<=0){B.crack[i]=0;B.g[i]=0;B.broken[i]=4;beep(2400,.15,'sawtooth',.04,-1800);}}
    else if(B.broken[i]>0){B.broken[i]-=dt;if(B.broken[i]<=0){const gx=(i%B.W)*T,gy=((i/B.W)|0)*T,on=p=>p.x<gx+T&&p.x+p.w>gx&&p.y<gy+T&&p.y+p.h>gy;
      if(on(RACE.p1)||on(RACE.p2))B.broken[i]=.2;else B.g[i]=3;}}}
  if(B.shots)updShots(dt);
  if(B.sensors)sideWorld(dt);
  const i1={left:rawKeys.KeyA,right:rawKeys.KeyD,up:rawKeys.KeyW,down:rawKeys.KeyS,upP:rawPressed.KeyW,downP:rawPressed.KeyS,thr:rawPressed.KeyQ,zap:rawPressed.KeyF};
  const i2={left:rawKeys.ArrowLeft,right:rawKeys.ArrowRight,up:rawKeys.ArrowUp,down:rawKeys.ArrowDown,upP:rawPressed.ArrowUp,downP:rawPressed.ArrowDown,thr:rawPressed.Enter||rawPressed.NumpadEnter,zap:rawPressed.Slash||rawPressed.Period};
  const r1=racerStep(RACE.p1,i1,dt),r2=racerStep(RACE.p2,i2,dt);
  for(const t of RACE.toms){t.x+=t.vx*dt;t.life-=dt;
    if(SOL(tb(Math.floor(t.x/T),Math.floor(t.y/T)))){t.life=0;sfx.splat();continue;}
    const v=t.owner?RACE.p1:RACE.p2;
    if(v.inv<=0&&t.x>v.x&&t.x<v.x+v.w&&t.y>v.y&&t.y<v.y+v.h){t.life=0;v.slow=1.6;RSTATS.hits[t.owner]++;sfx.splat();floatTxt(v.x+5,v.y-6,'SPLAT! SLOWED','#f55');}}
  RACE.toms=RACE.toms.filter(t=>t.life>0);
  for(const z of RACE.zaps||[]){z.x+=z.vx*dt;z.life-=dt;if(SOL(tb(Math.floor(z.x/T),Math.floor(z.y/T)))){z.life=0;continue;}
    const v=z.owner?RACE.p1:RACE.p2;if(v.inv<=0&&z.x>v.x&&z.x<v.x+v.w&&z.y>v.y&&z.y<v.y+v.h){z.life=0;v.stunT=1.4;RSTATS.hits[z.owner]++;sfx.zap();floatTxt(v.x+5,v.y-6,'ZAPPED! STUNNED','#7ff');}}
  if(RACE.zaps)RACE.zaps=RACE.zaps.filter(z=>z.life>0);
  if(r1==='win'||r2==='win'){RACE.winner=r1==='win'?'p1':'p2';RACE.winT=2.5;sfx.win();}
}
// 2-player vault races: split TOP / BOTTOM (Vinae on top, Vinnie below), so each of you sees the full width ahead
const RH=112; // height of each half
function drawRace(){
  const views=[[RACE.p1,RACE.p2,0],[RACE.p2,RACE.p1,RH]],goal=B.kind==='museum'?142*T:B.vaultX;
  for(const [p,o,vy] of views){
    BP=p;RACE.other=o;
    p.camLead=approach(p.camLead||0,40*(p.face||1),2);cam.x=clamp(p.x+5-VW/2+p.camLead,0,B.W*T-VW);const ty=clamp(p.y+11-86,0,B.H*T-RH);p.camY=p.camY===undefined||Math.abs(p.camY-ty)>120?ty:p.camY+(ty-p.camY)*.18;cam.y=Math.round(p.camY); // look a bit ahead of where you're running
    ctx.save();ctx.beginPath();ctx.rect(0,vy,VW,RH);ctx.clip();ctx.translate(0,vy);drawBank();
    for(const t of RACE.toms){const x=Math.round(t.x-cam.x),y=Math.round(t.y-cam.y);ctx.fillStyle='#c81e1e';ctx.fillRect(x-2,y-2,5,5);ctx.fillStyle='#ff6b5b';ctx.fillRect(x-1,y-1,2,2);ctx.fillStyle='#3a8a2a';ctx.fillRect(x,y-3,2,1);}
    for(const z of RACE.zaps||[]){const x=Math.round(z.x-cam.x),y=Math.round(z.y-cam.y);ctx.fillStyle='rgba(120,255,255,.45)';ctx.fillRect(x-5,y-3,10,6);ctx.fillStyle='#fff';ctx.fillRect(x-2,y-1,5,2);}
    if(p.stunT>0)txt('STUNNED!',VW/2,30,'#7ff','center');else if(p.slow>0)txt('SLOWED!',VW/2,30,'#ff6b6b','center');
    if(p.zaps>0)txt('ZAP x'+p.zaps,VW-34,2,'#7ff','right',6);
    if(p.hurt>0){ctx.fillStyle=`rgba(255,0,0,${p.hurt*.6})`;ctx.fillRect(0,0,VW,RH);}
    // this player's own bar: name, hearts, how far along they are
    const me=p===RACE.p1,col=me?'#ffffff':'#c8a070',label=me?'VINAE':'VINNIE',hx=4+label.length*8+4,bx=hx+MAXL*8+6,bw=VW-bx-30,f=clamp(p.x/goal,0,1),of=clamp(o.x/goal,0,1);
    ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,VW,12);txt(label,4,2,col);for(let k=0;k<MAXL;k++)heart(hx+k*8,3,clamp(p.hp/3-k,0,1));
    ctx.fillStyle='#223';ctx.fillRect(bx,4,bw,4);ctx.fillStyle=col;ctx.fillRect(bx,4,Math.round(bw*f),4);ctx.fillStyle=me?'#c8a070':'#ffffff';ctx.fillRect(bx+Math.round(bw*of)-1,2,2,8); // the other thief's spot
    txt(f>=of?'1ST':'2ND',VW-4,2,f>=of?'#7dff7d':'#ff6b6b','right');
    if(p.wait>0){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(VW/2-50,38,100,34);txt('WAIT...',VW/2,44,'#ff6b6b','center');txt(String(Math.ceil(p.wait)),VW/2,58,'#fff','center');}
    ctx.restore();
  }
  BP=RACE.p1;RACE.other=null;
  ctx.fillStyle='#000';ctx.fillRect(0,RH-2,VW,4);ctx.fillStyle='#ffd400';ctx.fillRect(0,RH-1,VW,2);
  if(RACE.winner){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(30,86,260,52);ctx.fillStyle='#ffd400';ctx.fillRect(30,86,260,2);ctx.fillRect(30,136,260,2);
    txt(RACE.winner==='p1'?(B.kind==='museum'?'VINAE GOT THE MOONSTONE!':'VINAE CRACKED THE VAULT!'):'VINNIE GOT THERE FIRST!',VW/2,98,RACE.winner==='p1'?'#7dff7d':'#ff6b6b','center');
    txt(RACE.winner==='p1'?'VINAE WINS!':'VINNIE WINS!',VW/2,116,'#fff','center');}
  if(msgT>0){const lines=msg.split('|'),w=Math.max(...lines.map(l=>l.length))*8+12,h=lines.length*10+6;
    ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect((VW-w)/2,RH-h/2,w,h);lines.forEach((l,i)=>txt(l,VW/2,RH-h/2+4+i*10,'#ffd400','center'));}
}

function helpKey(){
  if(state==='bank'&&sideMode)return 'side';
  if(state==='bank'&&dailyMode)return 'daily';
  if(state==='bank'&&B&&B.race)return 'race';
  if(state==='lock'&&LK&&LK.race)return 'lockrace';
  if(state==='boat'&&BTS&&BTS.race)return 'boatrace';
  if(state==='title'||!C)return 'title';
  if(state==='lock')return 'lock';if(state==='boat')return 'boat';
  if(state==='city'&&C&&C.race&&GRACE)return 'race_'+GRACE.kind;
  if(state==='lock'&&LK&&LK.race)return 'lockrace';
  if(state==='boat'&&BTS&&BTS.race)return 'boatrace';
  if(state==='bank')return B&&B.kind==='museum'?'museum':isGauntlet()?'gauntlet':isStorm()?'station':'bank';
  if(isJail())return isIsland()?'island':'jail';
  return isGallery()?'gallery':isRoof()?'roof':isStorm()?'storm':'city';
}

// every night starts in a random hiding spot (a green door), far from the police, the key and the bank
function startHidden(){
  const far=[C.door||[BK0X+3,BK1Y]];if(C.key)far.push(...(C.keys||[C.key]));if(C.pieces)far.push(...C.pieces.map(k=>[k.x,k.y]));
  const ok=[],okish=[];
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){if(C.g[y*CW+x]!==TD)continue;
    let cd=99;for(const c of cops)cd=Math.min(cd,Math.abs(x-Math.round(c.x/T))+Math.abs(y-Math.round(c.y/T)));
    let fd=99;for(const [fx,fy] of far)fd=Math.min(fd,Math.abs(x-fx)+Math.abs(y-fy));
    if(cd>=8&&fd>=14)ok.push([x,y]);else if(cd>=5)okish.push([x,y]);}
  const sp=ok.length?pick(ok):okish.length?pick(okish):null;if(!sp)return;
  Object.assign(P,{tx:sp[0],ty:sp[1],ttx:sp[0],tty:sp[1],x:sp[0]*T,y:sp[1]*T,moving:false,inDoor:true,hidden:true});
}

    if(n===2)cards=upLvl('cardpack');dogTreatT=20*upLvl('treats');boostT=10*upLvl('energy');} // CARD SHARK, DOG BISCUITS, ENERGY BARS
  night=n;nightStolen=0;nightHurt=0;hasKey=false;flashOn=false;battery=maxBattery();hp=MAXHP;showMap=false;B=null;toms=[];splats=[];

  if(!twoP&&!escapeNight(n)){if(upLvl('kit')>=1)tomatoes=Math.max(tomatoes,10);if(upLvl('kit')>=2&&!weapon){weapon='stun';ammo=Math.max(ammo,6);}if(upLvl('kit')>=3&&weapon)ammo=Math.max(ammo,upLvl('kit')>=4?20:12);if(upLvl('kit')>=4)tomatoes=Math.max(tomatoes,20);tomatoes+=5*upLvl('tomatobag');} // STARTER KIT + TOMATO BAG
  if(!escapeNight(n)){
    setDims(9,7); // (night 3 replaces this with its own museum floor plan)

  }else{
    setDims(9,7);initJail(); // same size as the Night 1 city

  }

function update(dt){
  gameT+=dt;
  if(trans&&trans.fired&&helpOpen){trans.t+=dt;if(trans.t>=1)trans=null;} // a help card that pops up mid-fade must not freeze the fade on black
  if(helpOpen){helpT+=dt;if(helpT>.4&&(pressed.start||pressed.fire||pressed.help||pressed.pause)){helpOpen=false;sfx.click();}return;}
  if(showScores){if(pressed.start||pressed.fire||pressed.scores||pressed.pause){showScores=false;sfx.click();}return;}
  if(state==='title'){updTitle();return;}
  if(state==='menu'){updMenu();return;}
  if(state==='hideout'){updHideout();return;}
  if(state==='dailyres'){storyT+=dt;if((pressed.start||pressed.fire)&&storyT>.8){resetRun();state='menu';titleSel=5;sfx.click();}return;}
  if(state==='badges'){updBadges();return;}
  if(state==='backpack'){updBackpack();return;}
  if(state==='nightsel'){updNightSel();return;}
  if(state==='results'){storyT+=dt;if((pressed.start||pressed.fire)&&storyT>.8)resultsDone();return;}
  if(state==='win'){endT+=dt;if(endT>1){if(pressed.pause){resetRun();state='title';sfx.click();}else if(pressed.start||pressed.fire){if(twoP)newGame(true,hardMode&&!extremeMode,extremeMode&&!impossibleMode,impossibleMode);else if(retired){retired=false;resetRun();state='title';sfx.click();}else titlePick(0);}}return;} // the story loops: play the next heist
  if(state==='choose'){updChoose();return;}
  if(state==='story'){storyT+=dt;if(storyHideBtn()){if(pressed.down&&storySel!==1){storySel=1;sfx.click();}if(pressed.up&&storySel!==0){storySel=0;sfx.click();}
      if((pressed.start||pressed.fire)&&storyT>.6&&storySel===1){storySel=0;openHideout();return;}}else storySel=0;
    if((pressed.start||pressed.fire)&&storyT>.6){if(story.page<story.more.length){story.page++;storyT=0;sfx.click();}else{const cb=story.cb;story=null;cb();}}return;}
  if(trans){trans.t+=dt;if(!trans.fired&&trans.t>=.5){trans.fired=true;trans.cb();}if(trans.t>=1)trans=null;return;}
  if(shopOpen){updShop();return;}
  if(pressed.help&&(state==='city'||state==='bank'||state==='lock'||state==='boat')){showHelp();return;}
  if(pressed.map&&(state==='city'||state==='bank')){showMap=!showMap;sfx.click();} // 2 players: either one presses M, the race pauses while the map is open
  if(pressed.pause&&!showMap){paused=!paused;pauseSel=0;sfx.click();}
  else if(paused){
    if(pressed.up){pauseSel=(pauseSel+2)%3;sfx.click();}if(pressed.down){pauseSel=(pauseSel+1)%3;sfx.click();}
    if(pressed.start||pressed.fire){sfx.click();paused=false;
      if(pauseSel===1){cash=Math.max(0,cash-nightStolen);stolen=Math.max(0,stolen-nightStolen);
        if(sideMode)startSide(SIDES.indexOf(sideMode));else if(dailyMode)startDaily();else if(twoP)startTopRace(night);else startNight(night);}
      else if(pauseSel===2){resetRun();state='title';}}
  }
  if(showMap||paused)return;
  if(pressed.flash&&(state==='city'||state==='bank')&&!(C&&C.race)&&!(B&&B.race)){if(battery>0){flashOn=!flashOn;sfx.click();}else{say('FLASHLIGHT BATTERY IS DEAD!');sfx.deny();}}
  if(flashOn){battery-=dt*(1+tradeoff('drain'));if(battery<=0){battery=0;flashOn=false;say('FLASHLIGHT BATTERY IS DEAD!');}}
  else if(upLvl('solar')&&!twoP&&(state==='city'||state==='bank'))battery=Math.min(maxBattery(),battery+dt*.25*upLvl('solar')); // SOLAR CHARGER
  msgT-=dt;shake-=dt;hurtFlash-=dt;comboT-=dt;if(comboT<=0)comboN=0;nearCD-=dt;if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  for(const f of floaters)f.t-=dt*1.2;floaters=floaters.filter(f=>f.t>0);
  if(state==='city'&&C&&C.race)updGalRace(dt);else if(state==='city')updCity(dt);else if(state==='bank'&&B&&B.race)updRace(dt);else if(state==='bank')updBank(dt);else if(state==='lock')updLock(dt);else if(state==='boat')updBoat(dt);
}
// draw a screen designed for 320 pixels in the middle of a wider canvas; the sides get filled (no black bars)
const BOXOX=()=>(VW-320)>>1;
function boxed(fn,side){
  if(VW===320){fn();return;}const ox=BOXOX(),sv=VW;ctx.save();ctx.translate(ox,0);VW=320;try{fn();}finally{VW=sv;ctx.restore();}
  if(side){ctx.fillStyle=side;ctx.fillRect(0,0,ox,VH);ctx.fillRect(ox+320,0,VW-ox-320,VH);}
}
const NIGHT_BG='#07070f';

  if(state==='choose'){boxed(drawChoose,NIGHT_BG);return;}
  if(state==='menu'){boxed(()=>{drawMenu();if(helpOpen)drawHelp();},NIGHT_BG);return;}

    const move=e=>{const r=p.getBoundingClientRect(),R=r.width/2,dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R),m=Math.hypot(dx,dy),k=Math.min(m,R*.6);
      knob.style.transform='translate(calc(-50% + '+(m?dx/m*k:0)+'px),calc(-50% + '+(m?dy/m*k:0)+'px))';
      const ds=[];if(m>=R*.18)ds.push(Math.abs(dx)>=Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')); // one direction: whichever the push is closest to
      set1(ds);};
    const end=()=>{pid=null;set1([]);knob.style.transform='translate(-50%,-50%)';};
    p.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();
      if(state==='lock'){send('keydown',...keys.up);setTimeout(()=>send('keyup',...keys.up),60);return;}
      if(pid!==null)return;pid=e.pointerId;try{p.setPointerCapture(e.pointerId);}catch(_){}move(e);});
    p.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e);});
    for(const ev of ['pointerup','pointercancel','lostpointercapture'])p.addEventListener(ev,e=>{if(e.pointerId===pid)end();});
    p.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();});
    box.appendChild(p);sets[set].push(p);sticks.push({p,knob,end});};
  const sizeSticks=()=>{const px=SIZES[CTRL.size][1];for(const {p,knob} of sticks){p.style.width=p.style.height=px+'px';knob.style.width=knob.style.height=Math.round(px*.36)+'px';}};
  const ARROWS={up:['ArrowUp','ArrowUp'],down:['ArrowDown','ArrowDown'],left:['ArrowLeft','ArrowLeft'],right:['ArrowRight','ArrowRight']};
  const WASD={up:['w','KeyW'],down:['s','KeyS'],left:['a','KeyA'],right:['d','KeyD']};
  // one player: T (tomatoes / soap / coconuts), X (weapon; cards in the jail), M (map), F (flashlight)
  pad('solo',ARROWS,'left:0;right:0');stick('solo',ARROWS,'left:16px;bottom:16px');
  btn('solo','X','x','KeyX','right:16px;bottom:16px;width:64px;height:64px;font-size:20px');
  btn('solo','T','t','KeyT','right:90px;bottom:16px;width:64px;height:64px;font-size:20px');
  const mapBtns=[btn('solo','M','m','KeyM','right:16px;bottom:90px;width:64px;height:64px;font-size:20px')];
  btn('solo','F','f','KeyF','right:90px;bottom:90px;width:64px;height:64px;font-size:20px'); // flashlight
  // two players on one screen: Vinae drags on the left half, Vinnie on the right half
  pad('duo',WASD,'left:0;width:50%','VINAE');stick('duo',WASD,'left:16px;bottom:90px','VINAE');
  btn('duo','T','q','KeyQ','left:16px;bottom:16px;width:60px;height:60px;font-size:18px');btn('duo','X','f','KeyF','left:84px;bottom:16px;width:60px;height:60px;font-size:18px');
  pad('duo',ARROWS,'right:0;width:50%','VINNIE');stick('duo',ARROWS,'right:16px;bottom:90px','VINNIE');sizeSticks();
  btn('duo','T','Enter','Enter','right:84px;bottom:16px;width:60px;height:60px;font-size:18px');btn('duo','X','/','Slash','right:16px;bottom:16px;width:60px;height:60px;font-size:18px');
  mapBtns.push(btn('duo','M','m','KeyM','left:calc(50% - 22px);top:44px;width:44px;height:44px'));
  const tapKey=(k,c)=>{send('keydown',k,c);setTimeout(()=>send('keyup',k,c),60);};
  // one tap = one action: the app's first touch only sends touchstart, later ones send pointerdown too, so both are listened to and the second is ignored
  let lastTap=0;
  const goOn=e=>{if(!(helpOpen||showScores||['title','story','results','win','dailyres','badges'].includes(state)))return false;tapKey('Enter','Enter');return true;};
  const onTap=e=>{const now=performance.now();if(now-lastTap<350){e.preventDefault();return;}
    const pt=e.changedTouches?e.changedTouches[0]:e,ev={clientX:pt.clientX,clientY:pt.clientY};
    if(state==='story'&&!helpOpen&&!showScores&&menuBoxes()&&boxAt(ev)>=0){e.preventDefault();initAudio();lastTap=now;menuPick(0);return;} // the HIDEOUT button on the end-of-night screen
    let done=true;
    if(goOn(e)){}
    else if(menuBoxes()){const i=boxAt(ev);if(i>=0){menuHover(i);menuPick(i);}else if(state==='nightsel'||state==='menu')tapKey('Escape','Escape');else if(state==='bank'&&B&&B.boss&&B.boss.ui===2){B.boss.ui=1;B.boss.sel=0;}else done=false;} // menus: tap off the list = back
    else if(shopOpen){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*VW/r.width-BOXOX(),y=(ev.clientY-r.top)*VH/r.height,L=shopList(),rh=L.length>6?19:22;
      const i=Math.floor((y-49)/rh);if(x<28||x>292||y<10||y>214)tapKey('Escape','Escape'); // tap outside the shop: leave
      else if(i>=0&&i<L.length){shopSel=i;tapKey('Enter','Enter');}}
    else if(PW&&state==='city')done=false;
    else if(paused)tapKey('p','KeyP'); // tap the screen to resume
    else if(showMap)tapKey('m','KeyM'); // tap the map to close it
    else done=false;
    if(done){e.preventDefault();initAudio();lastTap=now;}};
  cv.addEventListener('touchstart',onTap,{passive:false});
  cv.addEventListener('pointerdown',onTap);
  // the TEST LEVELS menu moves to the top middle, out of the thumb pad's way
  {const tm=document.getElementById('testMenu');if(tm){tm.style.bottom='auto';tm.style.top='8px';tm.style.left='50%';tm.style.transform='translateX(-50%)';tm.style.flexDirection='column';tm.style.alignItems='center';}}
  // show the right set for what's on screen
  // (while the map is open only M stays, so you can close it again)
  let shown='';setInterval(()=>{const game=(state==='city'||state==='bank'||state==='lock'||state==='boat')&&!helpOpen&&!paused&&!shopOpen&&!PW&&!(state==='bank'&&B&&B.boss&&B.boss.ui),map=game&&showMap,play=game&&!showMap,duo=twoP&&game,want=(duo?'duo':'solo')+(play?'+':map?'m':'');
    if(want+CTRL.mode===shown)return;shown=want+CTRL.mode;for(const {z,end} of zones){end();}for(const {end} of sticks)end();
    const isStick=b=>sticks.some(q=>q.p===b),vis=b=>map?mapBtns.includes(b):play&&!(isStick(b)&&CTRL.mode==='drag');
    for(const b of sets.solo)b.style.display=duo||!vis(b)?'none':(zones.some(q=>q.z===b)?'block':'flex');
    for(const b of sets.duo)b.style.display=!duo||!vis(b)?'none':(zones.some(q=>q.z===b)?'block':'flex');},150);
  // ---- the SETTINGS button (top, next to HOW TO PLAY) and its panel
  const sb=document.createElement('button');sb.textContent='SETTINGS';
  sb.style.cssText='position:fixed;top:8px;z-index:9;background:#14142a;color:#c8a0ff;border:2px solid #c8a0ff;padding:4px 8px;font:bold 11px monospace;touch-action:none';
  document.body.appendChild(sb);
  sb.style.visibility='hidden';const placeSb=()=>{const h=document.getElementById('helpBtn').getBoundingClientRect();if(!h.width)return;sb.style.right=Math.round(innerWidth-h.left+8)+'px';sb.style.visibility='visible';};placeSb();addEventListener('resize',placeSb);setInterval(placeSb,500);
  const panel=document.createElement('div');
  panel.style.cssText='display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,10,.82);align-items:center;justify-content:center;font:bold 12px monospace;color:#fff;touch-action:none';
  panel.innerHTML='<div style="background:#14142a;border:3px solid #c8a0ff;padding:12px 16px;display:flex;gap:18px;align-items:center;max-width:94vw">'
    +'<div><div style="color:#c8a0ff;font-size:16px;margin-bottom:10px">SETTINGS</div>'
    +'<div style="color:#9fd3ff;margin-bottom:6px">MOVE THE THIEF WITH:</div><div id="setMode" style="display:flex;gap:6px;margin-bottom:12px"></div>'
    +'<div style="color:#9fd3ff;margin-bottom:6px">CIRCLE SIZE:</div><div id="setSize" style="display:flex;gap:6px;margin-bottom:12px"></div>'
    +'<div id="setNote" style="color:#889;font-size:11px;min-height:28px;max-width:330px"></div>'
    +'<button id="setDone" style="margin-top:8px;font:bold 13px monospace;padding:8px 18px;background:#ffd400;color:#000;border:0">DONE</button></div>'
    +'<div id="setPrev" style="width:200px;height:200px;display:flex;align-items:center;justify-content:center"></div></div>';
  document.body.appendChild(panel);
  const choice=(lab,on)=>'<button style="font:bold 11px monospace;padding:8px 8px;border:2px solid '+(on?'#ffd400':'#445')+';background:'+(on?'#3a3410':'#0a0a18')+';color:'+(on?'#ffd400':'#ccd')+'">'+lab+'</button>';
  const drawPanel=()=>{
    const M=[['drag','DRAG ANYWHERE'],['circle','CIRCLE'],['both','BOTH']];
    panel.querySelector('#setMode').innerHTML=M.map(([k,l])=>choice(l,CTRL.mode===k)).join('');
    panel.querySelector('#setSize').innerHTML=SIZES.map(([l],i)=>choice(l,CTRL.size===i)).join('');
    panel.querySelector('#setNote').textContent=CTRL.mode==='drag'?'SLIDE YOUR FINGER ANYWHERE ON THE SCREEN. (THE CIRCLE IS HIDDEN.)':CTRL.mode==='circle'?'PUSH THE KNOB IN THE CIRCLE (BOTTOM LEFT).':'USE THE CIRCLE, OR SLIDE ANYWHERE ELSE ON THE SCREEN.';
    const px=SIZES[CTRL.size][1];panel.querySelector('#setPrev').innerHTML='<div style="width:'+px+'px;height:'+px+'px;border-radius:50%;background:rgba(40,40,80,.45);border:2px solid rgba(255,212,0,.55);opacity:'+(CTRL.mode==='drag'?.35:1)+';display:flex;align-items:center;justify-content:center"><div style="width:'+Math.round(px*.36)+'px;height:'+Math.round(px*.36)+'px;border-radius:50%;background:rgba(255,212,0,.35);border:2px solid rgba(255,212,0,.8)"></div></div>';
    [...panel.querySelectorAll('#setMode button')].forEach((b,i)=>b.onpointerup=()=>{CTRL.mode=M[i][0];saveCtrl();drawPanel();});
    [...panel.querySelectorAll('#setSize button')].forEach((b,i)=>b.onpointerup=()=>{CTRL.size=i;saveCtrl();sizeSticks();drawPanel();});
    panel.querySelector('#setDone').onpointerup=()=>openSettings(false);};
  const openSettings=on=>{settingsOpen=on;panel.style.display=on?'flex':'none';for(const {end} of zones)end();for(const {end} of sticks)end();if(on)drawPanel();};
  let sbDown=false;sb.addEventListener('pointerdown',e=>{e.preventDefault();sbDown=true;initAudio();});
  sb.addEventListener('pointerup',e=>{if(sbDown)openSettings(!settingsOpen);sbDown=false;});sb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();});
  panel.addEventListener('pointerdown',e=>{if(e.target===panel)openSettings(false);}); // tap outside the box: close
  // the password lock needs a real keyboard on a phone: tap the box to type
  const pi=document.createElement('input');pi.id='pwInput';pi.placeholder='TAP HERE TO TYPE';pi.autocapitalize='off';pi.autocomplete='off';pi.spellcheck=false;
  pi.style.cssText='position:fixed;z-index:15;left:50%;top:12px;transform:translateX(-50%);width:min(80vw,420px);font:bold 16px monospace;padding:8px;background:#000;color:#7dff7d;border:2px solid #ffd400;border-radius:8px;display:none;text-align:center';
  document.body.appendChild(pi);
  pi.addEventListener('input',()=>{if(!PW)return;PW.typed=pi.value;if(pwNorm(PW.typed)===pwNorm(PW.phrase))pwSubmit();});
  pi.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();pwSubmit();}});
  const give=document.createElement('div');give.textContent='GIVE UP';give.style.cssText=base+'z-index:15;left:calc(50% + min(40vw,210px) + 8px);top:12px;width:70px;height:36px;font-size:11px;display:none';
  give.addEventListener('pointerdown',e=>{e.preventDefault();PW=null;say('YOU GAVE UP ON THE LOCK',1.5);});document.body.appendChild(give);
  setInterval(()=>{const on=!!PW&&state==='city';if(on&&pi.style.display==='none'){pi.value=PW.typed||'';}pi.style.display=on?'block':'none';give.style.display=on?'flex':'none';
    if(!on&&document.activeElement===pi){pi.blur();pi.value='';}},100);
})();
(document.fonts&&document.fonts.load?document.fonts.load("8px 'Press Start 2P'").catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
